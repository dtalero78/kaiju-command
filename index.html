  }
}

// ---------- fragmentos de Lodora ----------
// se desprenden de su cuerpo, derriten con ácido lo que tienen cerca y vuelven a fundirse con ella para
// curarla y hacerla crecer. Las armas normales sí les hacen daño
class Sludge {
  constructor(x, z, m) {
    this.id = ++uid; this.kind = 'larva'; this.sludge = true; this.m = m;
    this.x = m.x; this.z = m.z; this.y = m.h * 0.6; this.rot = rand(TAU);
    this.fly = { t: 0, x0: m.x, z0: m.z, x1: x, z1: z };
    this.maxHp = this.hp = m.cfg.split.hp * S.diff.mHp; this.r = 2; this.speed = 3.6 * S.diff.mSpd;
    this.target = null; this.retarget = 0; this.dead = false; this.t = rand(5); this.life = 0;
    const g = new THREE.Group(), WET = { rough: 0.22, metal: 0.35 };
    g.add(part(G.ico1, mat(0x3c4236, WET), 3.4, 2.2, 3.4, 0, 1, 0));
    g.add(part(G.ico1, mat(0x56604a, WET), 1.8, 1.4, 1.8, 0.6, 1.9, -0.3));
    for (const sx of [-1, 1]) g.add(part(G.oct, mat(0xff2a1a, GLOW(0xff1a0a, 2)), 0.35, 0.9, 0.3, sx * 0.45, 1.6, 1.5));
    noShadow(g);
    this.mesh = g; world.add(g);
    S.larvae.push(this);
  }
  isAir() { return false; }
  targetable() { return !this.dead && !this.fly; }
  aimAt() { return { x: this.x, y: 1.2, z: this.z }; }
  takeDamage(n) {
    if (this.dead) return;
    this.hp -= n;
    if (this.hp <= 0) this.die();
  }
  die(quiet) {
    if (this.dead) return;
    this.dead = true;
    if (!quiet) { for (let i = 0; i < 6; i++) puff(this.x, 1, this.z, { size: 1.6, grow: 2, life: 0.8, color: pick([0x3c4236, 0x6a7a4a, 0x8dff3a]), vx: rand(-3, 3), vy: rand(1, 4), vz: rand(-3, 3) }); SFX.splat(this); }
    removeObj(this.mesh);
  }
  update(dt) {
    if (this.dead) return;
    this.t += dt;
    const m = this.m;
    if (this.fly) {
      // sale volando del cuerpo de Lodora y cae salpicando
      const f = this.fly, k = Math.min(1, (f.t += dt) / 0.9);
      this.x = lerp(f.x0, f.x1, k); this.z = lerp(f.z0, f.z1, k); this.y = lerp(m.h * 0.6, 0, k) + Math.sin(k * Math.PI) * 10;
      if (k >= 1) { this.fly = null; this.y = 0; puff(this.x, 0.5, this.z, { size: 2.5, grow: 3, life: 0.8, color: 0x4a5a3a, vy: 1 }); SFX.splat(this); }
    } else {
      this.life += dt;
      this.retarget -= dt;
      if (this.retarget <= 0) {
        this.retarget = 1;
        // primero ataca lo que tenga cerca; después vuelve a fundirse con ella
        let best = null, bd = 26;
        if (this.life < 22) {
          for (const u of S.units) { if (u.dead || u.flying) continue; const d = dist(u.x, u.z, this.x, this.z); if (d < bd) { bd = d; best = u; } }
          if (!best) for (const b of S.blds) { const d = dist(b.x, b.z, this.x, this.z); if (d < 45 && d < bd + 20) { bd = d; best = b; } }
        }
        this.target = best || (m && !m.dead && m.state === 'active' ? m : null);
      }
      const t = this.target;
      if (t && !t.dead) {
        const merge = t === m, d = dist(t.x, t.z, this.x, this.z) - (t.r || 1) * (merge ? 0.8 : 1);
        this.rot = turnTo(this.rot, Math.atan2(t.x - this.x, t.z - this.z), dt * 3);
        if (merge && d < 1.5 && m.submerge < 0.5 && !m.isAir()) { m.absorb(this); this.die(true); return; }
        if (d > 1.4) {
          const nx = this.x + Math.sin(this.rot) * this.speed * dt, nz = this.z + Math.cos(this.rot) * this.speed * dt;
          this.x = nx; this.z = nz;
        } else if (!merge) {
          // su ácido derrite el metal
          t.damage(m.cfg.split.acid * S.diff.mDmg * dt, m);
          if (Math.random() < dt * 8) puff(this.x + rand(-1, 1), 1, this.z + rand(-1, 1), { add: true, size: 0.9, grow: 1, life: 0.5, color: 0x8dff3a, vy: 1.5 });
        }
      }
    }
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.rotation.y = this.rot;
    this.mesh.scale.set(1 + Math.sin(this.t * 5) * 0.08, 1 - Math.sin(this.t * 5) * 0.08, 1 + Math.sin(this.t * 5) * 0.08);
  }
}

// ---------- torres de cristal de SpaceGorzak ----------
// brotan del suelo, le mandan energía (lo curan) y tus tropas pueden destruirlas
class Crystal {
  constructor(x, z, giant = false, link = null) {

    for (let i = 0; i < (giant ? 9 : 6); i++) {
      const a = rand(TAU), r = rand(0, 1.6 * s), h = rand(6, 13) * s;
      const c = part(G.oct, this.mat, rand(1.6, 2.6) * s, h, rand(1.6, 2.6) * s, Math.sin(a) * r, h * 0.42, Math.cos(a) * r);
      c.rotation.set(rand(-0.3, 0.3), rand(TAU), rand(-0.3, 0.3)); g.add(c);
    }
    g.add(part(G.ico, 0x5a5468, 4 * s, 1.2, 4 * s, 0, 0.3, 0));

    S.larvae.push(this);
    chunks(x, 1, z, giant ? 30 : 16, 0x8a7a9a, { spread: 4 * s, size: 1, out: 8, up: 10 }); ring(x, z, 2, 14 * s, 0xc8a8ff, 0.8);
    areaDamage(x, z, this.r + 2, 40, giant ? 0 : 250);
    Cam.shake(0.7, x, z); SFX.stomp({ x, z });
  }
  isAir() { return false; }
  targetable() { return !this.dead && this.grow > 0.5; }
  aimAt() { return { x: this.x, y: this.giant ? 12 : 5, z: this.z }; }
  takeDamage(n) { if (this.dead) return; this.hp -= n; if (this.hp <= 0) this.shatter(); }
  shatter(quiet) {
    if (this.dead) return;
    this.dead = true;
    chunks(this.x, 4, this.z, this.giant ? 40 : 24, 0xd8b8ff, { spread: this.r, size: 1.2, out: 10, up: 12 });
    explosion(this.x, 3, this.z, this.giant ? 2.5 : 1.4); SFX.collapse(this);
    removeObj(this.mesh);
    this.linkBeam.hold = false; this.linkBeam.life = 0; this.linkBeam.g.visible = false;
    if (quiet) return;
    if (this.giant) msg('¡Destruiste el cristal gigante! SpaceGorzak pierde su conducto de energía... y la Torre de Fukuoka cae con él.', 'good');
    else msg('💎 ¡Torre de cristal destruida! SpaceGorzak se cura menos.', 'good');
    if (this.link && !this.link.dead) this.link.collapse();
  }
  update(dt) {
    if (this.dead) return;
    this.t += dt; this.grow = Math.min(1, this.grow + dt * 0.8);
    this.mesh.scale.set(1, Math.max(0.05, easeOut(this.grow)), 1);
    this.mat.emissiveIntensity = 0.7 + Math.sin(this.t * 3) * 0.3;
    const m = S.monster;
    if (m && !m.dead && m.cfg.crystals && m.state === 'active' && this.grow >= 1) {
      // haz de energía hacia SpaceGorzak
      setBeam(this.linkBeam, { x: this.x, y: this.giant ? 22 : 11, z: this.z }, m.aimAt(), 0.25 + Math.sin(this.t * 8) * 0.08, 0xb08aff, 0xffffff);
    } else this.linkBeam.g.visible = false;
  }
}

// Combate: daño en área, proyectiles, zonas de peligro, tormentas e incendios
// ---------- utilidades de combate ----------
function enemyDist(x, z, e) { return dist(x, z, e.x, e.z) - (e.r || 0); }
function nearestEnemy(x, z, range, ok, preferLarva) {
  let best = null, bd = 1e9;
  const m = S.monster;
  if (m && m.targetable() && ok(m)) { const d = enemyDist(x, z, m); if (d <= range) { best = m; bd = preferLarva ? d + 30 : d; } }
  for (const l of S.larvae) {
    if (!l.targetable() || !ok(l)) continue;
    const d = enemyDist(x, z, l);
    if (d <= range && d < bd) { bd = d; best = l; }
  }
  return best;
}
// daño en círculo a todo lo del jugador y de la ciudad
function areaDamage(x, z, r, dmgU, dmgB, o = {}) {
  for (const u of S.units) {
    if (u.dead || (u.alt > 3 && !o.air)) continue;
    const d = dist(u.x, u.z, x, z);
    if (d < r + u.r) {
      u.damage(dmgU * (o.falloff ? 1 - (0.5 * d) / r : 1), o.src);

// ---------- proyectiles ----------
const PROJ = {
  tracer: { geo: G.box, mat: () => basic(0xffe08a, { add: true }), s: [0.14, 0.14, 1.8], speed: 150 },
  shell: { geo: G.sphLo, mat: () => mat(0x2a2a2a), s: [0.45, 0.45, 0.45], speed: 95 },
  missile: { geo: G.box, mat: () => mat(0xe8e8e0), s: [0.3, 0.3, 1.6], speed: 60 },
  arc: { geo: G.sphLo, mat: () => mat(0x222222), s: [0.7, 0.7, 0.7], speed: 0 },
  acid: { geo: G.sph, mat: () => mat(0x8dff3a, GLOW(0x5dff1a, 1.4)), s: [1.8, 1.8, 1.8], speed: 0 },
  bomb: { geo: G.sphLo, mat: () => mat(0x3a3f2a), s: [0.55, 0.55, 1.2], speed: 0 },
  crystal: { geo: G.oct, mat: () => mat(0xe8c8ff, GLOW(0x8a5ad8, 1.2)), s: [0.9, 0.9, 3.2], speed: 0 },
  rocket: { geo: G.box, mat: () => mat(0xe8e8e0), s: [0.8, 0.8, 4.2], speed: 0 },
  feather: { geo: G.box, mat: () => mat(0x2a2628), s: [0.3, 0.5, 3.4], speed: 0 },
  kmissile: { geo: G.box, mat: () => mat(0xe8eaec), s: [0.45, 0.45, 2.2], speed: 0 },
  nano: { geo: G.box, mat: () => basic(0xffc94a, { add: true }), s: [0.18, 0.18, 2.2], speed: 170 },
  seed: { geo: G.ico1, mat: () => mat(0x6a8a3a, GLOW(0xd8e040, 0.6)), s: [1.6, 1.6, 1.6], speed: 0 },
};
const projPool = {};
function spawnProj(kind, from, target, dmg, src, o = {}) {
  const pool = projPool[kind] || (projPool[kind] = []);
  let p = pool.find((q) => !q.alive);
  if (!p) {
    const K = PROJ[kind];
    const m = new THREE.Mesh(K.geo, K.mat()); m.scale.set(...K.s); m.castShadow = false; scene.add(m);
    p = { m, kind }; pool.push(p);
  }
  const to = target && target.aimAt ? target.aimAt() : target;
  p.alive = true; p.m.visible = true;
  p.x = from.x; p.y = from.y; p.z = from.z; p.fx = from.x; p.fy = from.y; p.fz = from.z;
  p.target = target && target.aimAt ? target : null; p.tx = to.x; p.ty = to.y; p.tz = to.z;
  p.dmg = dmg; p.src = src; p.splash = o.splash || 0; p.plunging = !!o.plunging; p.t = 0; p.cb = o.onHit || null;

  p.apex = kind === 'arc' ? d * 0.42 + 6 : kind === 'bomb' ? 0 : kind === 'rocket' ? d * 0.45 + 25 : kind === 'feather' ? 1 : kind === 'kmissile' ? 16 + d * 0.15 + rand(0, 8) : d * 0.3 + 4;
  p.m.position.set(p.x, p.y, p.z);

  return p;
}
function updateProjs(dt) {
  for (let i = S.projs.length - 1; i >= 0; i--) {
    const p = S.projs[i];
    if (p.target && !p.target.dead && p.kind !== 'arc' && p.kind !== 'acid' && p.kind !== 'bomb' && p.kind !== 'crystal') { const a = p.target.aimAt(); p.tx = a.x; p.ty = a.y; p.tz = a.z; }
    if (p.kind === 'rocket' && Math.random() < dt * 40) puff(p.x, p.y, p.z, { size: 1.2, grow: 2.5, life: 1.4, color: 0xd8d6cc, vx: 0, vy: 0.3, vz: 0 });
    // los misiles de Kiryū siguen al monstruo y dejan una estela de humo
    if (p.kind === 'kmissile') {
      if (p.target && !p.target.dead) { const a = p.target.aimAt(); p.tx = a.x; p.ty = a.y; p.tz = a.z; }
      if (Math.random() < dt * 30) puff(p.x, p.y, p.z, { size: 0.9, grow: 2, life: 1, color: 0xd8d6cc, vx: 0, vy: 0.3, vz: 0 });
    }
    let hit = false;
    if (p.dur) {
      p.t += dt;

      const nx = lerp(p.fx, p.tx, k), nz = lerp(p.fz, p.tz, k), ny = lerp(p.fy, p.ty, p.kind === 'bomb' ? k * k : k) + p.apex * 4 * k * (1 - k);

      p.x = nx; p.y = ny; p.z = nz;
      if (Math.random() < dt * 25) puff(p.x, p.y, p.z, p.kind === 'acid' ? { add: true, size: 1, grow: 1, life: 0.4, color: 0x8dff3a, vy: 0 } : { size: 0.8, grow: 1.5, life: 0.6, color: 0x9a9a90, vy: 0.3 });

      const sp = PROJ[p.kind].speed * dt;

      if (d <= sp + 0.5) { p.x = p.tx; p.y = p.ty; p.z = p.tz; hit = true; }
      else { p.m.lookAt(p.tx, p.ty, p.tz); p.x += (dx / d) * sp; p.y += (dy / d) * sp; p.z += (dz / d) * sp; }
      if (p.kind === 'missile' && Math.random() < dt * 40) puff(p.x, p.y, p.z, { size: 0.7, grow: 1.6, life: 0.7, color: 0xd0d0c8, vx: 0, vy: 0.4, vz: 0 });
    }

}
function projHit(p) {

    if ((p.kind !== 'arc' && p.kind !== 'bomb') || enemyDist(p.x, p.z, t) < p.splash + 1) t.takeDamage(p.dmg, p.src, { plunging: p.plunging, from: p.src, weapon: p.kind });
  }
  if (p.splash) for (const l of S.larvae) if (l !== t && l.targetable() && dist(l.x, l.z, p.x, p.z) < p.splash) l.takeDamage(p.dmg * 0.7, p.src);
  if (p.kind === 'tracer') puff(p.x, p.y, p.z, { add: true, size: 0.6, grow: 0.6, life: 0.12, color: 0xffd080, vx: 0, vy: 0, vz: 0 });
  else if (p.kind === 'nano') puff(p.x, p.y, p.z, { add: true, size: 0.8, grow: 0.8, life: 0.15, color: 0xffc94a, vx: 0, vy: 0, vz: 0 });
  else if (p.kind === 'shell') { fireBurst(p.x, p.y, p.z, 4, 1.4); puff(p.x, p.y, p.z, { size: 1.6, grow: 2.5, color: 0x5a5a5a, life: 0.9 }); }
  else if (p.kind === 'missile') explosion(p.x, p.y, p.z, 0.6, false);
  else if (p.kind === 'arc') { explosion(p.x, p.y, p.z, 1.1); ring(p.x, p.z, 1, 7, 0xffc080, 0.4); }
  else if (p.kind === 'bomb') { explosion(p.x, p.y, p.z, 1.5); ring(p.x, p.z, 1, 10, 0xffc080, 0.45); }
}

// ---------- botones de las armas de Kiryū ----------
// cada arma especial: dónde se guarda cuánto falta para que esté lista, qué la lanza y si no alcanza a lo que vuela
const ABILITIES = {
  barrage: { key: 'cdBarrage', use: (u, m) => u.barrage(m) },

  zero: { key: 'cdZero', use: (u, m) => u.startZero(m) },
  slide: { key: 'cdSlide', use: (u, m) => u.startSlide(m), ground: 'La patada voladora no alcanza a un monstruo que vuela.' },

function mechAbility(u, w) {
  const m = S.monster, d = u.def, A = ABILITIES[w], key = A.key;

  if ((u[key] ?? 0) > 0) { SFX.error(); msg(`Todavía no está listo: faltan ${Math.ceil(u[key])} s.`, 'warn'); return; }
  if (!m || !m.targetable()) { SFX.error(); msg('Ahora no hay un monstruo al que apuntar.', 'warn'); return; }
  if (A.ground && m.isAir() && !m.held) { SFX.error(); msg(A.ground, 'warn'); return; }
  SFX.click();

// ---------- el ORCA y MegaroGorzak ----------
// si se puede llamar ahora (y qué decir en el botón)
function megaroStatus(b) {
  const c = costOf(UNITS.megarogorzak);
  if (!b.done) return { ok: false, txt: 'En construcción' };
  if (S.megaroCall) return { ok: false, txt: '📡 Llamando…' };
  if (S.units.some((u) => u.type === 'megarogorzak' && !u.dead)) return { ok: false, txt: 'Peleando' };
  if (S.megaroBack > 0) return { ok: false, txt: `Curándose · ${Math.ceil(S.megaroBack)} s` };
  return { ok: canAfford(c), txt: costTxt(c) };
}
// el ORCA imita el llamado de los kaijus: unos segundos después, MegaroGorzak responde y viene a pelear
function callMegaro(b) {
  if (!b || b.dead) return;
  const c = costOf(UNITS.megarogorzak), st = megaroStatus(b);
  if (!st.ok) {
    SFX.error();
    msg(!b.done ? 'El ORCA todavía se está construyendo.' : S.megaroCall ? 'El ORCA ya está llamando.' : S.megaroBack > 0 ? `MegaroGorzak se está curando en el mar: podrás llamarlo otra vez en ${Math.ceil(S.megaroBack)} s.` : S.units.some((u) => u.type === 'megarogorzak' && !u.dead) ? 'MegaroGorzak ya está peleando a tu lado.' : `Te falta dinero: llamar a MegaroGorzak cuesta ${c[0]}.`, 'warn');
    return;
  }
  pay(c);
  S.megaroCall = { b, t: 0, dur: 4.5, pulse: 0 };
  SFX.orca(b, 4.5); SFX.radio();
  msg('📡 El ORCA emite el llamado de los kaijus…', 'radar');
  if (!S.noCine && !Cine.cur && !S.orcaCine) { S.orcaCine = true; orcaCinematic(b); }
  UI.selDirty = true;
}
function updateMegaroCall(dt) {
  if (S.megaroBack > 0) S.megaroBack -= dt;
  const c = S.megaroCall;
  if (!c) return;
  c.t += dt; c.pulse -= dt;
  if (c.pulse <= 0 && !c.b.dead) { c.pulse = 0.5; ring(c.b.x, c.b.z, 2, 80, 0x5ad8ff, 1.8, 0.5, 0.7); }
  if (c.t < c.dur) return;
  S.megaroCall = null;
  megaroArrive(c.b);
  UI.selDirty = true;
}
// dónde aparece: sale del mar por la orilla más cercana a la pelea o, si no hay mar, de la tierra entre el monstruo y el ORCA
function megaroArrive(b) {
  const m = S.monster && S.monster.state === 'active' ? S.monster : null, M = S.map, home = b || { x: Cam.x, z: Cam.z };
  const ref = m || home;
  let x, z, z0, z1, sea = false;
  if (M.sea) {
    sea = true; x = clamp(ref.x + rand(-20, 20), -100, 100);
    for (const dx of [0, 12, -12, 24, -24, 36, -36, 48, -48]) if (Nav.walk(clamp(x + dx, -100, 100), M.coastZ(x + dx) + 7)) { x = clamp(x + dx, -100, 100); break; }
    z1 = M.coastZ(x) + 7; z0 = z1 - 16; z = z0;
  } else {
    if (m) { const a = Math.atan2(home.x - m.x, home.z - m.z); x = m.x + Math.sin(a) * 40; z = m.z + Math.cos(a) * 40; }
    else { x = home.x; z = home.z - 26; }
    x = clamp(x, -105, 105); z = clamp(z, -105, 105);
    if (!Nav.walk(x, z)) { const f = Nav.nearestFree(Nav.cell(x), Nav.cell(z), 25); if (f) { x = Nav.center(f[0]); z = Nav.center(f[1]); } }
  }
  const u = new Unit('megarogorzak', x, z);
  u.rot = m ? Math.atan2(m.x - x, m.z - (z1 ?? z)) : sea ? 0 : Math.PI;
  u.alt = -27; u.rise = { t: 0, dur: 2.8, sea, z0, z1 };
  if (!S.noCine && !Cine.cur && !S.megaroCine) { S.megaroCine = true; megaroCinematic(u); } else Music.sting('megaro');
  msg('🦖 ¡MegaroGorzak responde al llamado del ORCA y viene a pelear a tu lado!', 'good');
  return u;
}
// cuando se va: se hunde despacio echando espuma (o polvo) y desaparece
function updateSinkers(dt) {
  for (let i = S.sinkers.length - 1; i >= 0; i--) {
    const s = S.sinkers[i];
    s.t += dt;
    s.m.position.y = -s.t * s.t * 2.2;
    s.m.rotation.x = Math.min(0.35, s.t * 0.12);
    if (Math.random() < dt * 14) puff(s.x + rand(-8, 8), 0.6, s.z + rand(-8, 8), s.sea ? { size: 3, grow: 4, life: 1.2, color: 0xe8f4f8, vy: rand(3, 8), grav: 8 } : { size: 4, grow: 6, life: 2, color: 0x9a8a70, vy: rand(1, 3) });

// ---------- escarcha del cañón de cero absoluto ----------
// un disco blanco azulado que crece en el suelo, echa vaho frío y se derrite poco a poco

}
function updateFrost(dt) {
  for (let i = S.frosts.length - 1; i >= 0; i--) {

// ---------- misiles y bombas del Silo ----------
// impacto: daña al monstruo y a los enemigos pequeños de alrededor (nunca a la ciudad ni a tus tropas)

  const t = p.target;
  if (t && !t.dead && t.targetable() && enemyDist(p.x, p.z, t) < p.splash + 2) t.takeDamage(p.dmg, p.src, { plunging: true, from: p.src, weapon: p.kind });
  for (const l of S.larvae) if (l !== t && l.targetable() && dist(l.x, l.z, p.x, p.z) < p.splash) l.takeDamage(p.dmg * 0.7, p.src);
  explosion(p.x, p.y, p.z, size, size >= 1.5 || Math.random() < 0.3);
  if (size >= 1.5) { ring(p.x, p.z, 2, p.splash * 1.6, 0xffc080, 0.6); scorch(p.x, p.z, 3.5); Cam.shake(0.9, p.x, p.z); }
}
function launchMissile(b) {
  const m = S.monster, d = UNITS.misil;

  if (!m || !m.targetable()) { SFX.error(); msg('Ahora no hay un monstruo al que apuntar.', 'warn'); return; }
  S.ammo.misil--;
  spawnProj('rocket', { x: b.x, y: 4, z: b.z }, m, d.dmg * S.mods.dmg, b, { splash: d.splash, onHit: (p) => ordnanceHit(p, 2.2) });
  for (let i = 0; i < 10; i++) puff(b.x + rand(-2, 2), 1, b.z + rand(-2, 2), { size: 3, grow: 4, life: 1.8, color: 0xd8d6cc, vx: rand(-3, 3), vy: rand(1, 3), vz: rand(-3, 3) });
  puff(b.x, 3, b.z, { add: true, size: 4, grow: 3, life: 0.4, color: 0xffd080, vx: 0, vy: 0, vz: 0 });
  SFX.missile(b); Cam.shake(0.4, b.x, b.z);
  msg(`🚀 ¡Misil lanzado contra ${m.cfg.name}!`, ''); UI.selDirty = true;
}
function launchBomber(b) {
  const m = S.monster, d = UNITS.bomba;

  // el bombardero entra por el borde del mapa más cercano al Silo y va directo al monstruo
  const plane = mergeStatic(UModels.avion()); plane.scale.setScalar(1.7); world.add(plane);
  const x = clamp(b.x + rand(-20, 20), -115, 115), z = 140;
  S.flyovers.push({ m: plane, x, z, alt: 34, ang: Math.atan2(m.x - x, m.z - z), tgt: m, src: b, dmg: d.dmg * S.mods.dmg, splash: d.splash, dropped: false, t: 0 });
  SFX.sweep();
  msg(`💣 ¡Un bombardero va hacia ${m.cfg.name}!`, ''); UI.selDirty = true;

function updateFlyovers(dt) {
  for (let i = S.flyovers.length - 1; i >= 0; i--) {
    const f = S.flyovers[i], m = f.tgt;
    f.t += dt;
    if (!f.dropped && m && !m.dead) f.ang = turnTo(f.ang, Math.atan2(m.x - f.x, m.z - f.z), dt * 1.5);
    f.x += Math.sin(f.ang) * 42 * dt; f.z += Math.cos(f.ang) * 42 * dt;
    if (!f.dropped && m && dist(f.x, f.z, m.x, m.z) < 7) {

      } else { S.ammo.bomba++; msg('El bombardero no encontró al monstruo y volvió con la bomba.', 'warn'); UI.selDirty = true; }
    }
    if (Math.random() < dt * 20) puff(f.x - Math.sin(f.ang) * 5, f.alt, f.z - Math.cos(f.ang) * 5, { size: 1, grow: 2, life: 0.8, color: 0xcfcfc8, vx: 0, vy: 0, vz: 0 });

              const mid = { x: (_HV.x + e.x) / 2 + rand(-1.8, 1.8), y: (_HV.y + e.y) / 2 + rand(-1.8, 1.8), z: (_HV.z + e.z) / 2 + rand(-1.8, 1.8) };
              const w = b.w * 0.3 * (0.8 + Math.random() * 0.4), from = { x: _HV.x, y: _HV.y, z: _HV.z };
              setBeam(a.hs[i * 2], from, mid, w, b.color, b.core);
              setBeam(a.hs[i * 2 + 1], mid, e, w, b.color, b.core);
            });
          } else setBeam(a.h, o, end, b.w * 0.55 * (0.85 + Math.random() * 0.3), b.color, b.core);
          this.glow = 1; if (!tail) this.jaw = 1;
          a.tick -= dt;
          if (a.tick <= 0) {
            a.tick = 0.15;
            lineDamage(o.x, o.z, end.x, end.z, b.w, b.dmg * 0.15 * this.dmgMul, b.bdmg * 0.15 * this.dmgMul, true, this.kaiju.ignite || 0);
            const k = rand(0.3, 1);
            scorch(lerp(o.x, end.x, k), lerp(o.z, end.z, k), rand(2, 3.5));
          }
          puff(end.x, 1, end.z, { add: true, size: 4, grow: 6, life: 0.35, color: b.color, vy: 3 });
          if (Math.random() < 0.5) puff(end.x, 1, end.z, { size: 3, grow: 6, life: 1.5, color: 0x5a5650, vy: 4 });
        }
        if (a.t >= a.dur) { this.endAction(); }
        break;
      }
      case 'shinbreath': this.updShinBreath(a, dt); break;
      case 'nuke': this.updNuke(a, dt); break;
      case 'roll': this.updRoll(a, dt); break;
      case 'dive': this.updDive(a, dt); break;
      case 'sap': this.updSap(a, dt); break;
      case 'dig': this.updDig(a, dt); break;
      case 'grabthrow':

          puff(h.x + Math.sin(ang) * f.r * k, ty, h.z + Math.cos(ang) * f.r * k, { add: true, size: 2 + k * 4, grow: 3, life: 0.45, vx: Math.sin(ang) * 8, vy: rand(-1, 2), vz: Math.cos(ang) * 8, color: pick([0xff8a20, 0xffc040, 0xff4a10]) });
        }
        if (a.tick <= 0) {
          a.tick = 0.15;
          coneDamage(this.x, this.z, this.rot, f.r, f.ang, f.dmg * 0.15 * this.dmgMul, f.bdmg * 0.15 * this.dmgMul, true, 0.06);

        }
        if (a.t >= a.dur) this.endAction();

      }
      case 'gust': {

  crush(dt) {

    for (const b of S.map.city) if (!b.dead && circleRect(this.x, this.z, rr, b.x, b.z, b.w, b.d)) b.damage(dmg);
    for (const b of S.blds) if (!b.dead && circleRect(this.x, this.z, rr, b.x, b.z, b.w, b.d)) b.damage(dmg);
    for (const u of S.units) if (!u.dead && u.alt < 3 && dist(u.x, u.z, this.x, this.z) < rr + u.r * 0.5) u.damage(150 * dt * this.dmgMul);
  }

  // ---------- comportamiento especial de cada monstruo (ver KAIJU en 71-kaijus.js) ----------
  kindUpdate(dt) {
    const u = this.kaiju.update;
    return u ? this[u](dt) : false;
  }

  updDying(dt) {
    this.dyingT += dt;

    if (this.alt > 0) { this.alt = Math.max(0, this.alt - dt * 14); if (this.alt === 0) { Cam.shake(1.5, this.x, this.z); ring(this.x, this.z, 3, 26, 0xd8c8a8, 1); smoke(this.x, 1, this.z, 16, 10, 0x9a8a70, 3); } }

  sync(dt) {

      if (!this.kaiju.stepShake || this.kaiju.stepShake(this)) { Cam.shake(0.35, fx, fz); if (Math.random() < 0.5) SFX.stomp({ x: fx, z: fz }); }
    }
    if (!(this.action && (this.action.kind === 'beam' || this.action.kind === 'tailbeam' || this.action.kind === 'shinbreath' || this.action.kind === 'nuke'))) {
      this.glow = Math.max(0, this.glow - dt * 1.5);
      this.jaw = Math.max(0, this.jaw - dt * 1.5);

    if (this.engage && !this.engage.dead) this.headYaw = lerp(this.headYaw, clamp(angleDiff(this.rot, Math.atan2(this.engage.x - this.x, this.engage.z - this.z)), -0.6, 0.6), dt * 3);
    else this.headYaw *= 0.95;
    this.model.anim(this, dt);
    // al caminar por el mar, se hunde un poco
    const g = this.alt > 0.5 ? 0 : Math.min(0, S.map.groundH(this.x, this.z)) * 0.7;
    this.wade = lerp(this.wade || 0, g, Math.min(1, dt * 3));
    root.position.set(this.x, this.alt + this.yOff + this.wade, this.z);
    root.rotation.y = this.rot;
    if (this.kaiju.visual) this[this.kaiju.visual](dt);

}
// ---------------------------------------------------------------------
//  Lo especial de cada kaiju, en un solo lugar
// ---------------------------------------------------------------------
//  La clase Monster es igual para todos; esta tabla dice qué cambia en cada uno:
//   flyer            vuela todo el tiempo
//   update           método con su comportamiento propio (se llama en cada paso)
//   counter          cómo se defiende de un robot que se acerca: 'throw', 'lift', 'pinch' o 'web'
//   monumentLove     cuánto le atraen los monumentos al elegir objetivo
//   ignite           probabilidad de incendiar edificios con su rayo
//   cone(m, air)     si puede usar su cono de fuego ahora · dives: se lanza en picada · coneHead: cabeza que escupe
//   onHit(m, n, src, info)  ajusta el daño que recibe · afterHit(m): true si ya se ocupó (Shin no muere)
//   onDie(m) · onRelease(m): al soltarse de las anclas · aim(m): punto al que apuntarle · dying: método de su muerte
//   init(m) · melee(m) / beamReady(m): si ya puede pelear o usar su rayo · breath: método de su aliento especial
//   pitch(m): tono del rugido · turn(m): velocidad de giro · stepShake(m): si hace temblar el suelo al caminar
//   immortal: no puede morir · status(m): texto extra en la barra de vida · hpMarks: marcas en la barra de vida
//   lowEntrance: la cámara de su llegada va más baja (Shin empieza pequeño)
//   visual: método que se llama en cada cuadro para dibujar partes propias (las lianas de Biolantra)
const KAIJU = {
  gorzak: { ignite: 0.08 },
  pyraxis: {
    flyer: true, update: 'updPyraxis', cone: (m, air) => air, dives: true,
    onRelease: (m) => { m.fstate = 'takeoff'; m.ft = 0; },
  },
  krakor: { update: 'updKrakor', counter: 'pinch' },
  noctra: { flyer: true, update: 'updNoctra', counter: 'web', monumentLove: 16 },
  trihydra: {
    update: 'updTrihydra', ignite: 0.08, cone: () => true, coneHead: 1,
    onRelease: (m) => { if (m.fstate !== 'ground') { m.fstate = 'ground'; m.cd.flight = m.cfg.flight.every; } },
  },
  medugora: {
    flyer: true, update: 'updMedugora', counter: 'lift', monumentLove: 16,
    status: (m) => (m.fstate === 'feed' ? ' · ABSORBIENDO' : ''),
  },
  spacegorzak: {
    update: 'updSpace',
    // escudo fotorreactivo: casi no le entra el daño y a veces rebota el ataque contra quien lo lanzó;
    // dentro del capullo de cristal (cuando vuela) recibe la mitad
    onHit: (m, n, src, info) => {
      if (m.shield > 0) {
        const from = info.from || src;
        if (from && !from.dead && from.kind === 'unit' && Math.random() < 0.3) {
          const a = m.aimAt();
          beam({ x: a.x, y: a.y, z: a.z }, from.aimAt(), 0x9ad8ff, 0.4, 0.25, 0xffffff);

        }

        if (!S.shieldHint) { S.shieldHint = true; msg('¡El escudo rebota tus ataques! Espera a que se apague para atacar con todo.', 'warn'); }
      }

    },
    onDie: (m) => {

    },
    status: (m) => (m.shield > 0 ? ' · ESCUDO' : m.isAir() ? ' · VOLANDO EN CRISTAL' : ''),
  },
  voidhydra: {
    flyer: true, update: 'updVoid', dying: 'updVoidDying',
    // allá arriba casi nada le hace daño; cuando una cabeza baja a morder queda expuesta
    onHit: (m, n) => {
      if (!m.exposed && !S.voidHint && S.battleT > 6) { S.voidHint = true; msg('¡El daño casi no le hace nada allá arriba! Espera a que una cabeza baje a morder: ahí queda expuesta.', 'warn'); }
      return n * (m.exposed ? 1.4 : 0.3);

    aim: (m) => (m.bite && m.exposed ? { x: m.bite.tgt.x, y: 6, z: m.bite.tgt.z } : null),
    status: (m) => (m.exposed ? ' · ¡EXPUESTO!' : ''),
  },
  minus: {
    update: 'updMinus', breath: 'startNuke', ignite: 0.1,
    init: (m) => {
      m.cd.beam = 20; m.burn = 0; m.rise = 0;
      // la luz de la bola de fuego (se crea apagada para que no haya tirones al encenderla)
      m.light = new THREE.PointLight(0xffd0a0, 0, 0, 2); m.light.position.set(0, -60, 0); world.add(m.light);
    },
    // el daño que recibe mientras carga puede interrumpir el aliento; QUEMADO recibe +50 %
    onHit: (m, n) => {
      const k = m.burn > 0 ? n * 1.5 : n, a = m.action;
      if (a && a.kind === 'nuke' && !a.fired) a.taken += k;
      return k;
    },
    status: (m) => (m.action && m.action.kind === 'nuke' && !m.action.fired ? ' · ¡ALIENTO ATÓMICO!' : m.burn > 0 ? ' · QUEMADO' : ''),
  },
  biolante: {
    update: 'updBiolante', counter: 'engulf', dying: 'updBiolanteDying', visual: 'updVinesFx', monumentLove: 8, hpMarks: [0.55],
    init: (m) => { m.form = 1; m.cd.sap = 6; m.cd.seeds = 14; m.cd.cone = 8; m.speed = 0; m.burnUntil = 0; m.makeVines(); },
    // el fuego la quema (más daño) y el fuego y el máser le cortan la curación unos segundos
    onHit: (m, n, src, info) => {
      const w = info.weapon || (src && src.def && src.def.proj);
      if (w === 'flame' || w === 'maser') {
        m.burnUntil = S.time + 6;
        if (!S.burnHint) { S.burnHint = true; msg('🔥 ¡El fuego y el máser le cortan la curación! Los Lanzallamas además la queman con más daño.', 'good'); }
      }
      if (!S.regenHint && S.battleT > 10 && m.form === 1) { S.regenHint = true; msg('🌿 ¡Biolantra se cura sola! Quémala con Lanzallamas o Tanques Máser para cortarle la curación.', 'warn'); }
      return w === 'flame' ? n * m.cfg.fire : n;
    },
    onDie: (m) => { for (const l of S.larvae) if (l.sprout) l.die(); },
    status: (m) => (m.form === 2 ? ' · FORMA FINAL' : ' · FORMA DE ROSA') + (S.time < (m.burnUntil || 0) ? ' · QUEMÁNDOSE' : ''),
  },
  condor: {
    flyer: true, update: 'updCondor', counter: 'lift',
    init: (m) => { m.cd.dive = 10; m.cd.feathers = 4; m.cd.screech = 12; },
    status: (m) => (m.action && m.action.kind === 'dive' && m.busy > 0 ? (m.isAir() ? ' · EN PICADA' : ' · ¡A TU ALCANCE!') : ''),
  },
  anguirax: {
    update: 'updAnguirax', counter: 'bite',
    init: (m) => { m.cd.roll = 10; m.cd.dig = m.cfg.dig.every; m.ball = 0; m.rollSpeed = 0; },
    // hecho bola casi no recibe daño; mareado recibe más; las púas protegen la espalda y pinchan a los robots
    onHit: (m, n, src, info) => {

        if (from.def && from.def.proj === 'punch' && !from.dead) from.damage(sp.sting * m.dmgMul);
        if (!S.spikeHint && S.battleT > 8) { S.spikeHint = true; msg('¡Las púas de su espalda frenan el daño! Atácalo de frente o por los lados, o con Artillería.', 'warn'); }
        return n * sp.mult;
      }

    },
    onDie: (m) => { m.ball = 0; m.submerge = 0; m.yOff = 0; },
    status: (m) => (m.submerge > 0.5 ? ' · BAJO TIERRA' : m.ball > 0.5 ? ' · RODANDO' : m.stun > 0 && m.dizzy ? ' · MAREADO' : ''),
  },
  lodora: {
    update: 'updLodora', counter: 'engulf', dying: 'updLodoraDying', monumentLove: 9,
    init: (m) => { m.cd.eyes = 3; m.cd.sludge = 5; m.cd.split = 12; m.cd.flight = m.cfg.flight.every; m.size = 1; m.saucer = 0; m.splitAcc = 0; },
    // casi inmune a las armas normales: solo la secan la energía del máser y el fuego
    onHit: (m, n, src, info) => {
      // info.weapon dice con qué la golpearon (proyectiles, misiles, el máser de Kiryū...); si no, el arma de la unidad
      const d = src && src.def, p = d && d.proj, c = m.cfg, w = info.weapon || p;

      else if (d && d.mech) k = 0.6;   // todo lo de los robots gigantes (golpes, misiles, taladro, cañón)
      if (k < 1 && !S.lodoraHint && S.battleT > 5) { S.lodoraHint = true; msg('¡Las balas, los misiles y los obuses casi no le hacen nada! Usa Tanques Máser y Lanzallamas: la energía y el calor la secan.', 'warn'); }

      m.splitAcc += r;
      if (m.splitAcc >= m.maxHp * c.split.onDamage) { m.splitAcc = 0; m.splitOff(2); }
      return r;
    },
    onDie: (m) => { for (const l of S.larvae) if (l.sludge) l.die(); m.saucer = 0; },
    status: (m) => (m.perfect ? ' · FORMA PERFECTA' : '') + (m.isAir() ? ' · VOLANDO' : '') + (m.size > 1.02 ? ` · TAMAÑO ×${m.size.toFixed(1)}` : ''),
    hpMarks: [0.5],
  },
  shin: {
    update: 'updShin', breath: 'startShinBreath', immortal: true, lowEntrance: true, hpMarks: [0.66, 0.33],
    init: (m) => { m.form = 1; m.r = 6; m.h = 10; m.speed = 4.4 * S.diff.mSpd; },
    // no muere: evoluciona al perder vida y al final queda agotado
    afterHit: (m) => {
      if (m.form === 1 && m.hp <= m.maxHp * 0.66) { m.hp = m.maxHp * 0.66; m.evolve(2); }
      else if (m.form === 2 && m.hp <= m.maxHp * 0.33) { m.hp = m.maxHp * 0.33; m.evolve(3); }
      else if (m.hp <= 0) { m.hp = 0; m.becomeExhausted(); }
      return true;
    },
    melee: (m) => m.form >= 2, beamReady: (m) => m.form === 3,
    pitch: (m) => [1.4, 0.8, 0.6][m.form - 1], turn: (m) => (m.form === 1 ? 1.4 : null), stepShake: (m) => m.form > 1,

// ---------- comportamientos propios ----------
Object.assign(Monster.prototype, {
  // ---------- Shin Gorzak ----------
  evolve(n) {

  },
  setForm(n) {
    this.form = n;

    if (n === 3) { this.r = 8.5; this.h = 34; this.speed = 2.3 * S.diff.mSpd; this.cd.beam = 6; this.cd.lasers = 1; }
  },
  becomeExhausted() {
    this.exhausted = true; this.exhaustT = S.diff.exhaust; this.freeze = 0;
    this.endAction(); this.moving = false;
    SFX.roar(0.5, this, 3);
    msg(`¡SHIN GORZAK ESTÁ AGOTADO! Manda los Camiones congelantes YA: tienes ${S.diff.exhaust} segundos. Necesitas ${S.diff.trucks}.`, 'danger');
    Music.play(levelSong('critical'));
  },
  inject() {
    this.freeze++;

    for (let i = 0; i < 16; i++) puff(this.x + rand(-6, 6), rand(2, 20), this.z + rand(-6, 6), { add: true, size: 3, grow: 4, life: 1.2, color: 0xbfefff, vy: rand(0, 3) });
    ring(this.x, this.z, 3, 16, 0xbfefff, 0.8);
    msg(`Agente congelante inyectado: ${this.freeze}/${S.diff.trucks}`, 'radar');
    if (this.freeze >= S.diff.trucks) { this.exhausted = false; this.dead = true; this.state = 'frozen'; endBattle(true); }
  },
  // ataque final de Shin: resplandor → humo negro → ola de fuego → láser

        if (this.cd.pulse <= 0 && this.unitsNear(this.x, this.z, c.pulse.r, true) > 0) {
          this.cd.pulse = c.pulse.cd;
          areaDamage(this.x, this.z, c.pulse.r, c.pulse.dmg * this.dmgMul, 0, { air: true, falloff: true, src: this });
          for (const k of [0, 0.15, 0.3]) later(k, () => ring(this.x, this.z, 2, c.pulse.r * 1.1, 0x7fe8ff, 0.6, 0.6));
          this.glow = 1; flash(0.08, '#bff'); SFX.laser(this);

        if (this.cd.feed <= 0 && g && !g.dead && dist(this.x, this.z, g.x, g.z) < 12) {
          this.fstate = 'descend'; this.ft = 0; this.endAction();

      case 'descend':

      case 'feed': {
        this.moving = false; this.glow = 0.6 + Math.sin(this.t * 6) * 0.3;
        const f = c.feed;
        this.feedT -= dt;
        if (this.feedT <= 0) {
          this.feedT = 0.25;
          let ate = 0;
          for (const b of S.map.city) if (!b.dead && dist(b.x, b.z, this.x, this.z) < f.r + b.r) { b.damage(f.bdmg * 0.25 * this.dmgMul); ate++; if (b.dead) this.hp = Math.min(this.maxHp, this.hp + this.maxHp * f.heal); }
          for (const b of S.blds) if (!b.dead && dist(b.x, b.z, this.x, this.z) < f.r + b.r) b.damage(f.bdmg * 0.12 * this.dmgMul);
          areaDamage(this.x, this.z, f.r, 25 * this.dmgMul, 0, { src: this });
          // los escombros suben hacia la medusa
          for (let i = 0; i < 3 + ate; i++) { const a = rand(TAU), r = rand(2, f.r); puff(this.x + Math.sin(a) * r, rand(1, 4), this.z + Math.cos(a) * r, { size: 1.6, grow: -0.6, life: 1.6, color: pick([0x8a8478, 0x9a4a32, 0x6a6a70]), vx: -Math.sin(a) * r * 0.4, vy: 9, vz: -Math.cos(a) * r * 0.4 }); }
          puff(this.x + rand(-4, 4), rand(8, 14), this.z + rand(-4, 4), { add: true, size: 2.5, grow: 2, life: 0.4, color: 0x7fe8ff, vy: 3 });

      }
      case 'ascend':

    }
    return false;
  },
  // Trihydra del Vacío: muerde con una cabeza a la vez (y queda expuesta), lanza relámpagos y abre agujeros negros
  updVoid(dt) {
    const c = this.cfg;
    this.alt = lerp(this.alt, c.flyAlt, Math.min(1, dt));
    // a mitad de la batalla se enfurece: muerde más rápido, lanza más relámpagos y abre más agujeros negros
    if (!this.fury && this.hp < this.maxHp * c.furyAt) {
      this.fury = true;
      this.model.necks.material.emissiveIntensity = 1.3;
      for (const pg of this.model.portals) pg.userData.big = 1.2;
      flash(0.5, '#ffe08a'); ring(this.x, this.z, 4, 70, 0xffd890, 1.4); Cam.shake(1.6, this.x, this.z);
      SFX.roar(this.pitch() * 0.8, this, 3.2);
      msg('¡LA TRIHYDRA DEL VACÍO SE ENFURECE! Muerde más rápido y abre más agujeros negros.', 'danger');
    }
    const fury = this.fury ? 1 : 0;
    const b = this.bite;
    if (b) {
      b.t += dt;
      const p = b.t / b.dur;
      this.exposed = p > 0.2 && p < 0.9;
      if (!b.hit && p >= 0.45) {
        b.hit = true;
        const t = b.tgt;
        areaDamage(t.x, t.z, c.bite.r, c.bite.dmg * this.dmgMul, c.bite.bdmg * this.dmgMul, { src: this, knock: 4 });
        explosion(t.x, 3, t.z, 1.6, false); ring(t.x, t.z, 2, c.bite.r * 1.6, 0xffd890, 0.7);
        chunks(t.x, 2, t.z, 16, 0x8a7a5a, { spread: 4, size: 1, out: 8, up: 9 });
        Cam.shake(1.2, t.x, t.z); SFX.stomp(t); SFX.roar(this.pitch() * 1.2, this, 1.2);
      }
      if (p >= 1) { this.bite = null; this.exposed = false; }
      this.moving = false;
      return true;
    }
    // relámpagos dorados en zigzag contra todo lo que tenga cerca (también lo que vuela)
    if (this.cd.lasers <= 0) {
      this.cd.lasers = c.bolts.cd;
      const targets = S.units.filter((u) => !u.dead && dist(u.x, u.z, this.x, this.z) < c.bolts.r).sort(() => Math.random() - 0.5).slice(0, c.bolts.n + fury * 3);
      targets.forEach((u, i) => {
        this.model.heads[i % 3].getWorldPosition(_HV);
        const from = { x: _HV.x, y: _HV.y, z: _HV.z }, to = u.aimAt();
        const mid = { x: (from.x + to.x) / 2 + rand(-3, 3), y: (from.y + to.y) / 2 + rand(-2, 2), z: (from.z + to.z) / 2 + rand(-3, 3) };
        beam(from, mid, 0xffd23d, 0.35, 0.3, 0xffffff); beam(mid, to, 0xffd23d, 0.35, 0.3, 0xffffff);
        u.damage(c.bolts.dmg * this.dmgMul);
      });
      if (targets.length) SFX.laser(this);
    }
    // agujero negro sobre un grupo de tropas (o sobre su objetivo)
    if (this.cd.acid <= 0) {
      this.cd.acid = c.hole.cd * (fury ? 0.7 : 1);
      const t = this.clusterTarget(80, false) || this.goal;
      if (t && !t.dead) {
        addHazard('void', t.x, t.z, c.hole.r, c.hole.dps * this.dmgMul, c.hole.t, true, c.hole.pull);
        msg('¡Se abrió un agujero negro! Arrastra y destroza todo: saca a tus tropas de ahí.', 'danger');
      }
    }
    // mordida: un robot cerca, un grupo de tropas o su objetivo
    if (this.cd.cone <= 0) {
      const inReach = (o) => o && !o.dead && dist(o.x, o.z, this.x, this.z) < c.bite.reach;
      const robot = S.units.find((u) => !u.dead && u.def.mech && inReach(u));
      const tgt = robot || [this.clusterTarget(c.bite.reach, false), this.goal].find(inReach);
      if (tgt) {
        this.cd.cone = c.bite.cd * (fury ? 0.6 : 1);
        this.nextHead = ((this.nextHead ?? -1) + 1) % 3;
        this.bite = { head: this.nextHead, t: 0, dur: 2.2, tgt: { x: tgt.x, y: 3, z: tgt.z }, hit: false };
        Music.sting('motif:voidhydra');
        return true;
      }
    }
    return false;
  },
  // SpaceGorzak: torres de cristal que lo curan, escudo, lanzas de cristal, telequinesis,
  // tornados gravitatorios y vuelo dentro de un capullo de cristal
  updSpace(dt) {
    const c = this.cfg, md = this.model;
    const crystals = S.larvae.filter((l) => l.kind === 'crystal' && !l.dead);
    if (!this.crysInit) {
      this.crysInit = true; this.cd.crys = c.crystals.every;

    }
    // regeneración media-baja, más la energía de cada cristal (el gigante vale por tres)
    const power = crystals.reduce((sum, k) => sum + (k.giant ? 3 : 1), 0);
    this.hp = Math.min(this.maxHp, this.hp + this.maxHp * (c.regen + c.crystals.regen * power) * dt);
    md.crysMat.emissiveIntensity = 0.6 + power * 0.15 + this.glow;
    if (this.cd.crys <= 0) {
      this.cd.crys = c.crystals.every;
      if (crystals.length < c.crystals.max) { new Crystal(this.x + rand(-18, 18), this.z + rand(-18, 18)); msg(`💎 ${c.name} hizo brotar otra torre de cristal.`, 'warn'); }
    }
    // si llega a la Torre de Fukuoka, la convierte en un conducto de energía gigante
    if (!this.towerTaken) {
      const tw = S.map.city.find((b) => b.monument && b.name === 'Torre de Fukuoka' && !b.dead);
      if (tw && dist(tw.x, tw.z, this.x, this.z) < 28) {
        this.towerTaken = true; new Crystal(tw.x, tw.z, true, tw);
        msg(`💎 ¡${c.name} convirtió la Torre de Fukuoka en un conducto de energía! Lo cura mucho: si destruyes el cristal gigante, la torre caerá con él.`, 'danger');
        SFX.roar(this.pitch(), this, 2.6);

      md.shield.visible = true; md.shield.material.opacity = 0.18 + Math.sin(this.t * 10) * 0.06; md.shield.rotation.y += dt * 0.6;
      if (this.shield <= 0) { md.shield.visible = false; msg(`El escudo de ${c.name} se apagó: ¡ataquen!`, 'good'); }
    } else if (this.cd.shield <= 0 && this.aggro.size > 0) {
      this.shield = c.shield.time; this.cd.shield = c.shield.cd;

      SFX.beamCharge(0.8, 1.4);
    }
    // vuelo espacial dentro de un capullo de cristal
    if (this.fstate === 'ground' && this.cd.flight <= 0 && !this.action) {
      this.fstate = 'takeoff'; md.cocoon.visible = true;
      const t = S.lure && !S.lure.dead ? S.lure : crystals.length ? pick(crystals) : this.goal || { x: 0, z: -20 };
      this.flyTo = { x: t.x, z: t.z };
      msg(`🚀 ¡${c.name} se envuelve en cristal y vuela por el cielo!`, 'warn'); SFX.roar(this.pitch(), this, 2);
    }
    if (this.fstate === 'takeoff') {
      this.alt += dt * 10; this.moving = false;
      if (this.alt >= c.flyAlt) { this.alt = c.flyAlt; this.fstate = 'flying'; this.ft = 0; }
      return true;
    }
    if (this.fstate === 'flying') {
      this.ft += dt;
      if (this.walkTo(this.flyTo.x, this.flyTo.z, dt, 4, 4) || this.ft > c.flight.time) this.fstate = 'landing';
      return true;
    }
    if (this.fstate === 'landing') {
      this.alt -= dt * 12; this.moving = false;
      if (this.alt <= 0) {
        this.alt = 0; this.fstate = 'ground'; this.cd.flight = c.flight.every; md.cocoon.visible = false;
        areaDamage(this.x, this.z, 15, 160 * this.dmgMul, 600 * this.dmgMul, { knock: 5, src: this });
        ring(this.x, this.z, 3, 26, 0xc8a8ff, 1); smoke(this.x, 1, this.z, 14, 8, 0x9a8a9a, 2.4);
        chunks(this.x, 6, this.z, 30, 0xd8b8ff, { spread: 6, size: 1.2, out: 12, up: 12 });
        SFX.stomp(this); Cam.shake(1.5, this.x, this.z);
        this.pickGoal();
      }
      return true;
    }
    // lanzas de cristal desde los hombros (contra tus tropas o, si no hay, contra la ciudad)
    if (this.cd.spears <= 0) {
      this.cd.spears = c.spears.cd;
      const tg = S.units.filter((u) => !u.dead && dist(u.x, u.z, this.x, this.z) < c.spears.r).sort(() => Math.random() - 0.5).slice(0, c.spears.n);
      const near = S.map.city.filter((b) => !b.dead && dist(b.x, b.z, this.x, this.z) < c.spears.r);
      while (tg.length < 3 && near.length) tg.push(near.splice(Math.floor(Math.random() * near.length), 1)[0]);
      tg.forEach((t, i) => {
        md.shoulders[i % 2].getWorldPosition(_HV);
        const from = { x: _HV.x, y: _HV.y, z: _HV.z }, tx = t.x + rand(-2, 2), tz = t.z + rand(-2, 2);
        later(i * 0.12, () => { if (!this.dead) crystalSpear(this, from, tx, tz); });
      });
      if (tg.length) SFX.sweep();
    }
    // telequinesis: levanta un robot (o un grupo de tropas), lo sacude y lo estrella
    if (this.cd.tk <= 0) {
      const robot = S.units.find((u) => !u.dead && u.def.mech && !u.ko && !u.jump && !u.sliding && dist(u.x, u.z, this.x, this.z) < c.tk.r);
      const victims = robot ? [robot] : S.units.filter((u) => !u.dead && !u.ko && !u.jump && !u.sliding && !u.flying && dist(u.x, u.z, this.x, this.z) < c.tk.r).slice(0, 5);
      if (victims.length) {
        this.cd.tk = c.tk.cd;
        const hp = this.headPos();
        for (const v of victims) { v.knock('tk', { src: this }); beam(hp, v.aimAt(), 0xb08aff, 0.3, 0.8, 0xffffff); }
        this.glow = 1;
        msg(robot ? `🌀 ¡${c.name} levanta ${robot.def.who} con telequinesis y lo va a estrellar!` : `🌀 ¡${c.name} levanta a tus tropas con telequinesis!`, 'danger');
        SFX.beamCharge(1, 1.2);

    // tornado gravitatorio sobre el grupo de tropas más grande
    if (this.cd.grav <= 0) {
      this.cd.grav = c.gravity.cd;
      const t = this.clusterTarget(70, false), g = c.gravity;
      if (t) { addHazard('gravity', t.x, t.z, g.r, g.dps * this.dmgMul, g.t, true, g.pull); msg('🌪️ ¡Tornado gravitatorio! Arrastra todo hacia el centro: saca a tus tropas de ahí.', 'warn'); }

  updKrakor(dt) {
    const M = S.map, c = this.cfg;
    if (this.fstate === 'ground' && this.retreats.length && this.hp / this.maxHp < this.retreats[0]) {
      this.retreats.shift(); this.fstate = 'retreat'; this.endAction();
      msg(`¡${c.name} se retira al mar para curarse! ¡Atácalo antes de que se sumerja!`, 'warn');
      SFX.roar(this.pitch(), this, 2);
    }
    if (this.fstate === 'retreat') {
      this.walkTo(this.x, M.coastZ(this.x) - 22, dt, 1, 1.35);
      if (this.z < M.coastZ(this.x) - 12) { this.fstate = 'heal'; this.ft = 12; }
      return true;
    }
    if (this.fstate === 'heal') {
      this.moving = false;
      this.submerge = Math.min(1, this.submerge + dt * 0.6);
      this.hp = Math.min(this.maxHp, this.hp + (this.maxHp * c.heal * dt) / 12);
      this.ft -= dt;
      if (Math.random() < dt * 10) puff(this.x + rand(-8, 8), 0.3, this.z + rand(-8, 8), { size: 1.5, grow: 2, life: 1, color: 0xe8f6ff, vy: 1 });
      if (this.ft <= 0) { this.fstate = 'emerge'; msg(`${c.name} vuelve a salir del mar...`, 'warn'); }
      return true;
    }
    if (this.fstate === 'emerge') {
      this.submerge = Math.max(0, this.submerge - dt * 0.5);
      this.moving = false;
      if (this.submerge <= 0) { this.fstate = 'ground'; this.pickGoal(); SFX.roar(this.pitch(), this, 2.2); }
      return true;
    }
    return false;
  },
  updTrihydra(dt) {
    const c = this.cfg;
    this.heads = this.heads.map((h) => Math.max(0, h - dt * 1.5));
    // la calamidad: desata tormentas que recorren el mapa soltando rayos
    if (!this.calamity) {
      this.calamity = true; this.stormT = c.storms.every;
      for (let i = 0; i < c.storms.start; i++) { const d = pick(S.map.districts); spawnStorm(d.x + rand(-10, 10), d.z + rand(-10, 10)); }
      msg(`⛈️ ¡${c.name} desató una tormenta! Los rayos caen por todas partes: aparta a tus tropas de las nubes.`, 'danger');
    }
    this.stormT -= dt;
    if (this.stormT <= 0) { this.stormT = c.storms.every; if (S.storms.length < c.storms.max) spawnStorm(this.x + rand(-20, 20), this.z + rand(-20, 20)); }
    if (this.fstate === 'ground' && this.cd.flight <= 0 && !this.action) {
      this.fstate = 'takeoff'; this.ft = 0;
      let far = null, fd = 0;
      for (const d of S.map.districts) { if (!d.blds.some((b) => !b.dead)) continue; const dd = dist(d.x, d.z, this.x, this.z); if (dd > fd) { fd = dd; far = d; } }
      this.flyTo = far ? { x: far.x, z: far.z, name: far.name } : { x: 0, z: 0, name: 'el centro' };
      msg(`¡${c.name} levanta el vuelo hacia ${this.flyTo.name} y arrastra otra tormenta!`, 'warn');
      if (S.storms.length < c.storms.max + 1) spawnStorm(this.flyTo.x, this.flyTo.z);
      SFX.roar(this.pitch(), this, 2.2);
    }
    if (this.fstate === 'takeoff') {
      this.alt += dt * 8; this.moving = false;
      if (this.alt >= c.flyAlt) { this.alt = c.flyAlt; this.fstate = 'flying'; this.ft = 0; }
      return true;
    }
    if (this.fstate === 'flying') {
      this.ft += dt;
      const arrived = this.walkTo(this.flyTo.x, this.flyTo.z, dt, 4, 2.6);
      if (arrived || this.ft > c.flight.time) this.fstate = 'landing';
      return !this.action;
    }
    if (this.fstate === 'landing') {
      this.alt -= dt * 10; this.moving = false;
      if (this.alt <= 0) {
        this.alt = 0; this.fstate = 'ground'; this.cd.flight = c.flight.every;
        areaDamage(this.x, this.z, 15, 160 * this.dmgMul, 500 * this.dmgMul, { knock: 5, src: this });
        ring(this.x, this.z, 3, 24, 0xe8d8a8, 0.9); smoke(this.x, 1, this.z, 14, 8, 0xa89a70, 2.4);
        SFX.stomp(this); Cam.shake(1.4, this.x, this.z);
        this.pickGoal();
      }
      return true;
    }
    return false;
  },
  updExhausted(dt) {
    this.moving = false;
    this.exhaustT -= dt;
    this.glow = Math.max(0, this.glow - dt);

      this.exhausted = false; this.yOff = 0; this.freeze = 0;
      this.hp = this.maxHp * 0.1;

      SFX.roar(this.pitch(), this, 3);
    }
    this.sync(dt);
  },
  // la Trihydra del Vacío muere así: los agujeros negros se cierran y los cuellos desaparecen
  updVoidDying(dt) {
  const k = clamp(this.dyingT / 2.6, 0, 1), root = this.model.root;
  root.scale.setScalar(Math.max(0.02, 1 - easeIn(k)));
  root.rotation.y += dt * (1 + k * 6);
  if (Math.random() < 0.5) puff(this.x + rand(-10, 10), this.alt + rand(0, 14), this.z + rand(-10, 10), { add: true, size: 3, grow: -2, life: 0.6, color: pick([0xffd890, 0x9a4aff]) });
  if (k >= 1 && !this.fell) { this.fell = true; flash(0.8, '#fff3c0'); ring(this.x, this.z, 4, 60, 0xffd890, 1.4); Cam.shake(2, this.x, this.z); SFX.collapse(this); root.visible = false; }
  this.model.anim(this, dt);
  root.position.set(this.x, this.alt, this.z);
  }
});

  new PBld('hq', HQ_POS.x, HQ_POS.z, true);
  for (const [t, x, z] of [['tanque', -5, 67], ['tanque', 5, 67], ['soldados', -11, 71], ['soldados', 11, 71]]) { const u = new Unit(t, x, z); u.rot = Math.PI; }

  S.intentLine = new THREE.Mesh(G.plane, new THREE.MeshBasicMaterial({ color: 0xff4d3d, transparent: true, opacity: 0.22, depthWrite: false, side: THREE.DoubleSide }));
  S.intentLine.rotation.x = -Math.PI / 2; S.intentLine.visible = false; world.add(S.intentLine);
  Cam.reset(0, 60);
  appMode = 'game';
  UI.onGameStart();

function stepGame(dt) {
  S.time += dt;
  for (let i = S.later.length - 1; i >= 0; i--) { const l = S.later[i]; l.t -= dt; if (l.t <= 0) { S.later.splice(i, 1); l.fn(); } }
  if (S.phase === 'countdown') {
    const before = S.countdown;
    S.countdown -= dt;
    for (const mark of [60, 30, 10]) if (before > mark && S.countdown <= mark) { msg(`⏱️ ${mark} segundos para la llegada de ${MONSTERS[S.monsterKind].name}.`, 'warn'); if (mark === 10) SFX.siren(3); }
    if (S.countdown <= 0) startMonsterEntrance();
  }
  if (S.phase === 'battle') S.battleT += dt;
  // las chimeneas de la ciudad industrial no dejan de echar humo
  for (const sm of S.map.smokers) if (!sm.b.dead && Math.random() < dt * 2.5) puff(sm.x, sm.y, sm.z, { size: 1.6, grow: 6, life: 3.5, color: pick([0x8a8270, 0x6e6a60, 0xa09880]), vx: rand(0.5, 2), vy: rand(2, 4), vz: rand(-0.5, 0.5), a: 0.55, drag: 0.99 });
  S.taxT -= dt;
  if (S.taxT <= 0) {
    S.taxT += TAX_INTERVAL;
    let inc = 0;
    for (const b of S.map.city) if (!b.dead) inc += b.tax;
    inc = Math.round(inc * S.mods.tax);
    if (!S.sandbox) { S.money += inc; S.stats.earned += inc; }
    UI.showIncome(inc);
  }
  for (const b of S.blds.slice()) b.update(dt);
  for (const u of S.units) u.update(dt);
  separate(dt);
  for (const l of S.larvae) l.update(dt);
  if (S.monster) S.monster.update(dt);
  updateProjs(dt); updateHazards(dt); updateFires(dt); updateNukes(dt); updateStorms(dt); updateFlyovers(dt); updateFrost(dt); updateMegaroCall(dt); updateSinkers(dt);
  for (let i = S.sinking.length - 1; i >= 0; i--) {
    const s = S.sinking[i];
    s.t += dt;
    s.m.position.y = -easeIn(Math.min(1, s.t / 1.3)) * s.h;
    s.m.rotation.z = Math.sin(s.t * 9) * 0.025;
    if (s.t >= 1.3) {
      removeObj(s.m); S.sinking.splice(i, 1);
      const b = s.b, rh = clamp(b.h * 0.12, 0.6, 2.2);
      const rub = B(b.w * 0.95, rh, b.d * 0.95, 0x6f6a62, b.x, rh / 2, b.z); rub.rotation.y = rand(-0.08, 0.08); world.add(rub);
      for (let k = 0; k < 3; k++) world.add(B(rand(1, 2.5), rand(0.6, 1.4), rand(1, 2.5), b.color, b.x + rand(-b.w, b.w) * 0.35, rh, b.z + rand(-b.d, b.d) * 0.35));
    }
  }
  if (S.units.some((u) => u.dead)) S.units = S.units.filter((u) => !u.dead);
  if (S.larvae.some((l) => l.dead)) S.larvae = S.larvae.filter((l) => !l.dead);
  S.radar = S.blds.some((b) => b.type === 'radar' && b.done);
  if (S.phase === 'battle' && !S.ended) {
    const hq = S.blds.find((b) => b.type === 'hq');
    if (!hq) endBattle(false, 'hq');
    else if (S.aliveWorth / S.map.totalWorth < LOSE_CITY) endBattle(false, 'city');
    else if (!S.critical && (S.aliveWorth / S.map.totalWorth < 0.45 || (S.monster && S.monster.hp / S.monster.maxHp < 0.25 && !S.monster.kaiju.immortal))) {
      S.critical = true; Music.play(levelSong('critical'));
    }
  }
}

// empuja a las unidades para que no se encimen
function separate(dt) {
  const us = S.units, k = Math.min(1, dt * 8);
  for (let i = 0; i < us.length; i++) {
    const a = us[i];
    if (a.dead) continue;
    for (let j = i + 1; j < us.length; j++) {
      const b = us[j];
      if (b.dead || a.flying !== b.flying) continue;
      const dx = b.x - a.x, dz = b.z - a.z, rr = a.r + b.r - 0.3, d2 = dx * dx + dz * dz;
      if (d2 >= rr * rr) continue;
      if (d2 < 1e-6) { b.x += 0.05; continue; }
      const d = Math.sqrt(d2), push = (rr - d) * 0.5 * k, nx = dx / d, nz = dz / d;
      const ax = a.x - nx * push, az = a.z - nz * push, bx = b.x + nx * push, bz = b.z + nz * push;
      if (a.flying || Nav.walk(ax, az)) { a.x = ax; a.z = az; }
      if (b.flying || Nav.walk(bx, bz)) { b.x = bx; b.z = bz; }
    }
    const m = S.monster;
    if (m && m.state === 'active' && !a.flying && m.alt < 3 && m.submerge < 0.5) {
      const dx = a.x - m.x, dz = a.z - m.z, d = Math.hypot(dx, dz), rr = m.r * 0.7 + a.r;
      if (d < rr && d > 0.01) { const nx = a.x + (dx / d) * (rr - d) * k, nz = a.z + (dz / d) * (rr - d) * k; if (Nav.walk(nx, nz)) { a.x = nx; a.z = nz; } }
    }
  }
}

function syncWorld(dt) {
  updateNukeFX();
  for (const u of S.units) u.sync(dt);
  for (const b of S.blds) b.sync();
  const m = S.monster;
  const show = S.radar && m && m.state === 'active' && m.goal && !m.goal.dead && !m.exhausted;
  S.intent.visible = S.intentLine.visible = !!show;
  if (show) {
    const g = m.goal, pr = 1 + Math.sin(S.time * 5) * 0.12;
    S.intent.position.set(g.x, 0.5, g.z); S.intent.scale.setScalar((g.r + 3) * pr);
    const dx = g.x - m.x, dz = g.z - m.z, L = Math.hypot(dx, dz);
    S.intentLine.position.set((m.x + g.x) / 2, 0.45, (m.z + g.z) / 2);
    S.intentLine.scale.set(1.2, Math.max(0.1, L), 1);
    S.intentLine.rotation.z = -Math.atan2(dx, dz) + Math.PI;
  }
}

// ---------- costos, producción y construcción ----------
function costOf(def) { const k = S.sandbox ? 0 : S.diff.cost; return [Math.round(def.cost[0] * k), Math.round(def.cost[1] * k)]; }
function canAfford(c) { return S.money >= c[0] && S.uranium >= c[1]; }
function pay(c) { S.money -= c[0]; S.uranium -= c[1]; }
function unitAvailable(type) {
  const d = UNITS[type];
  if (d.onlyShin) return S.monsterKind === 'shin';
  return !d.tech || S.sandbox || hasTech(d.tech);
}
function bldAvailable(type) { const d = BUILDINGS[type]; return !d.tech || S.sandbox || hasTech(d.tech); }
function enqueue(b, type) {
  if (!b || b.dead || !b.done) return;
  const d = UNITS[type];
  if (!unitAvailable(type)) { SFX.error(); msg(`${d.name} está bloqueado. Desbloquéalo en Mejoras con medallas.`, 'warn'); return; }
  if (b.queue.length >= 6) { SFX.error(); msg('La cola de producción está llena.', 'warn'); return; }
  if (d.ammo && S.ammo[type] + S.blds.reduce((n, x) => n + x.queue.filter((q) => q.type === type).length, 0) >= AMMO_MAX) { SFX.error(); msg(`Solo caben ${AMMO_MAX} de cada tipo en los Silos.`, 'warn'); return; }
  if (d.limit && (S.units.some((u) => u.type === type) || S.blds.some((x) => x.queue.some((q) => q.type === type)))) { SFX.error(); msg(`Solo puedes tener un ${d.name} a la vez.`, 'warn'); return; }
  const c = costOf(d);
  if (!canAfford(c)) { SFX.error(); msg(S.uranium < c[1] ? 'Falta uranio ☢️ — los Recolectores lo traen de las minas.' : 'Falta dinero 💰', 'warn'); return; }
  pay(c);
  b.queue.push({ type, t: 0, cost: c });
  SFX.click(); UI.selDirty = true;
}
function cancelQueue(b, i) {
  const q = b.queue[i];
  if (!q) return;
  b.queue.splice(i, 1);
  S.money += q.cost[0]; S.uranium += q.cost[1];
  SFX.click(); UI.selDirty = true;
}
function snapPos(type, x, z) {
  const [w, d] = BUILDINGS[type].size;
  return { x: Math.round((x - w / 2) / CELL) * CELL + w / 2, z: Math.round((z - d / 2) / CELL) * CELL + d / 2 };
}
function placeValid(type, x, z) {
  const def = BUILDINGS[type], [w, d] = def.size;
  if (x - w / 2 < -MAP_HALF + 4 || x + w / 2 > MAP_HALF - 4 || z - d / 2 < -MAP_HALF + 4 || z + d / 2 > MAP_HALF - 4) return false;
  if (!def.anywhere && x + w / 2 > CITY_RECT.x0 && x - w / 2 < CITY_RECT.x1 && z + d / 2 > CITY_RECT.z0 && z - d / 2 < CITY_RECT.z1) return false;
  if (!Nav.rectFree(x, z, w, d)) return false;
  const m = S.monster;
  if (m && m.state === 'active' && circleRect(m.x, m.z, m.r + 2, x, z, w, d)) return false;
  // el Radar de distracción se puede poner en cualquier terreno libre, aunque esté lejos de la base
  if (def.anywhere) return true;
  for (const b of S.blds) {
    const gx = Math.max(Math.abs(x - b.x) - (w + b.w) / 2, 0), gz = Math.max(Math.abs(z - b.z) - (d + b.d) / 2, 0);
    if (Math.hypot(gx, gz) <= BUILD_RADIUS) return true;
  }

}
function startPlacing(type) {
  if (!S || S.ended) return;
  if (!S.blds.some((b) => b.type === 'hq')) { SFX.error(); return; }
  if (!bldAvailable(type)) { SFX.error(); msg(`${BUILDINGS[type].name} está bloqueado. Desbloquéalo en Mejoras con medallas.`, 'warn'); return; }
  const c = costOf(BUILDINGS[type]);
  if (BUILDINGS[type].limit && S.blds.some((b) => b.type === type)) { SFX.error(); msg(`Solo puedes tener un ${BUILDINGS[type].name} a la vez.`, 'warn'); return; }
  if (!canAfford(c)) { SFX.error(); msg(S.uranium < c[1] ? 'Falta uranio ☢️' : 'Falta dinero 💰', 'warn'); return; }
  cancelPlacing();
  const ghost = BModels[type]();
  const gm = { ok: new THREE.MeshBasicMaterial({ color: 0x5dff7a, transparent: true, opacity: 0.45, depthWrite: false }), bad: new THREE.MeshBasicMaterial({ color: 0xff4d3d, transparent: true, opacity: 0.45, depthWrite: false }) };
  ghost.traverse((o) => { if (o.isMesh) { o.material = gm.ok; o.castShadow = false; } });
  world.add(ghost);
  const zone = new THREE.Mesh(G.plane, new THREE.MeshBasicMaterial({ color: 0x5dff7a, transparent: true, opacity: 0.12, depthWrite: false }));
  zone.rotation.x = -Math.PI / 2; zone.position.y = 0.3; world.add(zone);
  S.placing = { type, ghost, gm, zone, valid: false, x: 0, z: 0 };
  UI.buildDirty = true;
  SFX.click();
}
function cancelPlacing() {
  if (!S || !S.placing) return;
  removeObj(S.placing.ghost); removeObj(S.placing.zone);
  S.placing.gm.ok.dispose(); S.placing.gm.bad.dispose();
  S.placing = null; UI.buildDirty = true;
}
function updatePlacing(wx, wz) {
  const P = S.placing;
  if (!P) return;
  const p = snapPos(P.type, wx, wz);
  P.x = p.x; P.z = p.z;
  P.valid = placeValid(P.type, p.x, p.z);
  P.ghost.position.set(p.x, 0, p.z);
  P.ghost.traverse((o) => { if (o.isMesh) o.material = P.valid ? P.gm.ok : P.gm.bad; });
  const [w, d] = BUILDINGS[P.type].size;
  P.zone.position.set(p.x, 0.3, p.z); P.zone.scale.set(w + 2, d + 2, 1);
  P.zone.material.color.set(P.valid ? 0x5dff7a : 0xff4d3d);
}
function confirmPlacing(keep) {
  const P = S.placing;
  if (!P) return;
  if (!P.valid) { SFX.error(); msg(BUILDINGS[P.type].anywhere ? 'No se puede poner ahí: necesita terreno libre (una calle, un parque o campo abierto) y lejos del monstruo.' : 'No se puede construir ahí: debe estar cerca de tus edificios, fuera de la ciudad y en terreno libre.', 'warn'); return; }
  const c = costOf(BUILDINGS[P.type]);
  if (!canAfford(c)) { SFX.error(); cancelPlacing(); return; }
  pay(c);
  const b = new PBld(P.type, P.x, P.z, false);
  for (const u of S.units) {
    if (u.flying || !circleRect(u.x, u.z, u.r, b.x, b.z, b.w + 1, b.d + 1)) continue;
    const f = Nav.nearestFree(Nav.cell(u.x), Nav.cell(u.z), 12);
    if (f) { u.x = Nav.center(f[0]); u.z = Nav.center(f[1]); u.path = null; }
  }
  ring(b.x, b.z, 2, b.r + 3, 0xffd34d, 0.6);
  SFX.click();
  if (keep && canAfford(c)) { const t = P.type; cancelPlacing(); startPlacing(t); updatePlacing(b.x, b.z); }
  else cancelPlacing();
}

// ---------- selección y órdenes ----------
function selectUnits(list, add) {
  if (!add) S.sel = [];
  for (const u of list) if (!u.dead && !S.sel.includes(u)) S.sel.push(u);
  S.selBld = null; S.selEnemy = null; UI.selDirty = true;
  if (list.length) SFX.click();
}
function selectBld(b) { S.sel = []; S.selBld = b; S.selEnemy = null; UI.selDirty = true; SFX.click(); }
function selectEnemy(e) { S.sel = []; S.selBld = null; S.selEnemy = e; UI.selDirty = true; SFX.click(); }
function clearSel() { S.sel = []; S.selBld = null; S.selEnemy = null; UI.selDirty = true; }
function issueOrder(wx, wz, target, field) {
  const units = S.sel.filter((u) => !u.dead);
  if (!units.length) {
    const b = S.selBld;
    if (b && b.def.produces) { b.rally = { x: wx, z: wz }; ring(wx, wz, 0.5, 3, 0x4dc3ff, 0.6); SFX.click(); msg(`Punto de reunión de ${b.def.name} fijado.`, ''); }
    return;
  }
  if (target) {
    for (const u of units) {
      if (u.def.freezer) u.orderInject(target);
      else if (u.def.harvester) continue;
      else u.orderAttack(target);
    }
    ring(target.x, target.z, 2, (target.r || 2) + 4, 0xff4d3d, 0.5);
    SFX.radio();
    return;
  }
  let rest = units;
  if (field) {
    for (const u of units) if (u.def.harvester) u.orderHarvest(field);
    rest = units.filter((u) => !u.def.harvester);
  }
  const n = rest.length, cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  const fx = -Math.sin(Cam.yaw), fz = -Math.cos(Cam.yaw), rx = Math.cos(Cam.yaw), rz = -Math.sin(Cam.yaw);
  rest.sort((a, b) => dist(a.x, a.z, wx, wz) - dist(b.x, b.z, wx, wz));
  rest.forEach((u, i) => {
    const r = Math.floor(i / cols), c = i % cols, sp = u.def.mech ? 9 : u.flying ? 5 : 4.2;
    const ox = (c - (cols - 1) / 2) * sp, oz = (r - (rows - 1) / 2) * sp;
    u.orderMove(wx + rx * ox - fx * oz, wz + rz * ox - fz * oz);
  });
  ring(wx, wz, 0.5, 3.5, 0x8dff9f, 0.5);
  SFX.click();
}

// ---------- final de la batalla ----------
function endBattle(win, reason) {
  if (S.ended) return;
  S.ended = true;
  cancelPlacing();
  const city = S.aliveWorth / S.map.totalWorth;
  const medals = [win, win && city >= MEDAL_CITY, win && S.monumentsLost === 0];
  const prev = levelMedals(S.levelId).slice();
  const counted = !S.sandbox;
  const before = medalCount();
  const newM = medals.map((m, i) => counted && m && !prev[i]);
  if (counted) {
    save.medals[S.levelId] = prev.map((p, i) => p || medals[i]);
    if (win) save.won[S.levelId] = true;
    persist();
  }
  const secretNow = counted && before < SECRET_AT && medalCount() >= SECRET_AT;
  S.result = { win, reason, city, medals, newM, counted, secretNow, time: S.battleT };
  if (win) {
    const mg = S.units.find((u) => u.type === 'megarogorzak' && !u.dead), ti = S.units.find((u) => u.type === 'titan' && !u.dead);
    if (mg && ti) msg('🤝 ¡MegaroGorzak y el Titán se dan la mano, como en 1973!', 'good');
    else if (mg) msg('🦖 MegaroGorzak ruge de alegría y vuelve al mar.', 'good');
  }
  if (win) victoryCinematic(); else defeatCinematic(reason);
}

// ---------------------------------------------------------------------
//  Cinemáticas
// ---------------------------------------------------------------------
const Cine = {
  cur: null,
  play(c) {
    if (this.cur) this.finish(true);
    this.cur = Object.assign({ t: 0 }, c);
    document.body.classList.add('cine');
    document.body.classList.remove('tpause');
    if (S) { S.timeScale = c.ts ?? 0; S.paused = false; cancelPlacing(); }
    UI.hideTip();
  },
  update(rdt) {
    const c = this.cur;
    if (!c) return;
    c.t += rdt;
    const k = clamp(c.t / c.dur, 0, 1);
    if (c.update) c.update(k, rdt, c);
    if (!this.cur) return;
    if (c.cam) {
      const v = c.cam(k, c);
      const sh = Cam.shakeA;
      const want = safeCamY(v.p[0], v.p[2], v.p[1]);
      c.yb = c.yb === undefined ? want : lerp(c.yb, want, Math.min(1, rdt * 5));
      camera.position.set(v.p[0] + rand(-sh, sh), Math.max(v.p[1], c.yb) + rand(-sh, sh), v.p[2] + rand(-sh, sh));
      camera.lookAt(v.l[0], v.l[1], v.l[2]);
      Cam.shakeA = Math.max(0, Cam.shakeA - rdt * 2.5);
    }
    if (c.title) {
      const at = c.titleAt ?? 0, show = c.t >= at && c.t <= at + (c.titleDur ?? 3);
      setCineText(show ? c.title : null, c.glow);
    }
    if (k >= 1) this.finish(false);
  },
  finish(skipped) {
    const c = this.cur;
    if (!c) return;
    this.cur = null;
    document.body.classList.remove('cine');
    setCineText(null);
    if (S) S.timeScale = 1;
    if (c.end) c.end(skipped);
  },
  skip() { if (this.cur && this.cur.skippable !== false) this.finish(true); },
};
// altura mínima de la cámara para no quedar dentro de un edificio
function safeCamY(x, z, y) {
  if (!S || !S.map) return y;
  let min = S.map.groundH(x, z) + 2.5;
  for (const b of S.map.city) {
    if (b.dead || b.dome) continue;
    if (Math.abs(x - b.x) < b.w / 2 + 5 && Math.abs(z - b.z) < b.d / 2 + 5) min = Math.max(min, b.h + 5);
  }
  return Math.max(y, min);
}
function setCineText(t, glow) {
  const e = $('#cineText');
  if (!t) { e.classList.remove('show'); return; }
  e.querySelector('.t1').textContent = t[0];
  e.querySelector('.t2').textContent = t[1] || '';
  if (glow) e.style.setProperty('--glow', glow);
  e.classList.add('show');
}
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
// recorre fotogramas clave [k, posición, mirada]
function keyCam(keys, k) {
  let i = 0;
  while (i < keys.length - 2 && k > keys[i + 1][0]) i++;
  const a = keys[i], b = keys[i + 1], t = easeInOut(clamp((k - a[0]) / (b[0] - a[0] || 1), 0, 1));
  return { p: lerp3(a[1], b[1], t), l: lerp3(a[2], b[2], t) };
}

function startMonsterEntrance() {
  S.phase = 'arrival';
  const m = S.monster, sp = S.map.spawn, cfg = m.cfg, type = sp.type;
  m.state = 'cine'; m.model.root.visible = true;
  m.rot = 0;
  SFX.siren(3);
  Music.play('himno:arrival', true);
  let roared = false, landed = false;
  const H = m.h;
  const fin = () => {
    if (type === 'sea') { m.x = 0; m.z = sp.z + 26; m.yOff = 0; }

    m.pickGoal();
    Music.play(levelSong('battle'), true);

    : type === 'sky'
      ? [[0, [24, 4, -68], [0, 50, -170]], [0.5, [30, 7, -70], [0, 30, -110]], [1, [50, 38, -40], [0, 20, -78]]]
      : type === 'burrow'
        ? [[0, [52, 8, -66], [0, 3, -96]], [0.35, [46, 9, -70], [0, 5, -96]], [0.75, [38, 13, -72], [0, 9, -96]], [1, [56, 40, -40], [0, 10, -92]]]
        : [[0, [62, 14, -72], [40, 80, -200]], [0.3, [56, 12, -74], [0, 6, -96]], [0.7, [44, 16, -70], [0, 16, -96]], [1, [56, 40, -40], [0, 14, -92]]];
  if (m.kaiju.lowEntrance) for (const kf of keys) { kf[2][1] = Math.min(kf[2][1], 5); kf[1][1] = Math.min(kf[1][1], 12); }
  Cine.play({
    dur: 9.5, ts: 0, title: [cfg.name, cfg.sub], titleAt: 4.6, titleDur: 3.8, glow: cfg.glow,
    update: (k, rdt) => {
      m.t += rdt;
      if (type === 'sea') {
        const r = clamp((k - 0.15) / 0.6, 0, 1);
        m.x = 0; m.z = lerp(sp.z, sp.z + 26, r); m.yOff = lerp(-H * 1.2, 0, easeOut(r));
        m.moving = r > 0 && r < 1;
        if (k > 0.1 && k < 0.8 && Math.random() < 0.5) puff(rand(-10, 10), 0.5, m.z + rand(-8, 8), { size: 4, grow: 6, life: 1.6, color: 0xe8f4ff, vy: rand(4, 10), a: 0.7 });
        if (k < 0.2 && Math.random() < 0.3) puff(rand(-6, 6), 0, sp.z + rand(-6, 6), { size: 2, grow: 3, life: 1, color: 0xffffff, vy: 2 });
      } else if (type === 'sky') {
        const r = easeOut(clamp(k / 0.7, 0, 1));
        m.x = 0; m.z = lerp(-240, -78, r); m.alt = lerp(70, cfg.flyAlt, r);
      } else {
        if (k < 0.28) {
          const r = k / 0.28;
          if (meteor) {

            puff(meteor.position.x, meteor.position.y, meteor.position.z, { size: 6, grow: 10, life: 2, color: 0x4a3a2a, vx: 0, vy: 0, vz: 0 });
          } else {

            if (Math.random() < 0.5) puff(rand(-12, 12), 1, -96 + rand(-12, 12), { size: 3, grow: 5, life: 1.4, color: 0x9a8a6a, vy: rand(1, 4) });
            Cam.shake(0.3 + r * 0.6, 0, -96);
          }
          m.yOff = -H * 1.3; m.x = 0; m.z = -96;
        } else {
          if (!landed) {
            landed = true;
            if (meteor) {
              removeObj(meteor); meteor = null;
              explosion(0, 4, -96, 5); ring(0, -96, 4, 60, 0xffd080, 1.4); flash(0.7, '#ffe6b0'); Cam.shake(3, 0, -96);
              chunks(0, 2, -96, 60, 0x8a6a28, { spread: 10, size: 2, out: 16, up: 18 });
            } else {

          m.yOff = lerp(-H * 1.3, 0, easeOut(r));
          if (Math.random() < 0.4) puff(rand(-14, 14), 1, -96 + rand(-14, 14), { size: 5, grow: 8, life: 2, color: 0x9a7a3a, vy: 3 });
        }
      }
      if (!roared && k > 0.45) { roared = true; SFX.roar(m.pitch(), null, 3.2); Cam.shake(1.4, m.x, m.z); m.jaw = 1; }
      m.jaw = Math.max(0, m.jaw - rdt * 0.4);
      m.moveAmt = lerp(m.moveAmt, m.moving ? 1 : 0, rdt * 3);
      m.walk += rdt * 1.4 * m.moveAmt;
      m.model.anim(m, rdt);
      m.model.root.position.set(m.x, m.alt + m.yOff, m.z);
      m.model.root.rotation.y = m.rot;
    },
    cam: (k) => keyCam(keys, k),
    end: fin,
  });
}

function shinEvolveCinematic(m, n) {
  Music.stinger(n === 3 ? 'evolve3' : 'evolve2');
  SFX.roar(0.7, null, 3.4);
  const tint = n === 3 ? 0xb04dff : 0xff5a2a;
  Cine.play({
    dur: 7, ts: 0, title: n === 2 ? ['SEGUNDA FORMA', 'Shin Gorzak se pone de pie'] : ['FORMA FINAL', 'EL DESPERTAR'], titleAt: 4.2, titleDur: 2.6, glow: 'rgba(190,80,255,.95)',
    update: (k, rdt, c) => {
      m.t += rdt;
      const root = m.model.root;
      if (k < 0.4) {
        // 1) convulsiona: tiembla, echa vapor y brilla por dentro
        const p = k / 0.4;
        root.scale.setScalar(1 + Math.sin(c.t * 24) * 0.035 * p);
        root.rotation.z = Math.sin(c.t * 17) * 0.04 * p;
        m.glow = p;
        if (Math.random() < 0.7) puff(m.x + rand(-7, 7), rand(1, m.h), m.z + rand(-7, 7), { size: 3, grow: 6, life: 1.6, color: 0xd8d0d8, vy: rand(2, 6), a: 0.55 });
        if (Math.random() < 0.6) puff(m.x + rand(-6, 6), rand(1, m.h), m.z + rand(-6, 6), { add: true, size: 2.5, grow: 3, life: 0.6, color: tint, vy: 3 });
        Cam.shake(0.25 + p * 0.5, m.x, m.z);
      } else {
        // 2) cambia de forma y crece de golpe
        if (!c.swapped) {
          c.swapped = true; m.setForm(n);
          flash(0.7, n === 3 ? '#d8a0ff' : '#ffb090'); Cam.shake(2.4, m.x, m.z); SFX.roar(m.pitch(), null, 3.2); SFX.collapse(m);
          smoke(m.x, 2, m.z, 24, 14, 0x4a3a44, 3.5); ring(m.x, m.z, 4, 40, 0xd8c8b8, 1.2);
          chunks(m.x, 2, m.z, 40, 0x6a6058, { spread: 10, size: 1.6, out: 14, up: 14 });
        }
        const p = clamp((k - 0.4) / 0.28, 0, 1);
        root.scale.setScalar(lerp(0.55, 1, easeOut(p)));
        root.rotation.z = 0;
        // 3) ruge mirando al cielo
        const roar = k > 0.6 && k < 0.92;
        m.jaw = roar ? 1.3 : Math.max(0, m.jaw - rdt * 2);
        m.headPitch = roar ? -0.4 : m.headPitch * 0.9;
        m.glow = n === 3 ? 0.6 + Math.sin(c.t * 10) * 0.4 : 0.3;
        if (roar && Math.random() < 0.3) puff(m.x + rand(-4, 4), m.h * 0.9, m.z + rand(-4, 4), { add: true, size: 3, grow: 5, life: 0.8, color: tint, vy: 6 });
      }
      m.model.anim(m, rdt);
      root.position.set(m.x, m.alt + m.yOff, m.z);
    },
    cam: (k) => {
      const a = m.rot + 0.8 + k * 1.2;
      if (k < 0.4) { const R = 26 + m.h * 0.5; return { p: [m.x + Math.sin(a) * R, m.h * 0.5, m.z + Math.cos(a) * R], l: [m.x, m.h * 0.45, m.z] }; }
      const p = easeInOut(clamp((k - 0.4) / 0.6, 0, 1)), R = lerp(30, 58, p);
      return { p: [m.x + Math.sin(a) * R, lerp(m.h * 0.3, 6, p), m.z + Math.cos(a) * R], l: [m.x, m.h * lerp(0.5, 0.8, p), m.z] };
    },
    end: () => {
      if (m.form !== n) m.setForm(n);
      m.model.root.scale.setScalar(1); m.model.root.rotation.z = 0;
      m.evolving = false;
      Music.play(levelSong(n === 3 ? 'critical' : 'battle'), true);
      msg(n === 2 ? 'Shin Gorzak se puso de pie: ahora pisotea y da coletazos.' : '¡FORMA FINAL! Su aliento pasa de humo a fuego y a un láser que lo arrasa todo. Sus placas derriban lo que vuela.', 'danger');
    },
  });
}

      }
      if (T < 4.5) { // vista aérea: el humo negro cae sobre la ciudad
        const p = (T - 2) / 2.5;
        return { p: [h.x + fx * 75 + rx * lerp(55, 30, p), 72, h.z + fz * 75 + rz * lerp(55, 30, p)], l: [h.x + fx * 28, 6, h.z + fz * 28] };
      }

      return { p: [m.x - fx * 55 + rx * 75, 58, m.z - fz * 55 + rz * 75], l: [m.x + fx * 30, 10, m.z + fz * 30] };     // plano general con los láseres dorsales
    },
  });
}

// la primera vez que Anguirax rueda: la cámara, baja y delante de la franja, ve venir la bola de púas
function rollCinematic(m) {
  const a = m.action, fx = Math.sin(a.ang), fz = Math.cos(a.ang);

// desde dónde se ve una bomba de lejos: de costado al rayo, del lado más cercano al centro del mapa
function nukeView(m, tx, tz) {
  const bl = Math.hypot(tx - m.x, tz - m.z) || 1, ux = (tx - m.x) / bl, uz = (tz - m.z) / bl;
  const sd = uz * -tx - ux * -tz >= 0 ? 1 : -1;
  return [tx + uz * sd * 150 - ux * 40, tz - ux * sd * 150 - uz * 40];
}
// plano general: la bola de fuego, la onda que llega y el hongo que sube por encima de todo
// (nt: segundos desde la explosión; t0: cuándo empieza el plano)
function nukeWideCam(nt, t0, tx, tz, wx, wz, len) {
  const p = clamp((nt - t0) / len, 0, 1), cy = 12 + 100 * (1 - Math.exp(-Math.max(0, nt) / 5.5));
  return { p: [lerp(wx, tx + (wx - tx) * 1.25, p), lerp(20, 46, p), lerp(wz, tz + (wz - tz) * 1.25, p)], l: [tx, lerp(16, cy * 0.7, easeInOut(p)), tz] };
}
// las bombas siguientes: solo un plano general corto, que también se puede saltar
function nukeWideShot(m, nk) {
  const [wx, wz] = nukeView(m, nk.x, nk.z);
  Cine.play({ dur: 5.5, ts: 1, cam: () => nukeWideCam(nk.t, 0, nk.x, nk.z, wx, wz, 9) });
}
// la primera bomba de Gorzak Minus One, como en la película: las placas que se levantan desde la
// cola, la cara, el rayo, la onda que llega hasta la calle y el hongo visto de lejos mientras ruge
function minusNukeCinematic(m) {
  const a = m.action, c = m.cfg.beam, fireAt = c.charge + c.slam, boomAt = fireAt + 0.22, tx = a.tx, tz = a.tz;
  const [wx, wz] = nukeView(m, tx, tz);
  // la calle: más allá de la explosión, mirando hacia ella con el monstruo detrás
  const bl = Math.hypot(tx - m.x, tz - m.z) || 1, ux = (tx - m.x) / bl, uz = (tz - m.z) / bl;
  const sx = tx + ux * 55 + uz * 14, sz = tz + uz * 55 - ux * 14;
  Cine.play({
    dur: 15, ts: 1,
    update: () => { if (m.action !== a && !a.boom) Cine.finish(true); },   // lo interrumpieron
    cam: () => {
      const T = m.action === a ? a.t : boomAt + (m.lastNuke ? m.lastNuke.t : 0), nt = T - boomAt;
      const h = m.headPos(), r = m.rot, fx = Math.sin(r), fz = Math.cos(r), rx = Math.cos(r), rz = -Math.sin(r);
      if (T < 2.1) { // desde atrás y abajo, por la espalda: las placas se levantan desde la punta de la cola
        const p = T / 2.1;
        return { p: [m.x - fx * lerp(50, 36, p) + rx * 34, lerp(7, 14, p), m.z - fz * lerp(50, 36, p) + rz * 34], l: [m.x - fx * lerp(18, 0, p), lerp(6, m.h * 0.75, p), m.z - fz * lerp(18, 0, p)] };
      }
      if (T < fireAt) { // la cara: la boca se llena de luz azul
        const p = (T - 2.1) / (fireAt - 2.1);
        return { p: [h.x + fx * 16 + rx * lerp(17, 12, p), h.y + 1, h.z + fz * 16 + rz * lerp(17, 12, p)], l: [h.x, h.y - 0.5, h.z] };
      }
      if (nt < 0.15) return { p: [h.x - fx * 20 + rx * 11, h.y + 8, h.z - fz * 20 + rz * 11], l: [tx, 4, tz] }; // sobre el hombro, siguiendo el rayo
      if (nt < 2.6) return { p: [sx, 3, sz], l: [tx, lerp(10, 26, clamp(nt / 2.6, 0, 1)), tz] };                       // en la calle: la onda viene hacia nosotros
      return nukeWideCam(nt, 2.6, tx, tz, wx, wz, 9);
    },
  });
}

const Cam = {
  x: 0, z: 60, yaw: 0, tyaw: 0, dist: 95, tdist: 95, shakeA: 0, keys: new Set(), mx: 0, my: 0, over: false,
  reset(x, z) { this.x = x; this.z = z; this.yaw = this.tyaw = 0; this.dist = this.tdist = 95; this.shakeA = 0; this.yb = undefined; this.apply(); },
  pitch() { return lerp(0.6, 1.08, clamp((this.dist - 28) / 140, 0, 1)); },
  update(dt) {
    let fx = 0, fz = 0;
    const k = this.keys;
    if (k.has('KeyW') || k.has('ArrowUp')) fz += 1;
    if (k.has('KeyS') || k.has('ArrowDown')) fz -= 1;
    if (k.has('KeyA') || k.has('ArrowLeft')) fx -= 1;
    if (k.has('KeyD') || k.has('ArrowRight')) fx += 1;
    if (this.over && !Input.down) {
      const m = 8;
      if (this.mx < m) fx -= 1; if (this.mx > window.innerWidth - m) fx += 1;
      if (this.my < m) fz += 1; if (this.my > window.innerHeight - m) fz -= 1;
    }
    if (k.has('KeyQ')) this.tyaw += dt * 1.7;
    if (k.has('KeyE')) this.tyaw -= dt * 1.7;
    const sp = (30 + this.dist * 1.1) * dt, s = Math.sin(this.yaw), c = Math.cos(this.yaw);
    this.x = clamp(this.x + (fx * c - fz * s) * sp, -125, 125);
    this.z = clamp(this.z + (-fx * s - fz * c) * sp, -125, 125);
    this.dist = lerp(this.dist, this.tdist, Math.min(1, dt * 8));
    this.yaw = lerp(this.yaw, this.tyaw, Math.min(1, dt * 8));
    this.apply();
    this.shakeA = Math.max(0, this.shakeA - dt * 2.5);
  },
  apply() {
    const p = this.pitch(), h = this.dist * Math.cos(p), sh = this.shakeA * 0.6;
    const cx = this.x + Math.sin(this.yaw) * h, cz = this.z + Math.cos(this.yaw) * h;
    const want = safeCamY(cx, cz, this.dist * Math.sin(p));
    this.yb = this.yb === undefined ? want : lerp(this.yb, want, 0.15);
    camera.position.set(cx + rand(-sh, sh), this.yb + rand(-sh, sh), cz + rand(-sh, sh));
    camera.lookAt(this.x, 0, this.z);
    AudioSys.listener.x = this.x; AudioSys.listener.z = this.z;
  },
  shake(a, x, z) {
    const d = x === undefined ? 0 : dist(x, z, this.x, this.z);
    this.shakeA = Math.min(3, Math.max(this.shakeA, a * clamp(1.2 - d / 150, 0.1, 1)));
  },
  center(x, z) { this.x = clamp(x, -125, 125); this.z = clamp(z, -125, 125); },
};

const FPV = {
  u: null, yaw: 0, pitch: 0, roll: 0, keys: new Set(), firing: false, wantMissile: false, mslCd: 0, side: 1, hud: null, aimT: null, fov: 50,
  enter(u) {

    this.yaw = u.rot; this.pitch = -0.1; this.roll = 0; this.keys.clear(); this.firing = false; this.mslCd = 0;

      <div class="fpv-top"><b>🎮 DRON</b> <span class="fpv-rec">● REC</span><div class="bar"><div class="fill"></div></div><span class="fpv-msl"></span></div>
      <div class="fpv-help">WASD moverte · ratón o flechas: mirar · Espacio / Shift: subir y bajar · clic: disparar · clic derecho o F: misil</div>`));

  },
  exit(why) {
    const u = this.u;
    if (!u) return;
    this.u = null; u.piloted = false; this.firing = false; this.keys.clear();
    camera.fov = this.fov; camera.updateProjectionMatrix();
    this.hud?.remove(); this.hud = null;
    document.body.classList.remove('fpv-on');
    if (document.pointerLockElement) document.exitPointerLock();
    Cam.center(u.x, u.z + 20); Cam.yb = undefined;
    if (why) msg(why, 'warn');
  },
  look(dx, dy) { this.yaw -= dx * 0.0032; this.pitch = clamp(this.pitch - dy * 0.0032, -1.3, 0.9); },
  dir() { const c = Math.cos(this.pitch); return { x: Math.sin(this.yaw) * c, y: Math.sin(this.pitch), z: Math.cos(this.yaw) * c }; },
  // qué hay en la mira: el monstruo (como un cilindro de su altura) o una larva
  aim(range) {
    const o = camera.position, d = this.dir();
    let best = null, bt = range;
    const test = (t, px, py, pz, r) => {
      const wx = px - o.x, wy = py - o.y, wz = pz - o.z, tt = wx * d.x + wy * d.y + wz * d.z;
      if (tt <= 0 || tt >= bt) return;
      const cx = wx - d.x * tt, cy = wy - d.y * tt, cz = wz - d.z * tt;
      if (cx * cx + cy * cy + cz * cz < r * r) { bt = tt; best = t; }
