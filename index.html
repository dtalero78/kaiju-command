<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaiju Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --panel: rgba(10, 16, 14, 0.86);
  --panel2: rgba(18, 28, 24, 0.94);
  --line: #34503f;
  --line2: #58826a;
  --accent: #8dff9f;
  --gold: #ffd34d;
  --uran: #a6ff3d;
  --danger: #ff5a4d;
  --warn: #ffb03b;
  --radar: #4dc3ff;
  --text: #e6f2ea;
  --muted: #8ea89a;
  --font: 'Oxanium', 'Trebuchet MS', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--text); font-family: var(--font); user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.hidden { display: none !important; }
button { font-family: var(--font); }

/* ---------------- HUD ---------------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#topbar { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 14px; background: linear-gradient(to bottom, rgba(5,10,8,.94), rgba(5,10,8,.6)); border-bottom: 1px solid var(--line); }
.res { display: flex; gap: 18px; font-size: 20px; font-weight: 600; min-width: 280px; align-items: center; }
.res .money b { color: var(--gold); } .res .uran b { color: var(--uran); }
#income { font-size: 13px; color: var(--gold); opacity: 0; transition: opacity .4s; }
#income.show { opacity: 1; }
#center { flex: 1; max-width: 560px; text-align: center; }
#phase { font-size: 15px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
#phase.alert { color: var(--warn); font-size: 22px; font-weight: 800; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .5; } }
#mbar .mname { font-weight: 800; letter-spacing: 3px; color: #ff8a7a; font-size: 14px; margin-bottom: 3px; }
#fpv { position: fixed; inset: 0; pointer-events: none; z-index: 30; font-family: inherit; }
#fpv .fpv-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%), repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 3px); }
#fpv .fpv-x { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 2px solid rgba(160,255,190,.85); border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,.6); }
#fpv .fpv-x::before, #fpv .fpv-x::after { content: ''; position: absolute; background: rgba(160,255,190,.9); }
#fpv .fpv-x::before { left: 15px; top: -9px; width: 2px; height: 48px; }
#fpv .fpv-x::after { top: 15px; left: -9px; height: 2px; width: 48px; }
#fpv.lock .fpv-x { border-color: #ff5a4a; }
#fpv.lock .fpv-x::before, #fpv.lock .fpv-x::after { background: #ff5a4a; }
#fpv .fpv-tgt { position: absolute; left: 50%; top: calc(50% + 30px); transform: translateX(-50%); color: #ff8a7a; font-weight: 700; letter-spacing: 2px; font-size: 13px; text-shadow: 0 1px 3px #000; }
#fpv .fpv-top { position: absolute; left: 16px; top: 64px; width: 230px; color: #dfffe6; font-size: 13px; text-shadow: 0 1px 3px #000; display: flex; flex-direction: column; gap: 6px; }
#fpv .fpv-top .fill { background: linear-gradient(90deg, #2fbf5a, #9dff9f); }
#fpv .fpv-rec { color: #ff4a3a; animation: fpvrec 1s steps(2) infinite; }
@keyframes fpvrec { 50% { opacity: 0; } }
#fpv .fpv-help { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: rgba(230,255,235,.85); font-size: 12px; text-align: center; text-shadow: 0 1px 3px #000; padding: 0 16px; }
#fpv .fpv-out { position: absolute; right: 16px; top: 64px; pointer-events: auto; }
body.fpv-on #selpanel, body.fpv-on #boxsel, body.fpv-on #buildpanel, body.fpv-on #minimapBox { display: none !important; }
.bar { position: relative; height: 12px; background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #c0281e, #ff6a3d); transition: width .25s; }
.bar .fill.ice { background: linear-gradient(90deg, #4dc3ff, #e6fbff); }
#mmarks .mk { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.75); }
.right { display: flex; gap: 14px; align-items: center; }
#cityWrap { width: 240px; }
#cityWrap .lbl { font-size: 12px; letter-spacing: 1px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 3px; }
#cityWrap .lbl b { color: var(--text); font-size: 14px; }
#cityFill { background: linear-gradient(90deg, #2e9d58, #8dff9f) !important; }
#cityFill.low { background: linear-gradient(90deg, #a01e14, #ff6a3d) !important; }
.mark30, .mark70 { position: absolute; top: -1px; bottom: -1px; width: 2px; z-index: 2; }
.mark30 { left: 30%; background: var(--danger); } .mark70 { left: 70%; background: var(--gold); }
#monus { font-size: 12px; color: var(--muted); margin-top: 3px; }
.btns { display: flex; gap: 6px; }
.btns button { width: 40px; height: 40px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-size: 18px; cursor: pointer; }
.btns button:hover { border-color: var(--accent); }
.btns button.on { border-color: var(--radar); background: rgba(77,195,255,.2); }
#msgs { position: absolute; top: 74px; left: 14px; width: 440px; pointer-events: none !important; display: flex; flex-direction: column; gap: 6px; }
.msg { background: var(--panel); border-left: 4px solid var(--line2); padding: 7px 12px; font-size: 14px; border-radius: 0 4px 4px 0; animation: msgIn .25s ease-out; transition: opacity .8s; }
.msg.good { border-color: var(--accent); } .msg.warn { border-color: var(--warn); } .msg.danger { border-color: var(--danger); color: #ffd8d4; } .msg.radar { border-color: var(--radar); color: #d6f1ff; }
.msg.fade { opacity: 0; }
@keyframes msgIn { from { transform: translateX(-20px); opacity: 0; } }
#minimapBox { position: absolute; left: 12px; bottom: 12px; width: 212px; height: 212px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 5px; }
#minimap { width: 200px; height: 200px; display: block; cursor: crosshair; }
#nosignal { position: absolute; inset: 5px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 800; letter-spacing: 2px; color: var(--muted); background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px), #0a0f0d; pointer-events: none; }
#nosignal small { font-weight: 400; letter-spacing: 0; margin-top: 6px; }
#selpanel { position: absolute; left: 236px; right: 340px; bottom: 12px; height: 156px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 10px 12px; display: flex; gap: 14px; overflow: hidden; }
#selpanel .empty { color: var(--muted); font-size: 13px; align-self: center; line-height: 1.6; }
#buildpanel { position: absolute; right: 12px; bottom: 12px; width: 316px; background: var(--panel); border: 1px solid var(--line2); border-radius: 6px; padding: 8px; }
.ptitle { font-size: 12px; letter-spacing: 2px; color: var(--muted); margin: 0 0 6px 2px; }
#buildgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bbtn { position: relative; height: 74px; border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 2px; color: var(--text); font-size: 10px; line-height: 1.15; text-align: center; overflow: hidden; }
.bbtn img { width: 46px; height: 46px; object-fit: contain; pointer-events: none; }
.bbtn .c { color: var(--gold); font-size: 10px; }
.bbtn .c i { color: var(--uran); font-style: normal; }
.bbtn:hover { border-color: var(--accent); background: rgba(141,255,159,.08); }
.bbtn.off { opacity: .45; }
.bbtn.locked { opacity: .35; filter: grayscale(1); cursor: not-allowed; }
.bbtn.locked::after { content: '🔒'; position: absolute; top: 4px; right: 4px; font-size: 12px; }
.bbtn .q { position: absolute; top: 3px; left: 4px; font-size: 13px; font-weight: 800; color: var(--accent); }
.bbtn .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.bbtn.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.sp-icon { width: 100px; height: 100px; flex: none; border: 1px solid var(--line); border-radius: 6px; background: rgba(255,255,255,.03); display: flex; align-items: center; justify-content: center; }
.sp-icon img { width: 94px; height: 94px; }
.sp-info { flex: 1; min-width: 0; font-size: 13px; }
.sp-info h3 { margin: 0 0 4px; font-size: 17px; letter-spacing: 1px; }
.sp-info .desc { color: var(--muted); font-size: 12px; margin-top: 5px; line-height: 1.35; }
.sp-hp { height: 9px; margin: 4px 0; }
.sp-hp .fill { background: linear-gradient(90deg, #2e9d58, #8dff9f); }
.stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.stats b { color: var(--text); }
.sp-prod { display: flex; gap: 6px; flex-wrap: wrap; align-content: flex-start; max-width: 420px; }
.sp-prod .bbtn { width: 66px; height: 70px; }
.sp-multi { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; overflow: hidden; flex: 1; }
.mini { width: 44px; height: 46px; border: 1px solid var(--line); border-radius: 4px; position: relative; cursor: pointer; background: rgba(255,255,255,.03); }
.mini:hover { border-color: var(--accent); }
.mini img { width: 42px; height: 36px; pointer-events: none; }
.mini .hp { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 4px; background: #222; }
.mini .hp i { display: block; height: 100%; background: var(--accent); }
.queue { display: flex; gap: 4px; margin-top: 6px; min-height: 36px; }
.queue .qi { width: 36px; height: 36px; border: 1px solid var(--line2); border-radius: 4px; position: relative; cursor: pointer; background: rgba(255,255,255,.04); }
.queue .qi img { width: 34px; height: 34px; pointer-events: none; }
.queue .qi .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
#pauseBanner { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; padding: 10px 26px; background: rgba(30, 80, 160, .38); border: 1px solid #7fb6ff; color: #cfe4ff; font-weight: 800; letter-spacing: 4px; font-size: 22px; border-radius: 6px; pointer-events: none !important; }
#pauseBanner small { font-size: 12px; letter-spacing: 1px; font-weight: 400; margin-top: 2px; }
body.tpause #pauseBanner { display: flex; }
body.tpause canvas#gl { filter: saturate(.5) brightness(.92); }
#bSkipCount { position: absolute; top: 74px; right: 14px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--warn); background: rgba(60,40,0,.75); color: var(--warn); font-weight: 600; cursor: pointer; }
#bSkipCount:hover { background: rgba(110,70,0,.85); }
#boxsel { position: fixed; border: 1px solid var(--accent); background: rgba(141,255,159,.12); pointer-events: none; display: none; z-index: 5; }
#tooltip { position: fixed; z-index: 60; max-width: 290px; background: rgba(8,12,10,.97); border: 1px solid var(--line2); padding: 8px 10px; border-radius: 5px; font-size: 12px; pointer-events: none; display: none; line-height: 1.4; }
#tooltip h4 { margin: 0 0 4px; font-size: 14px; }
#tooltip .cost { color: var(--gold); } #tooltip .cu { color: var(--uran); } #tooltip .lock { color: var(--warn); } #tooltip .dim { color: var(--muted); }
#sandboxPanel { position: absolute; top: 120px; right: 14px; width: 270px; background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 10px 12px; font-size: 12px; }
#sandboxPanel h4 { margin: 0 0 6px; letter-spacing: 2px; color: var(--accent); }
#sandboxPanel label { display: flex; justify-content: space-between; margin: 8px 0 2px; color: var(--muted); }
#sandboxPanel input[type=range] { width: 100%; }
#sandboxPanel .row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.sbtn { padding: 5px 8px; border-radius: 4px; border: 1px solid var(--line2); background: rgba(255,255,255,.05); color: var(--text); cursor: pointer; font-size: 11px; font-family: var(--font); }
.sbtn:hover { border-color: var(--accent); }
.sbtn.on { border-color: var(--accent); color: var(--accent); }

/* ---------------- cinemáticas ---------------- */
.lb { position: fixed; left: 0; right: 0; height: 0; background: #000; z-index: 20; transition: height .6s ease; }
#lbTop { top: 0; } #lbBot { bottom: 0; }
body.cine .lb { height: 11vh; }
body.cine #hud { display: none; }
#cineText { position: fixed; left: 0; right: 0; bottom: 15vh; text-align: center; z-index: 21; pointer-events: none; opacity: 0; transition: opacity .6s; }
#cineText.show { opacity: 1; }
#cineText .t1 { font-size: clamp(40px, 7vw, 84px); font-weight: 800; letter-spacing: .16em; color: #fff; text-shadow: 0 0 30px var(--glow, rgba(255,80,40,.8)), 0 4px 0 #000; }
#cineText .t2 { font-size: clamp(14px, 2vw, 24px); letter-spacing: .3em; color: #ffd9c9; margin-top: 6px; text-shadow: 0 2px 0 #000; }
#cineSkip { position: fixed; right: 20px; bottom: calc(11vh + 12px); z-index: 22; color: #aaa; font-size: 13px; letter-spacing: 1px; display: none; cursor: pointer; }
body.cine #cineSkip { display: block; }
#orch { position: fixed; right: 14px; bottom: 12px; z-index: 45; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; pointer-events: none; transition: opacity .6s; }
#orch.hide { opacity: 0; }
.track { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: rgba(255,255,255,.03); }
.track.on { border-color: var(--accent); background: rgba(141,255,159,.08); }
.track .pl { width: 38px; height: 38px; flex: none; border-radius: 50%; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 14px; }
.track .pl:hover { border-color: var(--accent); }
.track .tt { flex: 1; } .track .tt b { display: block; font-size: 15px; } .track .tt span { font-size: 12px; color: var(--muted); }
.track.soon { opacity: .45; } .track.soon .pl { cursor: default; }
.trackhead { margin: 16px 0 6px; font-size: 13px; letter-spacing: 2px; color: var(--accent); font-weight: 600; }
.credits p { line-height: 1.6; margin: 8px 0; } .credits a { color: var(--accent); }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 30; transition: opacity .5s; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 19; }

/* ---------------- pantallas ---------------- */
#screen { position: fixed; inset: 0; z-index: 40; display: none; overflow-y: auto; }
#screen.on { display: block; }
.scr { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; background: radial-gradient(ellipse at center, rgba(0,0,0,.3), rgba(0,0,0,.85)); }
.scr.clear { background: linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.6)); }
.logo { font-size: clamp(48px, 9vw, 124px); font-weight: 800; letter-spacing: .12em; line-height: .95; text-align: center; color: #fff; text-shadow: 0 0 40px rgba(255,90,40,.55), 0 6px 0 #3a0d06; }
.logo span { display: block; font-size: .4em; letter-spacing: .55em; color: var(--accent); text-shadow: 0 0 20px rgba(141,255,159,.6); margin-top: .15em; }
.tag { margin-top: 18px; color: #cfe; letter-spacing: 3px; font-size: 16px; text-align: center; }
.press { margin-top: 56px; font-size: 18px; letter-spacing: 4px; animation: blink 1.4s infinite; }
.menu { display: flex; flex-direction: column; gap: 12px; margin-top: 40px; min-width: 320px; }
.mbtn { padding: 14px 24px; font-size: 20px; letter-spacing: 3px; font-weight: 600; color: var(--text); background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: all .15s; }
.mbtn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(4px); }
.mbtn.primary { border-color: var(--accent); background: rgba(40, 110, 60, .6); }
.mbtn.small { font-size: 14px; padding: 9px 16px; letter-spacing: 2px; }
.mbtn.danger { border-color: var(--danger); }
.mbtn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.panel { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 22px; max-width: 1120px; width: 100%; }
h1.st { font-size: 34px; letter-spacing: 6px; margin: 0 0 6px; } h2.st { font-size: 18px; letter-spacing: 3px; margin: 18px 0 8px; color: var(--accent); }
.sub { color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-top: 16px; }
.card { border: 1px solid var(--line2); border-radius: 8px; padding: 10px; background: rgba(255,255,255,.03); cursor: pointer; text-align: center; transition: all .15s; position: relative; }
.card:hover { border-color: var(--accent); transform: translateY(-3px); }
.card.locked { opacity: .45; cursor: not-allowed; transform: none; border-color: var(--line); }
.card.secret { border-color: #b04dff; background: rgba(176,77,255,.08); }
.card img { width: 130px; height: 130px; object-fit: contain; }
.card .n { font-size: 12px; color: var(--muted); letter-spacing: 2px; }
.card .c { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
.card .m { color: #ff9a85; font-size: 13px; letter-spacing: 2px; }
.medals { font-size: 22px; margin-top: 6px; letter-spacing: 4px; }
.off { filter: grayscale(1) brightness(.45); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; }
.seg button { padding: 8px 16px; background: transparent; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; letter-spacing: 1px; }
.seg button.on { background: rgba(141,255,159,.18); color: var(--accent); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.techgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.tnode { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; background: rgba(255,255,255,.03); }
.tnode img { width: 54px; height: 54px; }
.tnode .ti { flex: 1; } .tnode .ti b { font-size: 15px; } .tnode .ti div { font-size: 12px; color: var(--muted); }
.tnode.owned { border-color: var(--accent); background: rgba(141,255,159,.08); }
.tnode .tic { width: 54px; height: 54px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.tnode button { min-width: 100px; }
.res-big { font-size: clamp(40px, 7vw, 72px); font-weight: 800; letter-spacing: 8px; text-align: center; }
.win { color: var(--accent); text-shadow: 0 0 30px rgba(141,255,159,.5); } .lose { color: var(--danger); text-shadow: 0 0 30px rgba(255,90,77,.5); }
.mrow { display: flex; gap: 16px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
.mcard { width: 210px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; text-align: center; }
.mcard .ic { font-size: 44px; } .mcard.got { border-color: var(--gold); background: rgba(255,211,77,.08); }
.mcard.new::after { content: '¡NUEVA!'; display: block; color: var(--gold); font-weight: 800; font-size: 12px; margin-top: 4px; letter-spacing: 2px; }
.mcard .t { font-size: 13px; color: var(--muted); }
.statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 10px 0 18px; text-align: center; }
.statgrid div { border: 1px solid var(--line); border-radius: 6px; padding: 8px; } .statgrid b { display: block; font-size: 22px; } .statgrid span { font-size: 12px; color: var(--muted); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 14px; align-items: center; }
.keys kbd { background: #1d2a24; border: 1px solid var(--line2); border-radius: 4px; padding: 2px 8px; font-family: var(--font); color: var(--accent); white-space: nowrap; }
.opt { display: grid; grid-template-columns: 170px 1fr 50px; gap: 10px; align-items: center; margin: 10px 0; }
.brief { display: grid; grid-template-columns: 240px 1fr; gap: 22px; align-items: start; }
.brief img { width: 240px; height: 240px; }
.intel { border-left: 3px solid var(--warn); padding: 10px 14px; background: rgba(255,176,59,.08); margin: 10px 0; line-height: 1.45; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 16px; padding: 2px 10px 2px 2px; font-size: 12px; }
.chip img { width: 28px; height: 28px; }
.chip.locked { opacity: .35; }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.pick { border: 1px solid var(--line); border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; font-size: 13px; }
.pick img { width: 90px; height: 90px; }

// distancia de un punto a un segmento en el plano XZ
function segDist(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az, L = dx * dx + dz * dz;
  const t = L ? clamp(((px - ax) * dx + (pz - az) * dz) / L, 0, 1) : 0;

}
// ¿un círculo toca un rectángulo centrado en (x, z)?
function circleRect(cx, cz, r, x, z, w, d) {
  const nx = clamp(cx, x - w / 2, x + w / 2), nz = clamp(cz, z - d / 2, z + d / 2);
  return (cx - nx) ** 2 + (cz - nz) ** 2 <= r * r;
}
// ¿un punto está dentro de un cono (origen, dirección, alcance, medio ángulo)?
function inCone(px, pz, ox, oz, rot, range, half) {
  const dx = px - ox, dz = pz - oz, d = Math.hypot(dx, dz);
  if (d > range) return false;
  if (d < 2) return true;
  return Math.abs(angleDiff(rot, Math.atan2(dx, dz))) <= half;
}

//  Las canciones se escriben por secciones (melodías, acordes, ostinatos
//  y patrones de percusión) y se tocan con instrumentos reales grabados
//  (colección FluidR3, CC BY 3.0) que se descargan en segundo plano.
//  Mientras no han cargado, o sin internet, suena una versión sintetizada.
//  Todas las composiciones son originales.
// ---------------------------------------------------------------------
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const NOTE_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const FLAT_NAMES = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
// "Eb4" → 63
function nm(s) {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(s);
  if (!m) throw new Error('nota inválida: ' + s);
  return 12 * (+m[3] + 1) + NOTE_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
// melodía: "D4:6 A4:2 [D4,F4]:8 -:4" → nota:duración en semicorcheas; "-" es silencio; "|" separa compases
function parseMel(str) {
  const ev = [];
  let t = 0;
  for (const tok of str.split(/\s+/)) {
    if (!tok || tok === '|') continue;
    const [n, d0] = tok.split(':');
    const d = parseFloat(d0);
    if (!(d > 0)) throw new Error('duración inválida: ' + tok);
    if (n !== '-') {
      const notes = n.startsWith('[') ? n.slice(1, -1).split(',').map(nm) : [nm(n)];
      ev.push({ s: t, n: notes, d, v: d0.endsWith('!') ? 1 : 0.85 });
    }
    t += d;
  }
  return { ev, len: t };
}
const CHORD_IV = { M: [0, 4, 7], m: [0, 3, 7], 5: [0, 7], dim: [0, 3, 6], sus: [0, 5, 7] };
function parseChord(sym) {
  const m = /^([A-G])(#|b)?(m|5|dim|sus)?$/.exec(sym);
  if (!m) throw new Error('acorde inválido: ' + sym);
  return { root: NOTE_PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0), iv: CHORD_IV[m[3] || 'M'] };
}
// la raíz del acorde en la nota 'low' o justo encima
const rootAt = (ch, low) => low + ((((ch.root - low) % 12) + 12) % 12);
// notas del acorde desde 'low' hacia arriba
function chordNotes(ch, low, count = 3) {
  const out = [];
  let base = low - ((((low - ch.root) % 12) + 12) % 12);
  for (; out.length < count; base += 12) for (const i of ch.iv) { const n = base + i; if (n >= low && out.length < count) out.push(n); }
  return out;
}
function expandProg(str, bars) {
  const out = [];
  for (const tok of str.split(/\s+/)) {
    if (!tok) continue;
    const [sym, rep] = tok.split('*');
    for (let i = 0; i < (+rep || 1); i++) out.push(parseChord(sym));
  }
  while (out.length < bars) out.push(out[out.length - 1]);
  return out;
}
const PAT_VEL = (c) => (c === 'X' ? 1 : c === 'x' ? 0.7 : c === 'o' ? 0.4 : /[1-9]/.test(c) ? +c / 9 : 0);

// convierte la definición de una canción en compases → pasos → notas
function compileSong(def, form) {
  const spb = def.spb || 16, bars = [], mute = new Set(def.mute || []);
  for (const name of form || def.form) {
    const sec = def.sec[name];
    if (!sec) throw new Error('sección inexistente: ' + name);
    const prog = expandProg(sec.prog, sec.bars), base = bars.length, total = sec.bars * spb;
    for (let b = 0; b < sec.bars; b++) bars.push(Array.from({ length: spb }, () => []));
    const put = (abs, e) => { if (abs < total) bars[base + Math.floor(abs / spb)][abs % spb].push(e); };
    for (const tr of sec.tr) {
      if (mute.has(tr.i)) continue;
      const v = tr.v ?? 1, oct = (tr.oct || 0) * 12, i = tr.i;
      if (tr.mel) {
        for (const seg of tr.mel.split('|')) { const l = parseMel(seg).len; if (l % spb) console.warn(`compás incompleto (${l}/${spb}) en ${name} · ${i}: ${seg.trim()}`); }
        const { ev, len } = parseMel(tr.mel);
        if (len > total) console.warn('melodía más larga que la sección', name, i);
        const reps = tr.rep ? Math.ceil(total / len) : 1;
        for (let r = 0; r < reps; r++) for (const e of ev) put(r * len + e.s, { i, n: e.n.map((n) => n + oct), d: e.d, v: e.v * v });
      }
      if (tr.pat) {
        const bp = tr.pat.split('|');
        for (let b = 0; b < sec.bars; b++) {
          if (tr.once && b > 0) break;
          const p = bp[b % bp.length];
          for (let s = 0; s < spb; s++) {
            const vel = PAT_VEL(p[s]);
            if (!vel) continue;
            const n = tr.n ? nm(tr.n) + oct : tr.low !== undefined ? rootAt(prog[b], tr.low) : 60;
            put(b * spb + s, { i, n: [n], d: tr.d || 2, v: vel * v });
          }
        }
      }
      if (tr.pad !== undefined) for (let b = 0; b < sec.bars; b++) put(b * spb + (tr.at || 0), { i, n: chordNotes(prog[b], tr.pad, tr.count || 3), d: tr.len || spb, v });
      if (tr.stab !== undefined) for (let b = 0; b < sec.bars; b++) for (const s of tr.steps) put(b * spb + s, { i, n: chordNotes(prog[b], tr.stab, tr.count || 3), d: tr.d || 2, v });
      if (tr.ost !== undefined) {
        for (let b = 0; b < sec.bars; b++) {
          const ch = prog[b], root = rootAt(ch, tr.ost);
          tr.steps.forEach((s, k) => {
            const iv = tr.iv[k], off = iv === 't' ? ch.iv[1] : iv === 'f' ? ch.iv[ch.iv.length - 1] : iv;
            put(b * spb + s, { i, n: [root + off], d: tr.d || 2, v: v * (k === 0 ? 1 : 0.82) });
          });
        }
      }
      if (tr.arp !== undefined) {
        const every = tr.every || 2, order = tr.order || [0, 1, 2, 3];
        for (let b = 0; b < sec.bars; b++) {
          const tones = chordNotes(prog[b], tr.arp, tr.span || 4);
          for (let s = 0, k = 0; s < spb; s += every, k++) put(b * spb + s, { i, n: [tones[order[k % order.length] % tones.length]], d: tr.d || every, v: v * (s % 8 === 0 ? 1 : 0.78) });
        }
      }
    }
  }
  const instr = new Set(), gain = def.gain || 1;
  for (const bar of bars) for (const step of bar) for (const e of step) { e.v *= gain; if (INSTR[e.i] && INSTR[e.i].file) instr.add(e.i); }
  return { bpm: def.bpm, spb, bars, loop: def.loop !== false, swing: def.swing || 0, instr: [...instr], then: def.then || null };
}

// ---------- instrumentos ----------
const SF_URL = (f) => `https://cdn.jsdelivr.net/gh/gleitz/midi-js-soundfonts@gh-pages/FluidR3_GM/${f}-mp3.js`;
function vPluck(m, t, dur, v, dest = AudioSys.musicIn) {
  const c = AudioSys.ctx, f = mtof(m), lp = filt('lowpass', 2600, 4);
  lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(380, t + dur * 0.85);
  for (const det of [-7, 7]) { const o = osc('sawtooth', f, t, dur); o.detune.value = det; o.connect(lp); }
  const sub = osc('square', f / 2, t, dur), sg = c.createGain(); sg.gain.value = 0.3; sub.connect(sg); sg.connect(lp);
  chain(lp, envGain(t, 0.006, v, dur), dest);
}
function vBrass(m, t, dur, v, dest = AudioSys.musicIn) {
  const c = AudioSys.ctx, f = mtof(m), lp = filt('lowpass', 700, 1.5);
  lp.frequency.setValueAtTime(700, t); lp.frequency.exponentialRampToValueAtTime(2800, t + 0.1); lp.frequency.exponentialRampToValueAtTime(1500, t + 0.35);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.06);
  g.gain.setValueAtTime(v * 0.85, t + Math.max(0.08, dur - 0.08)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.15);
  for (const [type, det] of [['sawtooth', -5], ['sawtooth', 5], ['square', 0]]) { const o = osc(type, f, t, dur + 0.2); o.detune.value = det; o.connect(lp); }
  lp.connect(g); g.connect(dest); g.connect(AudioSys.rev);
}
function vPad(m, t, dur, v, dest = AudioSys.musicIn, bright = 1100) {
  const c = AudioSys.ctx, lp = filt('lowpass', bright, 0.7), g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.25);
  g.gain.setValueAtTime(v, t + Math.max(0.26, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  for (const det of [-9, 9]) { const o = osc('sawtooth', mtof(m), t, dur + 0.6); o.detune.value = det; o.connect(lp); }
  lp.connect(g); g.connect(dest); g.connect(AudioSys.rev);
}
function vChoir(m, t, dur, v, dest = AudioSys.musicIn) {
  const c = AudioSys.ctx, bp = filt('bandpass', 900, 0.9), g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.3);
  g.gain.setValueAtTime(v, t + Math.max(0.31, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
  const vib = osc('sine', 5, t, dur + 0.7), vg = c.createGain(); vg.gain.value = 6; vib.connect(vg);
  for (const [type, mul] of [['triangle', 1], ['sine', 2], ['triangle', 1.005]]) { const o = osc(type, mtof(m) * mul, t, dur + 0.7); vg.connect(o.detune); o.connect(bp); }
  bp.connect(g); g.connect(dest); g.connect(AudioSys.rev);
}
function vFlute(m, t, dur, v, dest = AudioSys.musicIn) {
  const c = AudioSys.ctx, f = mtof(m), g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.09);
  g.gain.setValueAtTime(v * 0.9, t + Math.max(0.1, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
  const vib = osc('sine', 5.5, t, dur + 0.3), vg = c.createGain(); vg.gain.value = 0; vg.gain.linearRampToValueAtTime(14, t + Math.min(0.6, dur)); vib.connect(vg);
  const o = osc('sine', f, t, dur + 0.3); vg.connect(o.detune); o.connect(g);
  const n = noiseSrc(t, dur + 0.3), nb = filt('bandpass', f * 2, 4), ng = c.createGain(); ng.gain.value = 0.25; chain(n, nb, ng, g);
  g.connect(dest); g.connect(AudioSys.rev);
}

  const lp = filt('lowpass', 600, 6);
  lp.frequency.setValueAtTime(600, t); lp.frequency.exponentialRampToValueAtTime(180, t + dur);
  osc('sawtooth', mtof(m), t, dur).connect(lp);
  chain(osc('sine', mtof(m), t, dur), envGain(t, 0.005, v * 0.8, dur), dest);
  chain(lp, envGain(t, 0.005, v, dur), dest);

function playSample(I, n, t, dur, v, dest) {
  const buf = I.buf.get(n);
  if (!buf) return false;
  const c = AudioSys.ctx, src = c.createBufferSource(), g = c.createGain(), peak = I.vol * v;
  src.buffer = buf;
  const att = I.att || 0.005;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + att);
  let end;
  if (I.perc) {
    end = t + Math.min(buf.duration, I.max || 3);
    g.gain.setValueAtTime(peak, Math.max(t + att + 0.01, end - 0.25));
  } else {
    end = Math.min(t + buf.duration, t + Math.max(dur, att + 0.05) + I.rel);
    g.gain.setValueAtTime(peak, Math.max(t + att + 0.01, Math.min(t + dur, end - 0.05)));
  }
  g.gain.linearRampToValueAtTime(0.0001, end);
  src.connect(g); g.connect(dest);
  if (I.rev) { const s = c.createGain(); s.gain.value = I.rev; g.connect(s); s.connect(AudioSys.rev); }
  src.start(t); src.stop(end + 0.05);
  return true;
}
function playEvent(e, t, sd, dest) {
  const I = INSTR[e.i];
  if (!I) return;
  const dur = e.d * sd;
  for (const n of e.n) if (!(I.file && playSample(I, n, t, dur, e.v, dest))) I.synth(n, t, dur, e.v, dest);
}

// ---------- orquesta: descarga y decodificación en segundo plano ----------
// orden de descarga: primero el núcleo orquestal, luego cada ciudad en el orden de la campaña
const ORCH_ORDER = ['strings', 'brass', 'choir', 'timpani', 'koto', 'shakuhachi', 'taiko', 'guitar', 'flute', 'sax', 'upbass', 'accordion', 'harp', 'synthstr', 'organ', 'voice'];
const Orch = { started: false, loaded: 0, failed: 0, total: 0, queue: [] };
function orchLoad() {
  if (Orch.started) return;
  Orch.started = true;
  Orch.queue = ORCH_ORDER.filter((k) => INSTR[k] && INSTR[k].file);
  Orch.total = Orch.queue.length;
  (async () => {
    while (Orch.queue.length) {
      const id = Orch.queue.shift();
      const I = INSTR[id];
      try {
        const res = await fetch(SF_URL(I.file));
        if (!res.ok) throw new Error(res.status);
        const txt = await res.text(), raw = {};
        for (const m of txt.matchAll(/"([A-G]b?)(\d)":\s*"data:audio\/mp3;base64,([^"]+)"/g)) raw[12 * (+m[2] + 1) + NOTE_PC[m[1][0]] - (m[1].length > 1 ? 1 : 0)] = m[3];
        I.raw = raw;
        Orch.loaded++;
        orchDecode(id);
      } catch (e) {
        I.failed = true; Orch.failed++;
      }
      if (typeof UI !== 'undefined' && UI.orchProgress) UI.orchProgress();
    }
  })();
}
async function orchDecode(id) {
  const I = INSTR[id], c = AudioSys.ctx;
  if (!I.raw || !c || I.decoding) return;
  I.decoding = true;
  for (const n of I.need) {
    if (I.buf.has(n) || !I.raw[n]) continue;
    try {
      const bin = atob(I.raw[n]), bytes = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      I.buf.set(n, await c.decodeAudioData(bytes.buffer));
    } catch (e) { /* esa nota se queda con el sonido sintetizado */ }
  }
  I.decoding = false;
}
function orchDecodeAll() { for (const id in INSTR) if (INSTR[id].file) orchDecode(id); }

// adelanta en la cola los instrumentos que se van a necesitar pronto
function orchPrioritize(ids) {
  const want = ids.filter((id) => Orch.queue.includes(id));
  Orch.queue = want.concat(Orch.queue.filter((id) => !want.includes(id)));
}

const Music = {

  },
  // cambia de canción al empezar el siguiente compás (o ya mismo con now = true)
  play(key, now) {
    if (!AudioSys.ctx) { this.want = key; return; }
    const k = this.resolve(key);
    if (!k) return;
    if (k === this.key && this.timer && !this.pending) return;
    if (!this.timer || !this.cur || now) this.start(k);

  start(k) {
    this.key = k; this.cur = SONGS[k]; this.bar = 0; this.step = 0; this.pending = null;

  },
  tick() {
    const c = AudioSys.ctx;
    if (!c || !this.cur) return;
    if (this.next < c.currentTime - 0.1) this.next = c.currentTime + 0.05; // la pestaña estuvo en segundo plano
    while (this.next < c.currentTime + 0.25) {

      this.next += sd;
      if (++this.step >= song.spb) {
        this.step = 0;
        if (++this.bar >= song.bars.length) {
          if (song.loop) this.bar = 0;
          else if (this.pending) this.bar = 0;
          else if (song.then && SONGS[song.then]) this.start(song.then);

  const d = r / Math.sin((15 * Math.PI) / 180) * 0.92;
  cam.position.set(c.x + d * Math.sin(angle) * 0.82, c.y + d * 0.45, c.z + d * Math.cos(angle) * 0.82);
  cam.lookAt(c);
  const rt = new THREE.WebGLRenderTarget(size, size, { samples: 4 });
  rt.texture.colorSpace = THREE.SRGBColorSpace;
  const prevShadow = renderer.shadowMap.enabled;
  renderer.shadowMap.enabled = false;
  renderer.setRenderTarget(rt);
  renderer.setClearColor(0x000000, 0);
  renderer.clear();
  renderer.render(sc, cam);
  const px = new Uint8Array(size * size * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, size, size, px);
  renderer.setRenderTarget(null);
  renderer.shadowMap.enabled = prevShadow;
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d'), img = g.createImageData(size, size);
  for (let y = 0; y < size; y++) img.data.set(px.subarray((size - 1 - y) * size * 4, (size - y) * size * 4), y * size * 4);
  g.putImageData(img, 0, 0);
  ICONS[key] = cv.toDataURL();
  rt.dispose();
  disposeTree(obj);
  return ICONS[key];
}

function chunks(x, y, z, n, color, o = {}) {
  const col = new THREE.Color(color);

    const out = o.out ?? 6;

    c.vx = Math.sin(ang) * rand(1, out) + (o.vx ?? 0); c.vz = Math.cos(ang) * rand(1, out) + (o.vz ?? 0); c.vy = rand(2, o.up ?? 9);
    c.rx = rand(TAU); c.ry = rand(TAU); c.rz = rand(TAU); c.vr = rand(-6, 6);
    c.s = sz * rand(0.45, 1); c.sx = c.s * rand(0.7, 1.4); c.sz = c.s * rand(0.7, 1.4);
    c.life = o.life ?? rand(3, 5); c.rest = false;

function ring(x, z, r0, r1, color = 0xffffff, life = 0.6, y = 0.4, a = 0.8) {

function setBeam(b, a, c, w, color, core) {

function updateFX(dt) {
  if (dt <= 0) return;
  const pools = [FX.puffs, FX.glows];
  for (const pool of pools) for (const p of pool) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.s.visible = false; continue; }
    const k = 1 - p.life / p.max;
    const dr = Math.pow(p.drag, dt * 60);
    p.vx *= dr; p.vy = p.vy * dr - p.grav * dt; p.vz *= dr;
    p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
    p.s.scale.setScalar(p.size + p.grow * k);
    p.s.material.opacity = p.a * Math.min(1, k * 8) * (1 - k);
  }
  let any = false;
  for (let i = 0; i < FX.chunks.length; i++) {
    const c = FX.chunks[i];
    if (!c.alive) continue;
    any = true;
    c.life -= dt;
    if (c.life <= 0) { c.alive = false; _o3.scale.set(0, 0, 0); _o3.updateMatrix(); FX.chunkMesh.setMatrixAt(i, _o3.matrix); continue; }
    if (!c.rest) {
      c.vy -= 30 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt; c.z += c.vz * dt;
      c.rx += c.vr * dt; c.rz += c.vr * 0.7 * dt;
      const floor = c.s * 0.4;
      if (c.y < floor) {
        c.y = floor; c.vy *= -0.3; c.vx *= 0.55; c.vz *= 0.55; c.vr *= 0.5;
        if (Math.abs(c.vy) < 1.2) { c.rest = true; c.vy = 0; }
      }
    }
    const sh = c.life < 1 ? c.life : 1;
    _o3.position.set(c.x, c.y, c.z); _o3.rotation.set(c.rx, c.ry, c.rz);
    _o3.scale.set(c.sx * sh, c.s * sh, c.sz * sh); _o3.updateMatrix();
    FX.chunkMesh.setMatrixAt(i, _o3.matrix);
  }
  if (any) FX.chunkMesh.instanceMatrix.needsUpdate = true;
  for (const r of FX.rings) {
    if (r.life <= 0) continue;
    r.life -= dt;
    if (r.life <= 0) { r.m.visible = false; continue; }
    const k = 1 - r.life / r.max;
    r.m.scale.setScalar(lerp(r.r0, r.r1, easeOut(k)));
    r.m.material.opacity = r.a * (1 - k);
  }
  for (const b of FX.beams) {
    if (b.hold || b.life <= 0) continue;
    b.life -= dt;
    if (b.life <= 0) { b.g.visible = false; continue; }
    const k = b.life / b.max;
    b.outer.material.opacity = 0.55 * k; b.inner.material.opacity = 0.95 * k;
  }
}

})();

      const ph = r * 1.05 + 1.0, rr = riser(seg, 0, r * 0.8, -1.3, ph, 2.0, -0.35, tailRisers);
      put(rr.g, part(plateGeo, rr.mat, 0.45, ph, 2.0)).rotation.x = -0.35;
    } else if (i < P.tail - 1) put(seg, part(plateGeo, plateMat, 0.42, r * 0.85 + 0.6, 1.6, 0, r * 0.8, -1.3)).rotation.x = -0.35;
    if (P.bumps && i < P.tail - 2) for (const s of [-1, 1]) seg.add(ORG(r * 0.5, r * 0.4, 1.2, P.dark, s * r * 0.75, r * 0.2, -1.2));
    seg.rotation.x = 0.07;
    tail.push(seg); parentT = seg; r *= 0.86;
  }
  const tipSeg = tail[tail.length - 1];
  let tailSkull = null;
  if (P.tailSkull) {
    // una pequeña calavera con dientes y ojos blancos en la punta de la cola
    tailSkull = grp(0, 0, -3.4); tipSeg.add(tailSkull);
    tailSkull.add(ORG(1.6, 1.2, 2.2, 0x3a2a2c, 0, 0, -0.6));
    for (const s of [-1, 1]) {
      tailSkull.add(part(G.ico1, mat(0xffffff, GLOW(0xffffff, 1.2)), 0.35, 0.35, 0.35, s * 0.45, 0.3, -1.4));
      for (let i = 0; i < 3; i++) put(tailSkull, CO(0.1, 0.4, TOOTH, s * 0.4, -0.45, -1.0 - i * 0.35)).rotation.x = Math.PI;
    }
  } else put(tipSeg, CO(r, 3, P.skin, 0, 0, -3.6)).rotation.x = -Math.PI / 2;
  // placas dorsales: tres filas en la espalda
  for (let i = 0; i < 7; i++) {
    const y = 5.6 - i * 1.75, z = -3.35 - Math.max(0, i - 3) * 0.25, sc = 1.7 - Math.abs(i - 2) * 0.17;
    const big = P.rise ? 1.55 : P.leaf ? 1.3 : 1, side = P.rise ? 1.3 : 1;
    let parent = torso, m = plateMat, ox = 0, oy = y, oz = z;
    if (P.rise) {
      const rr = riser(torso, 0, y, z, 3.4 * sc * big, 2.3 * sc * big, -0.5, torsoRisers);
      parent = rr.g; m = rr.mat; oy = 0; oz = 0;
    }
    put(parent, part(plateGeo, m, 0.5, 3.4 * sc * big, 2.3 * sc * big, ox, oy, oz)).rotation.x = -0.5;
    for (const sd of [-1, 1]) { const p = part(plateGeo, m, 0.42, 2.3 * sc * side, 1.6 * sc * side, sd * 1.25, oy - 0.4, oz + 0.35); p.rotation.x = -0.5; p.rotation.z = sd * 0.38; parent.add(p); }
  }
  // de la punta de la cola hacia la cabeza: el orden en que se levantan
  const risers = P.rise ? [...tailRisers.reverse(), ...torsoRisers.reverse()] : null;
  // piel rugosa: bultos por el torso y las piernas (el Godzilla de 1954)
  if (P.bumps) {
    const rng = mulberry32(54);
    for (let i = 0; i < 46; i++) {
      const a = rng() * TAU, y = rng() * 10 - 4.5;
      if (Math.cos(a) > 0.55 && y < 4) continue;   // el pecho y el vientre quedan lisos
      const sz = 0.42 + rng() * 0.45;
      torso.add(ORG(sz, sz * 0.8, sz, rng() < 0.5 ? P.dark : P.skin, Math.sin(a) * 4.0, y, Math.cos(a) * 3.5));
    }
    for (const L of legs) for (let i = 0; i < 9; i++) { const a = rng() * TAU, sz = 0.4 + rng() * 0.4; L.add(ORG(sz, sz * 0.8, sz, P.dark, Math.sin(a) * 2.5, -0.5 - rng() * 3.5, Math.cos(a) * 2.6)); }
  }
  // grietas brillantes (Shin)
  if (crackMat) {
    const rng = mulberry32(7);
    for (let i = 0; i < 34; i++) {
      const a = rng() * TAU, c = part(G.box, crackMat, 0.22, 1.4 + rng() * 2.4, 0.22, Math.sin(a) * 4.0, rng() * 11 - 5, Math.cos(a) * 3.5);
      c.rotation.z = rng() - 0.5; c.castShadow = false; torso.add(c);
    }
    for (const L of legs) for (let i = 0; i < 6; i++) { const c = part(G.box, crackMat, 0.2, 1.6, 0.2, (rng() - 0.5) * 3, -1 - rng() * 3, 2.4); c.rotation.z = rng() - 0.5; c.castShadow = false; L.add(c); }
    tail.forEach((sg, i) => { if (i % 2 === 0) { const c = part(G.box, crackMat, 0.2, 1.5, 0.2, (rng() - 0.5) * 2, 0.4, -1.4); c.rotation.x = Math.PI / 2; c.castShadow = false; sg.add(c); } });
  }
  const model = { root, body, torso, head, jaw, jawL, jawR, neck, arms, legs, shins, tail, tailSkull, plateMat, eyeMat, throatMat, risers };
  let lastThroat = null;
  model.anim = (m, dt) => {
    const mv = m.moveAmt, w = m.walk;
    for (let i = 0; i < 2; i++) {
      const s = i === 0 ? 1 : -1;
      legs[i].rotation.x = Math.sin(w) * 0.42 * s * mv;
      shins[i].rotation.x = Math.max(0, -Math.sin(w) * s) * 0.5 * mv;
    }
    body.position.y = Math.abs(Math.sin(w)) * 0.5 * mv;
    torso.rotation.z = Math.sin(w) * 0.05 * mv;
    torso.rotation.x = 0.2 + Math.sin(m.t * 1.1) * 0.02 + (m.lunge || 0) * 0.12;
    neck.rotation.x = (m.lunge || 0) * 0.3;
    for (let i = 0; i < tail.length; i++) {
      tail[i].rotation.y = Math.sin(m.t * 1.4 - i * 0.55) * 0.09 + m.tailSwing * (i < 3 ? 0.35 : 0.15);
      tail[i].rotation.x = 0.06 + Math.sin(m.t * 0.9 - i * 0.4) * 0.03;
    }
    arms[0].rotation.z = -0.15 + Math.sin(m.t * 1.3) * 0.08; arms[1].rotation.z = 0.15 - Math.sin(m.t * 1.3) * 0.08;
    const jo = Math.max(0, m.jaw);
    if (jawL) { jaw.rotation.x = jo * 0.42; jawL.rotation.y = -jo * 0.55; jawR.rotation.y = jo * 0.55; jawL.rotation.z = jo * 0.25; jawR.rotation.z = -jo * 0.25; }
    else jaw.rotation.x = jo * 0.7;
    head.rotation.x = -jo * 0.3 + m.headPitch;
    neck.rotation.y = clamp(m.headYaw, -0.6, 0.6);
    plateMat.emissiveIntensity = m.glow * 3.2;
    if (risers) {
      // las placas salen con un chasquido, una tras otra, y se cierran de golpe al disparar
      const want = m.action && m.action.kind === 'nuke' ? m.rise || 0 : 0, N = risers.length;
      risers.forEach((p, i) => {
        const tgt = clamp(want * N - i, 0, 1);
        p.e += (tgt - p.e) * Math.min(1, dt * (tgt > p.e ? 16 : 24));
        p.g.position.copy(p.base).addScaledVector(p.dir, p.e * p.h * 0.42);
        p.g.scale.setScalar(1 + p.e * 0.12);
        p.mat.emissiveIntensity = p.e * 3.4 + m.glow * 0.9;
        p.seam.visible = p.e > 0.03;
        if (p.seam.visible) { p.seam.scale.y = 0.3 + p.e * p.h * 0.3; p.seam.position.copy(p.base).addScaledVector(p.dir, p.e * p.h * 0.1); }
      });
    }
    const tc = m.throatColor ?? P.glow;
    if (tc !== lastThroat) { throatMat.emissive.setHex(tc); lastThroat = tc; }
    throatMat.emissiveIntensity = m.glow * 2.5 + (m.breath || 0) * 4;
    const a = m.action;
    if (a && a.kind === 'stomp') {
      const k = a.t / a.dur;
      legs[0].rotation.x = -Math.sin(Math.min(1, k / 0.55) * Math.PI) * 0.9;
      body.rotation.x = Math.sin(k * Math.PI) * 0.08;
    } else if (a && a.kind === 'tail') {
      body.rotation.y = Math.sin((a.t / a.dur) * Math.PI) * 1.1;
    } else { body.rotation.y *= 0.9; if (m.state !== 'dying') body.rotation.x *= 0.9; }
  };
  return model;
}

function wingMesh(pts, color, o = {}) {
  const sh = new THREE.Shape();
  sh.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) sh.lineTo(pts[i][0], pts[i][1]);
  const geo = new THREE.ShapeGeometry(sh);
  geo.rotateX(-Math.PI / 2);
  // UV normalizadas al rectángulo que ocupa el ala
  geo.computeBoundingBox();
  const bb = geo.boundingBox, uv = geo.attributes.uv, pos = geo.attributes.position;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) - bb.min.x) / (bb.max.x - bb.min.x), (pos.getZ(i) - bb.min.z) / (bb.max.z - bb.min.z));
  const material = o.material || new THREE.MeshStandardMaterial({ color, side: THREE.DoubleSide, flatShading: true, roughness: 0.8, emissive: o.emissive ?? 0, emissiveIntensity: o.ei ?? 1 });
  const m = new THREE.Mesh(geo, material);
  m.castShadow = true;
  return m;
}

const MModels = {

    const bloom = grp(0, 21, 0.6); bloom.rotation.x = 0.35; rose.add(bloom);

      for (let i = 0; i < n; i++) { const a = (i / n) * TAU + ring * 0.4, pt = ORG(4.6 - ring, 1.0, 6 - ring * 1.4, c, Math.sin(a) * rr, 0.6 + ring * 0.9, Math.cos(a) * rr); pt.rotation.set(-Math.cos(a) * (0.5 + ring * 0.35), 0, Math.sin(a) * (0.5 + ring * 0.35)); pt.rotation.order = 'YXZ'; pt.rotation.y = a; bloom.add(pt); }

  condor() {

  // Anguirax: inspirado en el Anguirus de Final Wars. Cuadrúpedo con un caparazón cubierto de púas,

  anguirax() {
    const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
    const SK = 0x6e5a3c, DK = 0x4a3c28, BE = 0xa08a64, SPK = 0xe6dcc4, HORN = 0xd8ccb0, rng = mulberry32(31);
    const spike = (parent, x, y, z, nx, ny, nz, len, rad) => {
      const c = CO(rad, len, SPK, x + nx * len * 0.4, y + ny * len * 0.4, z + nz * len * 0.4);
      c.quaternion.setFromUnitVectors(_up, _v1.set(nx, ny, nz).normalize()); parent.add(c);
    };
    // caparazón con púas que salen hacia afuera, más largas a lo largo del lomo
    const shell = grp(0, 8.4, -0.6); body.add(shell);
    shell.add(ORG(11, 7, 15, SK)); shell.add(ORG(9.4, 5, 13, DK, 0, 1.6, 0));
    for (let i = 0; i < 52; i++) {
      const ph = rng() * 1.8 - 0.9, th = (rng() - 0.5) * 2.5, sc = Math.sqrt(1 - ph * ph);
      const x = Math.sin(th) * 5.4 * sc, y = Math.cos(th) * 3.5 * sc + 0.3, z = ph * 7.2;
      spike(shell, x, y, z, x / 29, y / 12, z / 56, (2.6 - Math.abs(th)) * rng() * 0.6 + 1.1, 0.38);
    }
    for (let i = 0; i < 7; i++) spike(shell, 0, 3.6 - Math.abs(i - 3) * 0.25, -5.4 + i * 1.8, 0, 1, -0.25, 3.2, 0.5);
    // cuello y cabeza con cuerno, corona de cuernos y mandíbula
    const neck = grp(0, 8.6, 6.6); body.add(neck);
    neck.add(ORG(4.6, 4, 4.4, SK, 0, 0, 0.8));
    const head = grp(0, 0.4, 2.8); neck.add(head);
    head.add(ORG(4.2, 3.2, 4.6, SK, 0, 0, 0.6));
    put(head, part(G.frust4, SK, 2.8, 3, 1.8, 0, -0.4, 3)).rotation.x = Math.PI / 2;
    put(head, CO(0.55, 2.8, HORN, 0, 1.2, 3.6)).rotation.x = 0.55;
    for (let i = 0; i < 5; i++) { const a = (i - 2) * 0.5; put(head, CO(0.32, 2.2, HORN, Math.sin(a) * 1.9, 1.5, -1.2 + Math.abs(a) * 0.5)).rotation.set(-0.9, 0, -a * 0.8); }
    for (const sx of [-1, 1]) {
      head.add(part(G.ico1, mat(0xff8a2a, GLOW(0xff6a10, 1.4)), 0.5, 0.42, 0.5, sx * 1.5, 0.6, 2.2));
      for (let i = 0; i < 4; i++) put(head, CO(0.15, 0.5, 0xf2eee0, sx * 0.95, -1.1, 1.9 + i * 0.6)).rotation.x = Math.PI;
    }
    const jaw = grp(0, -1, 1.2); head.add(jaw);
    put(jaw, part(G.frust4, BE, 2.4, 3.2, 0.9, 0, -0.3, 1.6)).rotation.x = Math.PI / 2;
    // cuatro patas gruesas
    const legs = [];
    for (const [sx, sz] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
      const L = grp(sx * 4.4, 7.4, sz * 4.6 - 0.6); body.add(L);
      L.add(ORG(3.4, 4, 3.6, SK, 0, -1, 0)); L.add(TAP(1.5, 4.6, SK, 0, -4, 0));
      L.add(B(2.8, 1, 3.4, DK, 0, -6.8, 0.4));
      for (let i = -1; i <= 1; i++) put(L, CO(0.3, 1, SPK, i * 0.9, -6.9, 2.2)).rotation.x = Math.PI / 2;
      legs.push(L);
    }
    // cola con púas y mazo en la punta
    const tail = [];
    let parentT = grp(0, 8.2, -7.6), r = 2.4;
    body.add(parentT);
    for (let i = 0; i < 5; i++) {
      const seg = grp(0, 0, i === 0 ? 0 : -2.8); parentT.add(seg);
      put(seg, part(G.taper, SK, r * 2, 3.1, r * 2, 0, 0, -1.3)).rotation.x = -Math.PI / 2;
      for (const sx of [-1, 1]) spike(seg, sx * r * 0.8, r * 0.5, -1.3, sx, 0.7, -0.2, 1.4 + r * 0.3, 0.26);
      seg.rotation.x = 0.1; tail.push(seg); parentT = seg; r *= 0.82;
    }
    const club = grp(0, 0, -3.4); parentT.add(club);
    club.add(ORG(2.6, 2.2, 3, DK));
    for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU; spike(club, Math.sin(a) * 1.1, Math.cos(a) * 1.0, 0, Math.sin(a), Math.cos(a), -0.3, 1.6, 0.3); }
    // la bola: enroscado, solo se ve el caparazón de púas
    const ball = grp(0, 7, 0); root.add(ball); ball.visible = false;
    ball.add(ORG(14, 14, 14, SK)); ball.add(ORG(12.6, 12.6, 12.6, DK, 0, 0.4, 0));
    for (let i = 0; i < 64; i++) {
      const y = 1 - (2 * (i + 0.5)) / 64, rr = Math.sqrt(1 - y * y), a = i * 2.39996;
      spike(ball, Math.cos(a) * rr * 6.6, y * 6.6, Math.sin(a) * rr * 6.6, Math.cos(a) * rr, y, Math.sin(a) * rr, 2.4, 0.42);
    }
    const model = { root, body, head, jaw, neck, legs, tail, ball };
    model.anim = (m, dt) => {
      const mv = m.moveAmt, w = m.walk, b = m.ball || 0;
      // enroscarse: el cuerpo se encoge y aparece la bola, que gira al rodar
      body.visible = b < 0.6; ball.visible = b >= 0.6;
      body.scale.set(1 - b * 0.3, 1 - b * 0.5, 1 - b * 0.45);
      if (ball.visible) { ball.scale.setScalar(0.8 + (b - 0.6) * 0.5); ball.rotation.x += ((m.rollSpeed || 0) / 7) * dt; }
      // paso de cuadrúpedo: las patas en diagonal se mueven juntas
      legs.forEach((L, i) => { L.rotation.x = Math.sin(w + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.45 * mv; });
      body.position.y = Math.abs(Math.sin(w)) * 0.35 * mv;
      for (let i = 0; i < tail.length; i++) tail[i].rotation.y = Math.sin(m.t * 1.8 - i * 0.6) * 0.12 + m.tailSwing * (i < 2 ? 0.4 : 0.2);
      jaw.rotation.x = Math.max(0, m.jaw) * 0.7;
      head.rotation.x = -Math.max(0, m.jaw) * 0.25 + m.headPitch;
      neck.rotation.y = clamp(m.headYaw, -0.6, 0.6);
      const a = m.action;
      if (a && a.kind === 'stomp') { const k = a.t / a.dur; body.rotation.x = -Math.sin(Math.min(1, k / 0.55) * Math.PI) * 0.25; }
      else if (a && a.kind === 'tail') body.rotation.y = Math.sin((a.t / a.dur) * Math.PI) * 1.3;
      else { body.rotation.y *= 0.9; if (m.state !== 'dying') body.rotation.x *= 0.9; }
    };
    return model;
  },
  // Lodora: inspirada en Hedorah. Un montón de lodo tóxico gris verdoso que brilla de mojado, con dos
  // ojos rojos verticales; para volar se aplana en un platillo
  lodora() {
    const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
    const SL = 0x3c4236, DK = 0x2a2e26, OL = 0x56604a, WET = { rough: 0.22, metal: 0.35 }, rng = mulberry32(19);
    body.add(ORG(17, 9, 15, SL, 0, 4.2, 0, WET));
    body.add(ORG(13, 13, 11, SL, 0, 11, -0.5, WET));
    body.add(ORG(10, 8, 9, OL, 0, 17.5, 0.6, WET));
    // grumos de lodo por todo el cuerpo
    for (let i = 0; i < 30; i++) {
      const a = rng() * TAU, y = 2 + rng() * 17, rad = y < 8 ? 7.5 : y < 15 ? 6 : 4.4, sz = 1.6 + rng() * 2.4;
      body.add(ORG(sz, sz * 0.8, sz, rng() < 0.5 ? DK : OL, Math.sin(a) * rad, y, Math.cos(a) * rad * 0.85, WET));
    }
    // brazos de lodo que cuelgan
    const arms = [];
    for (const sx of [-1, 1]) {
      const a = grp(sx * 6, 13, 2.6); a.rotation.z = sx * 0.45; body.add(a);
      a.add(TAP(1.7, 7, SL, 0, -3.5, 0, WET)); a.add(ORG(2.2, 2, 2.2, DK, 0, -7.2, 0, WET));
      arms.push(a);
    }
    // goterones
    for (let i = 0; i < 14; i++) { const a = (i / 14) * TAU; put(body, CO(0.5, 1.8, DK, Math.sin(a) * 6.2, 7.2, Math.cos(a) * 5.2, WET)).rotation.x = Math.PI; }
    // los ojos: rombos verticales rojos con borde amarillento y la pupila en raya
    const eyes = [];
    for (const sx of [-1, 1]) {
      const e = grp(sx * 1.9, 17.6, 4.7); e.rotation.z = sx * 0.12; body.add(e);
      e.add(part(G.oct, mat(0xf0e0a0, GLOW(0xffd060, 0.6)), 1.6, 4.4, 0.6, 0, 0, 0));
      e.add(part(G.oct, mat(0xff2a1a, GLOW(0xff1a0a, 2.2)), 1.05, 3.5, 0.7, 0, 0, 0.12));
      e.add(B(0.18, 2.6, 0.2, 0x1a0a08, 0, 0, 0.5));
      eyes.push(e);
    }
    const model = { root, body, eyes, arms };
    model.anim = (m, dt) => {
      // respira como un charco vivo; para volar se aplana en un platillo que gira
      const sc = m.saucer || 0, br = Math.sin(m.t * 1.6) * 0.03;
      body.scale.set(lerp(1, 1.55, sc) * (1 + br), lerp(1, 0.32, sc) * (1 - br), lerp(1, 1.55, sc) * (1 + br));
      body.rotation.y = sc > 0.05 ? body.rotation.y + dt * 0.8 * sc : body.rotation.y * 0.9;
      body.rotation.z = Math.sin(m.walk) * 0.05 * m.moveAmt;
      body.position.y = Math.abs(Math.sin(m.walk)) * 0.3 * m.moveAmt;
      arms.forEach((a, i) => { a.rotation.x = Math.sin(m.t * 1.2 + i * 2) * 0.2 - Math.max(0, m.jaw) * 0.5; });
    };
    return model;
  },
  pyraxis() {
    const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
    const RED = 0xb8321a, DK = 0x7a1e10, OR = 0xe8601f, Y = 0xffc040;
    // cuerpo aerodinámico con cresta de fuego

    body.add(ORG(3.2, 3, 4.2, OR, 0, -0.6, 2));
    body.add(ORG(2.6, 1.6, 6, DK, 0, 1.4, -0.6));

    put(head, part(G.cone4, 0xd8a040, 0.9, 3.6, 0.6, 0, -0.75, 2.4)).rotation.x = Math.PI / 2;
    put(head, CO(0.55, 4.8, Y, 0, 1.3, -2.1, GLOW(0xff9a00, 0.5))).rotation.x = -Math.PI * 0.62;
    for (const s of [-1, 1]) {
      put(head, CO(0.35, 2.8, OR, s * 0.6, 1.0, -1.4, GLOW(0xff7a00, 0.4))).rotation.set(-Math.PI * 0.6, 0, -s * 0.4);
      head.add(part(G.ico1, mat(0xffee80, GLOW(0xffcc00, 2)), 0.45, 0.4, 0.45, s * 0.85, 0.4, 0.8));

    // alas: hueso, membrana encendida y plumas de fuego en el borde

    const featherMat = new THREE.MeshStandardMaterial({ color: 0xff9a30, side: THREE.DoubleSide, flatShading: true, emissive: 0xff6a00, emissiveIntensity: 0.55 });
    const wings = [];
    for (const s of [-1, 1]) {
      const w = grp(s * 1.6, 0.9, 1); body.add(w);
      w.add(wingMesh([[0, -1.5], [4, -1.2], [9, -0.6], [9.4, 2.2], [6, 3.4], [3, 4.2], [0, 4.6]], 0, { material: wingMat }));
      put(w, part(G.taper, RED, 1.3, 9.6, 1.3, 4.7, 0.15, -0.4)).rotation.z = Math.PI / 2;
      // plumas planas en el borde de atrás, apuntando hacia atrás
      for (let i = 0; i < 4; i++) { const len = 3.6 - i * 0.3; put(w, part(G.cone4, featherMat, 1.5, len, 0.25, 1.5 + i * 2.2, 0, -3.6 - i * 0.2 - len / 2)).rotation.x = -Math.PI / 2; }
      const tip = grp(9, 0, 0);
      tip.add(wingMesh([[0, -0.6], [5, 0.4], [10, 1.6], [8.5, 3.4], [5, 4], [0, 3.2]], 0, { material: wingMat }));
      put(tip, part(G.taper, RED, 0.9, 9, 0.9, 4.5, 0.1, -0.2)).rotation.z = Math.PI / 2;
      // plumas largas de la punta, abiertas en abanico hacia afuera y atrás
      for (let i = 0; i < 6; i++) { const f = part(G.cone4, featherMat, 0.25, 6 - i * 0.55, 1.5, 8 + i * 0.25, 0, -1 - i * 0.5); f.rotation.set(0, 0.25 + i * 0.22, -Math.PI / 2); tip.add(f); }
      w.add(tip);
      w.scale.x = s;
      wings.push({ w, tip });
    }
    // cola larga con un abanico de plumas de fuego
    const tail = grp(0, 0, -3.6); body.add(tail);
    put(tail, part(G.taper, RED, 1.6, 6.5, 1.6, 0, 0, -3.2)).rotation.x = -Math.PI / 2;
    for (let i = -2; i <= 2; i++) { const f = part(G.cone4, featherMat, 1.4, 5 - Math.abs(i) * 0.6, 0.25, i * 0.6, 0, -8); f.rotation.order = 'YXZ'; f.rotation.set(-Math.PI / 2, i * 0.25, 0); tail.add(f); }
    // patas con garras (recogidas al volar)
    const legs = [];
    for (const s of [-1, 1]) {
      const L = grp(s * 1.4, -1.2, -0.5); body.add(L);
      L.add(TAP(0.5, 3, OR, 0, -1.4, 0));
      for (let i = -1; i <= 1; i++) put(L, CO(0.18, 1.1, 0x2a1a10, i * 0.35, -3.1, 0.4)).rotation.x = Math.PI * 0.6;
      legs.push(L);
    }
    const model = { root, body, head, wings, legs, tail, wingMat };
    model.anim = (m) => {
      const perched = m.alt < 3;
      const fl = perched ? 0 : Math.sin(m.t * (m.diving ? 7 : 4.2));
      for (let i = 0; i < 2; i++) {
        const { w, tip } = wings[i];
        w.rotation.z = perched ? -0.9 : fl * 0.55 + 0.05;
        w.rotation.y = perched ? 0.9 : 0;
        tip.rotation.z = perched ? -1.6 : fl * 0.4;

      body.rotation.x = perched ? -0.35 : -fl * 0.06 + (m.diving ? 0.35 : 0);
      for (const L of legs) L.rotation.x = perched ? 0 : 1.1;
      head.rotation.y = Math.sin(m.t * 0.7) * 0.3;
      tail.rotation.y = Math.sin(m.t * 1.6) * 0.2;

      featherMat.emissiveIntensity = 0.55 + m.glow * 1.4 + Math.sin(m.t * 11) * 0.1;

  krakor() {
    const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
    const SH = 0xb5371f, SH2 = 0x8e2814, UN = 0xe2b08a, DK = 0x5a1a10, BAR = 0x9a9a8a;
    const cb = grp(0, 6, 0); body.add(cb);
    // caparazón con crestas, espinas y percebes
    cb.add(ORG(16, 6.4, 13.5, SH, 0, 1.8, -1));
    cb.add(ORG(14.5, 3.4, 12, UN, 0, -0.7, -1));
    for (let i = -2; i <= 2; i++) put(cb, B(1.2, 1.0, 11 - Math.abs(i) * 1.6, SH2, i * 2.8, 4.6 - Math.abs(i) * 0.75, -1.5)).rotation.z = -i * 0.18;
    for (let i = -3; i <= 3; i++) put(cb, CO(0.45, 1.6, DK, i * 1.5, 3.2 - Math.abs(i) * 0.25, 5.6 - Math.abs(i) * 0.25)).rotation.x = 1.0;
    for (const s of [-1, 1]) for (let i = 0; i < 5; i++) put(cb, CO(0.5, 1.8, DK, s * (7.4 - Math.abs(i - 2) * 0.4), 1.6, 3 - i * 2.4)).rotation.z = -s * (Math.PI / 2 - 0.35);
    const rng = mulberry32(5);
    for (let i = 0; i < 12; i++) { const a = rng() * TAU, rr = rng() * 4; cb.add(ORG(0.9 + rng() * 0.8, 0.6, 0.9 + rng() * 0.8, BAR, Math.sin(a) * rr - 1, 4.6 - rr * 0.2, Math.cos(a) * rr - 3)); }
    for (const s of [-1, 1]) {
      put(cb, part(G.taper, UN, 0.6, 2.6, 0.6, s * 1.6, 3.7, 5.2)).rotation.x = 0.3;
      cb.add(part(G.ico1, mat(0x111111, { rough: 0.2, metal: 0.3 }), 0.95, 0.95, 0.95, s * 1.6, 5.0, 5.6));
      cb.add(part(G.ico1, mat(0xffd23d, GLOW(0xffb000, 1.8)), 0.4, 0.4, 0.4, s * 1.6, 5.15, 6.05));
    }
    for (let i = 0; i < 3; i++) cb.add(B(2.6 - i * 0.5, 0.5, 0.8, DK, 0, 0.9 - i * 0.55, 5.4));
    // pinzas puntiagudas: la derecha más grande
    const claws = [];
    for (const s of [-1, 1]) {
      const k = s > 0 ? 1.25 : 1;
      const arm = grp(s * 6, 0.6, 4.2); cb.add(arm);
      put(arm, part(G.taper, SH, 2 * k, 5.2, 2 * k, s * 1.6, 0, 1.6)).rotation.set(0.9, 0, s * 1.0);
      arm.add(ORG(1.8 * k, 1.8 * k, 1.8 * k, SH2, s * 3.0, 1.0, 3.4));
      const hand = grp(s * 3.2, 1.2, 4.6); arm.add(hand);
      hand.add(ORG(3.2 * k, 2.5 * k, 4.6 * k, SH, 0, 0, 0.8));
      for (let i = 0; i < 2; i++) put(hand, CO(0.3, 1.2, DK, (i - 0.5) * 1.2, 1.2 * k, 0.4 + i)).rotation.x = -0.4;
      put(hand, part(G.cone4, DK, 1.1 * k, 4.6 * k, 1.2 * k, s * 0.5, -0.4, 3.6 * k + 0.6)).rotation.x = Math.PI / 2;
      const fing = grp(-s * 0.4, 0.6, 2.4); hand.add(fing);
      put(fing, part(G.cone4, SH2, 1.0 * k, 4.2 * k, 1.0 * k, 0, 0, 2.1 * k)).rotation.x = Math.PI / 2;
      for (let i = 0; i < 3; i++) put(fing, CO(0.12, 0.45, 0xf0e0c0, s * 0.35, -0.35, 0.8 + i * 0.9)).rotation.z = Math.PI;
      claws.push({ arm, hand, fing });
    }
    // cuatro pares de patas articuladas y puntiagudas
    const legs = [];
    for (const s of [-1, 1]) for (const z of [2.6, -0.4, -3.4, -6]) {
      const L = grp(s * 6.6, 5.6, z); body.add(L);
      const up = grp(0, 0, 0); L.add(up); up.rotation.z = s * -1.2;
      up.add(part(G.taper, SH, 1.5, 6.2, 1.5, 0, 3.0, 0));
      up.add(ORG(1.3, 1.3, 1.3, SH2, 0, 6.2, 0));
      put(up, CO(0.3, 1.0, DK, 0.5 * s, 4, 0)).rotation.z = -s * 0.6;
      const low = grp(0, 6.2, 0); up.add(low); low.rotation.z = s * -1.63;
      low.add(part(G.taper, SH, 1.2, 7.2, 1.2, 0, 3.4, 0));
      low.add(part(G.cone4, DK, 0.9, 1.8, 0.9, 0, 7.7, 0));
      legs.push({ L, up, s, z });
    }
    const model = { root, body, cb, claws, legs };
    model.anim = (m) => {
      const mv = m.moveAmt;
      legs.forEach((lg, i) => {
        const ph = m.walk * 1.4 + (i % 4) * 1.6 + (lg.s > 0 ? Math.PI : 0);
        lg.L.rotation.y = Math.sin(ph) * 0.3 * mv;
        lg.up.rotation.x = Math.max(0, Math.cos(ph)) * 0.25 * mv;
      });
      cb.position.y = 6 + Math.sin(m.walk * 2.8) * 0.25 * mv - (m.submerge || 0) * 14;
      const a = m.action;
      for (let i = 0; i < 2; i++) {
        const c = claws[i];
        c.fing.rotation.y = (i ? -1 : 1) * (0.15 + Math.abs(Math.sin(m.t * 1.5 + i)) * 0.35);
        let raise = 0;
        if (a && a.kind === 'stomp') raise = Math.sin(Math.min(1, a.t / a.dur / 0.55) * Math.PI) * (i === (a.side || 0) ? 1 : 0.3);
        c.arm.rotation.x = -raise * 0.9;
      }
      cb.rotation.y = Math.sin(m.t * 0.6) * 0.04;
    };
    return model;
  },
  medugora() {
    // medusa gigante: campana translúcida, núcleo de células que brillan, brazos con volantes y tentáculos largos

    const UPV = new THREE.Vector3(0, 1, 0), FW = new THREE.Vector3(0, 0, 1), C = new THREE.Vector3(), T = new THREE.Vector3();
    const H = [0, 1, 2].map(() => new THREE.Vector3()), pts = Array.from({ length: NSEG + 1 }, () => new THREE.Vector3());

      portals.forEach((pg, i) => pg.scale.setScalar((pg.userData.big || 1) * (1 + Math.sin(t * 2 + i) * 0.05)));

const BRIDGES = [-44, 0, 44];

function buildMap(levelId) {

  M.coastZ = (x) => -74 + 3 * Math.sin(x * 0.045) + 2 * Math.sin(x * 0.11 + 1.3);

  road(0, 30, 150, 8);

    const lowRise = mon && mon.type === 'dome';
    const pr = rng();
    let lots;

    else if (pr < 0.55) lots = rng() < 0.5 ? [[0, -3.6, 14, 6.6], [0, 3.6, 14, 6.6]] : [[-3.6, 0, 6.6, 14], [3.6, 0, 6.6, 14]];
    else lots = [[-3.6, -3.6, 6.6, 6.6], [3.6, -3.6, 6.6, 6.6], [-3.6, 3.6, 6.6, 6.6], [3.6, 3.6, 6.6, 6.6]];
    for (const [ox, oz, lw, ld] of lots) {

      if (lowRise) h = Math.min(h, 7.5);
      const color = cfg.pal[Math.floor(rng() * cfg.pal.length)];
      const meshG = cityBuildingMesh(cfg.style, w, d, h, color, cfg.roof, lights, rng);
      const cb = new CityBld(M, district, cx + ox, cz + oz, w, d, h, 260 + h * 34 + w * d * 2, meshG, { color });
      const sm = meshG.userData.smoke;
      if (sm && M.smokers.length < 16) M.smokers.push({ b: cb, x: cx + ox + sm[0], y: sm[1], z: cz + oz + sm[2] });

function updateWater(M, t) {
  const W = M && M.wave;
  if (!W) return;
  const p = W.geo.attributes.position, b = W.base;
  const amp = W.small ? 0.08 : 0.35;
  for (let i = 0; i < p.count; i++) {
    const x = b[i * 3], z = b[i * 3 + 2];
    p.array[i * 3 + 1] = b[i * 3 + 1] + Math.sin(x * 0.09 + t * 1.3) * amp + Math.cos(z * 0.13 + t * 0.9) * amp * 0.8;
  }
  p.needsUpdate = true;
}

// ---------------------------------------------------------------------
//  Entidades: edificios de la ciudad, edificios y unidades del jugador,
//  larvas, proyectiles, zonas de peligro e incendios
// ---------------------------------------------------------------------
let S = null;   // estado de la partida en curso
let uid = 0;

function later(delay, fn) { S.later.push({ t: delay, fn }); }

// ---------- barras de vida y anillos de selección ----------
const HPB = { bg: basic(0x000000, { opacity: 0.6 }), green: basic(0x5dff7a), yellow: basic(0xffd34d), red: basic(0xff4d3d) };
function makeHpBar(w) {
  const g = new THREE.Group();
  const bg = new THREE.Mesh(G.hpBar, HPB.bg); bg.scale.set(w + 0.24, 0.46, 1); bg.position.x = -(w + 0.24) / 2;
  const fg = new THREE.Mesh(G.hpBar, HPB.green); fg.scale.set(w, 0.28, 1); fg.position.set(-w / 2, 0, 0.02);
  bg.renderOrder = 8; fg.renderOrder = 9;
  g.add(bg, fg); g.userData = { fg, w }; g.visible = false;
  world.add(g);
  return g;
}
function setHpBar(bar, frac, x, y, z, show) {
  bar.visible = show;
  if (!show) return;
  bar.position.set(x, y, z);
  bar.quaternion.copy(camera.quaternion);
  const fg = bar.userData.fg;
  fg.scale.x = Math.max(0.001, bar.userData.w * clamp(frac, 0, 1));
  fg.material = frac > 0.6 ? HPB.green : frac > 0.3 ? HPB.yellow : HPB.red;
}
function makeRing(r, color = 0x8dff9f) {
  const m = new THREE.Mesh(G.ring, basic(color, { opacity: 0.9 }));
  m.scale.setScalar(r); m.visible = false; m.position.y = 0.2; m.renderOrder = 2;

function removeObj(o) { if (!o) return; world.remove(o); disposeTree(o); }

// ---------- edificios de la ciudad ----------
class CityBld {
  constructor(M, district, x, z, w, d, h, hp, g, o = {}) {
    this.id = ++uid; this.kind = 'city';
    this.x = x; this.z = z; this.w = w; this.d = d; this.h = h; this.r = Math.max(w, d) / 2;
    this.maxHp = this.hp = hp;
    this.mesh = g; g.position.set(x, 0, z); world.add(g);
    this.monument = !!o.monument; this.dome = !!o.dome; this.name = o.name || '';
    this.worth = o.worth ?? 1; this.tax = o.tax ?? 2 + h / 8;
    this.color = o.color ?? 0xb0aca0;
    this.district = district; this.dead = false; this.fire = null; this.smokeT = 0;
    if (o.nav !== false) Nav.setRect(x, z, w, d, NAV_CITY);
    M.city.push(this); district.blds.push(this);
    if (this.monument) district.monument = this;
  }
  aimAt() { return { x: this.x, y: this.h * 0.5, z: this.z }; }
  damage(n) {
    if (this.dead || !S || S.ended && S.result?.win) return;
    this.hp -= n;
    if (this.hp <= 0) this.collapse();
  }
  collapse(silent) {
    if (this.dead) return;
    this.dead = true;
    S.aliveWorth -= this.worth; S.mmDirty = true;
    if (this.monument) Music.sting('monument');
    if (this.dome) {
      flash(0.25, '#bff');
      chunks(this.x, 8, this.z, 40, 0x9fe0ff, { spread: 10, h: 6, size: 1.2, out: 9, up: 10 });
      msg(`¡${this.name} se rompió! Ese barrio se queda sin aire.`, 'danger');
      S.monumentsLost++;
      (this.covers || []).forEach((b, i) => later(0.3 + i * 0.35, () => b.collapse(true)));
      removeObj(this.mesh);
      return;
    }
    const n = clamp(Math.round((this.w * this.d * this.h) / 55), 8, 70);
    chunks(this.x, this.h * 0.5, this.z, n, this.color, { spread: this.r * 0.85, h: this.h * 0.6, size: clamp(this.h / 9, 0.8, 2.4), out: 7, up: 8 });
    smoke(this.x, 2, this.z, 9, this.r * 1.4, 0x8a8478, 3.5);
    if (!silent) SFX.collapse(this);
    S.sinking.push({ m: this.mesh, t: 0, h: this.h + 4, b: this });
    Nav.setRect(this.x, this.z, this.w, this.d, NAV_FREE, NAV_CITY);
    // «la Torre», «la Pagoda», «la Catedral»...: destruida
    if (this.monument) { S.monumentsLost++; msg(`¡${this.name} ha sido destruid${/^(Torre|Pagoda|Estatua|Catedral)\b/.test(this.name) ? 'a' : 'o'}!`, 'danger'); }
    if (this.fire) this.fire = null;
  }
}

// ---------- edificios del jugador ----------
class PBld {
  constructor(type, x, z, built) {
    const d = (this.def = BUILDINGS[type]);
    this.type = type; this.id = ++uid; this.kind = 'bld';
    this.x = x; this.z = z; this.w = d.size[0]; this.d = d.size[1]; this.r = Math.max(this.w, this.d) / 2; this.h = 5;
    this.maxHp = d.hp; this.hp = built ? d.hp : d.hp * 0.15;
    this.done = !!built; this.progress = built ? 1 : 0;
    this.mesh = mergeStatic(BModels[type]()); this.mesh.position.set(x, 0, z); world.add(this.mesh);
    if (!built) {
      this.mesh.scale.y = 0.05;
      this.scaffold = new THREE.Mesh(G.box, new THREE.MeshBasicMaterial({ color: 0xffd34d, wireframe: true, transparent: true, opacity: 0.6 }));
      this.scaffold.scale.set(this.w, 5, this.d); this.scaffold.position.set(x, 2.5, z); world.add(this.scaffold);
    }
    this.queue = []; this.rally = null; this.cool = 0; this.target = null; this.retarget = 0; this.smokeT = 0;
    this.worth = d.worth; this.dead = false; this.fire = null;
    this.ring = makeRing(this.r + 1.2); this.bar = makeHpBar(Math.min(8, this.w * 0.8));
    Nav.setRect(x, z, this.w, this.d, NAV_BASE);
    S.blds.push(this);
  }
  aimAt() { return { x: this.x, y: 3, z: this.z }; }
  exitPoint() { return { x: this.x + rand(-1.5, 1.5), z: this.z + this.d / 2 + 2.6 }; }
  update(dt) {
    if (!this.done) {
      this.progress += dt / (this.def.time * S.mods.build);
      this.hp = Math.min(this.maxHp, this.hp + (this.maxHp * 0.85 * dt) / (this.def.time * S.mods.build));
      this.mesh.scale.y = 0.05 + 0.95 * easeOut(clamp(this.progress, 0, 1));
      if (Math.random() < dt * 4) puff(this.x + rand(-this.w, this.w) * 0.4, 1, this.z + rand(-this.d, this.d) * 0.4, { size: 1.5, grow: 2, color: 0xb8ae98, life: 1 });
      if (this.progress >= 1) this.finish();
      return;
    }
    // producción
    if (this.queue.length) {
      const q = this.queue[0], ud = UNITS[q.type];
      q.t += dt / (ud.time * S.mods.build);
      if (this.mesh.userData.chimney) {
        this.smokeT -= dt;
        if (this.smokeT <= 0) { this.smokeT = 0.35; const c = this.mesh.userData.chimney; puff(this.x + c.x, c.y, this.z + c.z, { size: 1.6, grow: 4, color: 0x5a5a5a, vy: 3, life: 2.4 }); }
      }
      if (q.t >= 1) this.spawnUnit(q.type);
    }
    // torreta
    const tdef = this.def.turret;
    if (tdef) {
      this.cool -= dt; this.retarget -= dt;
      if (this.retarget <= 0) {
        this.retarget = 0.4;
        this.target = nearestEnemy(this.x, this.z, tdef.range, () => true);
      }
      const t = this.target;
      if (t && (t.dead || !t.targetable() || enemyDist(this.x, this.z, t) > tdef.range)) this.target = null;
      if (this.target) {
        const a = this.target.aimAt();
        const tr = this.mesh.userData.turret;

        if (k.t < 2.2 && m && !m.dead) {
          this.x = lerp(this.x, m.x, Math.min(1, dt * 3)); this.z = lerp(this.z, m.z, Math.min(1, dt * 3));
          this.alt = Math.min(16, this.alt + dt * 9);
          if (Math.random() < dt * 8) puff(this.x, this.alt + 2, this.z, { size: 2, grow: 3, life: 0.8, color: 0x9a9080, vy: -2 });
        } else { k.kind = 'fall'; k.vy = 0; }
        break;
      case 'fall':
        k.vy += 30 * dt; this.alt -= k.vy * dt;
        if (this.alt <= 0) this.crash(0.14);
        break;
      case 'tk': {
        // telequinesis: lo levanta, lo sacude (lo estrangula) y lo estrella contra el suelo
        if (k.t < 1.2) this.alt = Math.min(14, this.alt + dt * 12);
        else if (k.t < 2.8) {
          this.alt = 14 + Math.sin(k.t * 30) * 0.5;
          this.damage(this.maxHp * 0.04 * dt * (m ? m.dmgMul : 1));
        } else { k.kind = 'fall'; k.vy = 22; }
        if (Math.random() < dt * 12) puff(this.x + rand(-2, 2), this.alt + rand(0, 4), this.z + rand(-2, 2), { add: true, size: 1.2, grow: 1, life: 0.4, color: 0xb08aff, vy: 1 });
        break;
      }
      case 'pinch':
      case 'web':
        if (k.kind === 'pinch') {
          this.damage(this.maxHp * 0.025 * dt * (m ? m.dmgMul : 1));
          if (Math.random() < dt * 10) puff(this.x + rand(-2, 2), rand(5, 12), this.z + rand(-2, 2), { add: true, size: 0.8, grow: 1, life: 0.2, color: 0xffd080, vx: rand(-6, 6), vy: rand(2, 6), vz: rand(-6, 6) });
        } else if (Math.random() < dt * 6) puff(this.x + rand(-2, 2), rand(3, 14), this.z + rand(-2, 2), { size: 2.5, grow: 1, life: 1.2, color: 0xf2f0e8, vy: 0, a: 0.7 });
        if (k.t > (k.kind === 'web' ? 4 : 3.5)) this.ko = null;
        break;
      case 'down':
        if (k.t > 2.4) this.ko = null;
        break;
      case 'stun':
        // aturdido por el graznido: no se mueve ni dispara
        if (Math.random() < dt * 5) puff(this.x + rand(-1, 1), this.alt + (this.def.mech ? 16 : 3), this.z + rand(-1, 1), { add: true, size: 0.8, grow: 0.5, life: 0.5, color: 0xffe08a, vx: 0, vy: 1, vz: 0 });
        if (k.t > (k.dur || 3)) this.ko = null;
        break;
    }
  },
  crash(frac) {
    this.alt = 0;
    const m = S.monster;
    this.damage(this.maxHp * frac * (m ? m.dmgMul : 1));
    Cam.shake(1.3, this.x, this.z); SFX.stomp(this); SFX.collapse(this);
    ring(this.x, this.z, 2, 18, 0xd8c8a8, 0.9); smoke(this.x, 1, this.z, 10, 7, 0x9a8a70, 2.2);
    // un robot que cae encima de un edificio lo aplasta; las tropas que vuelan por una onda o una bola no
    if (!(this.ko && this.ko.soft)) areaDamage(this.x, this.z, 6, 0, 450);
    this.toFreeSpot();
    if (!this.dead) this.ko = { kind: 'down', t: 0 };
  },
  // si cayó encima de un edificio o fuera del mapa, se pone en el suelo libre más cercano
  toFreeSpot() {
    this.x = clamp(this.x, -MAP_HALF + 6, MAP_HALF - 6); this.z = clamp(this.z, -MAP_HALF + 6, MAP_HALF - 6);
    if (!Nav.walk(this.x, this.z)) { const f = Nav.nearestFree(Nav.cell(this.x), Nav.cell(this.z), 20); if (f) { this.x = Nav.center(f[0]); this.z = Nav.center(f[1]); } }
  }
});
// Enemigos pequeños: larvas y células que van por tu base, y torres de cristal de SpaceGorzak
// ---------- larvas de Noctra ----------
class Larva {
  constructor(x, y, z, cell = false) {
    this.id = ++uid; this.kind = 'larva'; this.cell = cell;
    this.x = x; this.z = z; this.y = y; this.vy = 0; this.rot = rand(TAU);
    this.maxHp = this.hp = 90 * S.diff.mHp; this.r = 1.3; this.speed = 5.2 * S.diff.mSpd;
    this.target = null; this.retarget = 0; this.cool = 0; this.dead = false; this.t = rand(5);
    const g = new THREE.Group();
    if (cell) {
      // célula de Medúgora: una medusita translúcida con un núcleo que brilla
      g.add(part(G.sph, mat(0x9fe6ff, { opacity: 0.6, emissive: 0x2a7aa0, ei: 0.9 }), 2.0, 1.3, 2.0, 0, 1.4, 0));
      g.add(part(G.ico1, mat(0xff7ae0, GLOW(0xff4ad0, 1.8)), 0.7, 0.7, 0.7, 0, 1.4, 0));
      for (let i = 0; i < 4; i++) { const a = (i * TAU) / 4; g.add(CY(0.07, 1.1, 0xbfe8ff, Math.sin(a) * 0.6, 0.5, Math.cos(a) * 0.6)); }
    } else {
      for (let i = 0; i < 4; i++) g.add(SP(1.5 - i * 0.2, 1.1 - i * 0.12, 1.2, i % 2 ? 0xcfe8b0 : 0xb8d898, 0, 0.6, 0.9 - i * 0.9, GLOW(0x6aff8a, 0.25)));
      g.add(SP(0.3, 0.3, 0.3, 0x111111, 0.4, 0.9, 1.5)); g.add(SP(0.3, 0.3, 0.3, 0x111111, -0.4, 0.9, 1.5));
    }
    noShadow(g);
    this.mesh = g; world.add(g);
    S.larvae.push(this);
  }
  isAir() { return false; }
  targetable() { return !this.dead && this.y < 1.5; }
  aimAt() { return { x: this.x, y: this.y + 0.8, z: this.z }; }
  takeDamage(n) {
    if (this.dead) return;
    this.hp -= n;
    if (this.hp <= 0) {
      this.dead = true;
      for (let i = 0; i < 5; i++) puff(this.x, 0.8, this.z, { size: 1, grow: 1.5, life: 0.6, color: this.cell ? 0x9fe6ff : 0x9aff6a, vx: rand(-3, 3), vy: rand(1, 4), vz: rand(-3, 3) });
      SFX.splat(this);
      removeObj(this.mesh);
    }
  }
  update(dt) {
    if (this.dead) return;
    this.t += dt;
    if (this.y > 0) {
      this.vy -= 25 * dt; this.y += this.vy * dt;
      if (this.y <= 0) { this.y = 0; puff(this.x, 0.5, this.z, { size: 2, grow: 2, color: 0x8a8070, life: 0.8 }); }
    } else {
      this.retarget -= dt;
      if (this.retarget <= 0) {
        this.retarget = 1;
        let best = null, bd = 1e9;
        for (const u of S.units) { if (u.dead || u.flying) continue; const d = dist(u.x, u.z, this.x, this.z) - (u.def.harvester ? 40 : 0); if (d < 24 && d < bd) { bd = d; best = u; } }
        if (!best) for (const b of S.blds) { const d = dist(b.x, b.z, this.x, this.z) - (b.type === 'refineria' ? 50 : 0); if (d < bd) { bd = d; best = b; } }
        this.target = best;
      }
      const t = this.target;
      if (t && !t.dead) {
        const d = dist(t.x, t.z, this.x, this.z) - (t.r || 1);
        const want = Math.atan2(t.x - this.x, t.z - this.z);
        this.rot = turnTo(this.rot, want, dt * 4);
        if (d > 1.6) {
          const nx = this.x + Math.sin(this.rot) * this.speed * dt, nz = this.z + Math.cos(this.rot) * this.speed * dt;
          if (Nav.at(nx, nz) !== NAV_WATER) { this.x = nx; this.z = nz; }
        } else {
          this.cool -= dt;
          if (this.cool <= 0) { this.cool = 0.8; t.damage(10 * S.diff.mDmg); puff(this.x, 1, this.z, { size: 0.8, grow: 1, life: 0.4, color: 0xcfffb0 }); }
        }
      }
    }
    this.mesh.position.set(this.x, this.y, this.z);
    this.mesh.rotation.y = this.rot;
    if (this.cell) this.mesh.children[0].scale.y = 1.3 * (1 + Math.sin(this.t * 6) * 0.12);
    else this.mesh.children.forEach((c, i) => { if (i < 4) c.position.y = 0.6 + Math.sin(this.t * 9 - i) * 0.12; });
  }
}

  targetable() { return !this.dead && this.grow > 0.3; }
  aimAt() { return { x: this.x, y: 2, z: this.z }; }
  takeDamage(n) { if (this.dead) return; this.hp -= n; if (this.hp <= 0) this.die(); }
  die() {
    if (this.dead) return;
    this.dead = true;
    for (let i = 0; i < 8; i++) puff(this.x, 1.5, this.z, { size: 1.6, grow: 2, life: 0.8, color: pick([0x4a7a36, 0x9aff6a, 0xb8202a]), vx: rand(-4, 4), vy: rand(1, 5), vz: rand(-4, 4) });

    this.mesh.scale.setScalar(0.1 + 0.9 * this.grow); this.mesh.rotation.y = Math.sin(this.t * 0.8) * 0.2;
    if (this.grow < 1) return;
    this.cool -= dt;
    if (this.cool <= 0) {
      this.cool = 1.2;
      let best = null, bd = 14;
      for (const u of S.units) { if (u.dead || u.alt > 6) continue; const d = dist(u.x, u.z, this.x, this.z); if (d < bd) { bd = d; best = u; } }
      if (best) { beam({ x: this.x, y: 3, z: this.z }, best.aimAt(), 0x4a7a36, 0.25, 0.25, 0x8ad860); best.damage(40 * S.diff.mDmg, this.m); }
