    const m = S.monster;
    if (m && m.targetable()) { const a = m.aimAt(), h = m.h || 20; for (let i = -2; i <= 2; i++) test(m, a.x, a.y + (i / 2) * h * 0.45, a.z, (m.r || 6) + 1.5); }
    for (const l of S.larvae) if (l.targetable()) { const a = l.aimAt(); test(l, a.x, a.y, a.z, (l.r || 2) + 1.2); }
    return best;
  },
  shoot(u, missile) {
    const F = u.def.fpv, o = camera.position, d = this.dir(), t = this.aim(F.range);
    this.side = -this.side;
    const from = { x: o.x + Math.cos(this.yaw) * 0.6 * this.side + d.x * 1.5, y: o.y - 0.6 + d.y * 1.5, z: o.z - Math.sin(this.yaw) * 0.6 * this.side + d.z * 1.5 };
    const far = { x: o.x + d.x * F.range, y: o.y + d.y * F.range, z: o.z + d.z * F.range };
    if (missile) {
      this.mslCd = F.missile.cd;
      spawnProj('missile', from, t || far, t ? F.missile.dmg * S.mods.dmg : 0, u, { splash: F.missile.splash });

      SFX.shot(u);
    }
  },
  update(dt) {
    const u = this.u;
    if (u.dead) return this.exit('💥 ¡Derribaron tu dron!');
    if (S.ended || !S.units.includes(u)) return this.exit();
    const k = this.keys;
    if (k.has('ArrowLeft')) this.look(-dt * 500, 0); if (k.has('ArrowRight')) this.look(dt * 500, 0);
    if (k.has('ArrowUp')) this.look(0, -dt * 400); if (k.has('ArrowDown')) this.look(0, dt * 400);
    const d = this.dir(), sh = Cam.shakeA * 0.3;
    camera.position.set(u.x + rand(-sh, sh), u.alt + 0.4 + rand(-sh, sh), u.z + rand(-sh, sh));
    camera.up.set(Math.sin(this.roll) * Math.cos(this.yaw), Math.cos(this.roll), -Math.sin(this.roll) * Math.sin(this.yaw));
    camera.lookAt(camera.position.x + d.x, camera.position.y + d.y, camera.position.z + d.z);
    camera.up.set(0, 1, 0);
    Cam.x = u.x; Cam.z = u.z; Cam.shakeA = Math.max(0, Cam.shakeA - dt * 2.5);
    AudioSys.listener.x = u.x; AudioSys.listener.z = u.z;
    // HUD: vida, misil y lo que hay en la mira
    const h = this.hud;
    if (!h) return;
    h.querySelector('.fill').style.width = (u.hp / u.maxHp) * 100 + '%';
    h.querySelector('.fpv-msl').textContent = this.mslCd > 0 ? `🚀 misil en ${Math.ceil(this.mslCd)} s` : '🚀 misil LISTO';
    const t = this.aim(u.def.fpv.range);
    h.classList.toggle('lock', !!t);
    h.querySelector('.fpv-tgt').textContent = t ? (t.kind === 'monster' ? t.cfg.name : 'LARVA') + ' · ' + Math.round(dist(u.x, u.z, t.x, t.z)) + ' m' : '';
  },
  key(e, down) {
    const c = e.code;
    if (!down) { this.keys.delete(c); return; }
    if (c === 'Escape') { e.preventDefault(); return this.exit(); }
    if (c === 'KeyV') return this.exit();
    if (c === 'KeyF') { this.wantMissile = true; return; }
    if (c === 'KeyN') return toggleMute();
    if (c === 'KeyP') return toggleTacticalPause();

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function groundAt(sx, sy) {
  ndc.set((sx / window.innerWidth) * 2 - 1, -(sy / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  return ray.ray.intersectPlane(groundPlane, hitV) ? { x: hitV.x, z: hitV.z } : null;
}
function toScreen(x, y, z) {
  _v2.set(x, y, z).project(camera);
  return { x: ((_v2.x + 1) / 2) * window.innerWidth, y: ((1 - _v2.y) / 2) * window.innerHeight, z: _v2.z };
}
function pxRadius(r, x, y, z) {
  const d = camera.position.distanceTo(_v1.set(x, y, z));
  return (r / (d * Math.tan((camera.fov * Math.PI) / 360))) * (window.innerHeight / 2);
}
function onScreen(u) { const s = toScreen(u.x, u.alt + 1, u.z); return s.z < 1 && s.x > 0 && s.y > 0 && s.x < window.innerWidth && s.y < window.innerHeight; }

const Input = { down: null, drag: false, lastClick: 0, lastUnit: null, lastGroup: null, lastGroupT: 0 };

function pickAt(sx, sy) {
  const g = groundAt(sx, sy);
  let best = null, bd = 1e9;
  for (const u of S.units) {
    const s = toScreen(u.x, u.alt + (u.def.mech ? 8 : 1), u.z);
    if (s.z > 1) continue;
    const d = Math.hypot(s.x - sx, s.y - sy), rad = Math.max(16, pxRadius(u.r * 1.2, u.x, u.alt, u.z));
    if (d < rad && d < bd) { bd = d; best = u; }
  }
  if (best) return { unit: best, g };
  for (const l of S.larvae) {
    if (!l.targetable()) continue;
    const s = toScreen(l.x, 0.8, l.z), d = Math.hypot(s.x - sx, s.y - sy);
    if (s.z < 1 && d < 18 && d < bd) { bd = d; best = l; }
  }
  if (best) return { enemy: best, g };
  const m = S.monster;
  if (m && m.state === 'active' && m.submerge < 0.5) {
    for (const f of [0.15, 0.45, 0.75]) {
      const y = m.alt > 3 ? m.alt : m.h * f, s = toScreen(m.x, y, m.z);
      if (s.z < 1 && Math.hypot(s.x - sx, s.y - sy) < Math.max(30, pxRadius(m.r * 1.1, m.x, y, m.z))) return { enemy: m, g };
    }
  }
  if (g) {
    for (const b of S.blds) if (Math.abs(g.x - b.x) < b.w / 2 + 0.5 && Math.abs(g.z - b.z) < b.d / 2 + 0.5) return { bld: b, g };
    for (const b of S.blds) { const s = toScreen(b.x, 3, b.z); if (s.z < 1 && Math.hypot(s.x - sx, s.y - sy) < pxRadius(b.r, b.x, 3, b.z)) return { bld: b, g }; }
    for (const f of S.map.mines) if (dist(g.x, g.z, f.x, f.z) < f.r + 2) return { field: f, g };

}
function leftClick(sx, sy, add) {

    if (now - Input.lastClick < 350 && Input.lastUnit && Input.lastUnit.type === p.unit.type) selectUnits(S.units.filter((u) => u.type === p.unit.type && onScreen(u)), add);
    else if (add && S.sel.includes(p.unit)) { S.sel.splice(S.sel.indexOf(p.unit), 1); UI.selDirty = true; }
    else selectUnits([p.unit], add);
    Input.lastClick = now; Input.lastUnit = p.unit;

  }

}
function boxSelect(x0, y0, x1, y1, add) {
  const ax = Math.min(x0, x1), bx = Math.max(x0, x1), ay = Math.min(y0, y1), by = Math.max(y0, y1);
  const list = S.units.filter((u) => { const s = toScreen(u.x, u.alt + 1, u.z); return s.z < 1 && s.x >= ax && s.x <= bx && s.y >= ay && s.y <= by; });

function rightClick(sx, sy) {

const PAN_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
window.addEventListener('keydown', (e) => {
  audioInit();
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  if (appMode !== 'game' || !S) { if (e.code === 'Escape') UI.escape(); return; }
  if (Cine.cur) {
    if (e.code === 'Enter' || e.code === 'Escape' || e.code === 'Space') { e.preventDefault(); Cine.skip(); }
    return;
  }
  if (S.menuPaused || UI.resultsOpen) { if (e.code === 'Escape' && S.menuPaused) UI.togglePause(); return; }
  if (FPV.u) return FPV.key(e, true);
  const code = e.code;
  if (code === 'KeyV') { const d = S.sel.find((u) => !u.dead && u.def.fpv); if (d) FPV.enter(d); return; }
  if (PAN_KEYS.includes(code)) { Cam.keys.add(code); e.preventDefault(); return; }
  if (code === 'Space') { e.preventDefault(); toggleTacticalPause(); return; }
  if (code === 'Escape') {
    if (S.placing) cancelPlacing();
    else if (S.sel.length || S.selBld || S.selEnemy) clearSel();
    else UI.togglePause();
    return;
  }
  if (code === 'KeyN') return toggleMute();
  if (code === 'KeyM' && S.sandbox) return UI.toggleSandbox();
  if (code === 'KeyH') { const hq = S.blds.find((b) => b.type === 'hq'); if (hq) Cam.center(hq.x, hq.z - 12); return; }
  if (code === 'KeyF') { const m = S.monster; if (m && m.state === 'active') Cam.center(m.x, m.z + 22); return; }
  const dm = code.match(/^Digit([0-9])$/);
  if (dm) {
    const n = dm[1];
    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      e.preventDefault();
      S.groups[n] = S.sel.slice();
      msg(`Grupo ${n} guardado (${S.sel.length} unidades).`, '');
    } else {
      const g = (S.groups[n] || []).filter((u) => !u.dead);
      if (!g.length) return;
      const now = performance.now();
      if (Input.lastGroup === n && now - Input.lastGroupT < 400) {
        const cx = g.reduce((a, u) => a + u.x, 0) / g.length, cz = g.reduce((a, u) => a + u.z, 0) / g.length;
        Cam.center(cx, cz + 10);
      }
      selectUnits(g);
      Input.lastGroup = n; Input.lastGroupT = now;
    }
  }
});
window.addEventListener('keyup', (e) => { Cam.keys.delete(e.code); FPV.keys.delete(e.code); });
window.addEventListener('blur', () => { Cam.keys.clear(); FPV.keys.clear(); FPV.firing = false; });

  // ---------- minimapa ----------
  drawMinimap() {
    const ns = $('#nosignal');
    ns.style.display = S.radar ? 'none' : 'flex';
    if (!S.radar) return;
    const c = $('#minimap'), g = c.getContext('2d'), W = 200, k = W / (MAP_HALF * 2);
    const X = (x) => (x + MAP_HALF) * k;
    if (!this.mmBg) {
      const bg = document.createElement('canvas'); bg.width = bg.height = W;
      const bgc = bg.getContext('2d');
      const cfg = S.map.cfg;
      bgc.fillStyle = '#' + new THREE.Color(cfg.ground).getHexString(); bgc.fillRect(0, 0, W, W);
      const cs = W / GRID;
      for (let cz = 0; cz < GRID; cz++) for (let cx = 0; cx < GRID; cx++) {
        const v = Nav.g[cz * GRID + cx], x = Nav.center(cx), z = Nav.center(cz);
        if (S.map.isWater(x, z)) bgc.fillStyle = '#' + new THREE.Color(cfg.waterCol).getHexString();
        else if (v === NAV_ROCK) bgc.fillStyle = 'rgba(90,80,60,.9)';
        else if (x > CITY_RECT.x0 && x < CITY_RECT.x1 && z > CITY_RECT.z0 && z < CITY_RECT.z1) bgc.fillStyle = '#3a3c40';
        else continue;
        bgc.fillRect(cx * cs, cz * cs, cs + 0.5, cs + 0.5);
      }
      for (const f of S.map.mines) { bgc.fillStyle = '#7dff3a'; bgc.beginPath(); bgc.arc(X(f.x), X(f.z), 4, 0, TAU); bgc.fill(); }
      this.mmBg = bg;
    }
    g.drawImage(this.mmBg, 0, 0);
    for (const b of S.map.city) {
      if (b.dome && !b.dead) { g.strokeStyle = 'rgba(160,230,255,.8)'; g.strokeRect(X(b.x - b.w / 2), X(b.z - b.d / 2), b.w * k, b.d * k); continue; }
      g.fillStyle = b.dead ? '#222' : b.monument ? '#ffd34d' : '#9a9a96';
      g.fillRect(X(b.x - b.w / 2), X(b.z - b.d / 2), Math.max(1.5, b.w * k), Math.max(1.5, b.d * k));
    }
    for (const b of S.blds) { g.fillStyle = b.done ? '#5dff7a' : '#2e8f45'; g.fillRect(X(b.x - b.w / 2), X(b.z - b.d / 2), b.w * k, b.d * k); }
    for (const u of S.units) { g.fillStyle = S.sel.includes(u) ? '#ffffff' : '#8dff9f'; g.fillRect(X(u.x) - 1.5, X(u.z) - 1.5, u.def.mech ? 5 : 3, u.def.mech ? 5 : 3); }
    g.fillStyle = '#ff5a4d';
    for (const l of S.larvae) g.fillRect(X(l.x) - 1, X(l.z) - 1, 2.5, 2.5);
    const m = S.monster;
    if (m && (m.state === 'active' || m.state === 'dying' || m.state === 'frozen')) {
      if (m.goal && !m.goal.dead && m.state === 'active') {
        g.strokeStyle = 'rgba(255,90,77,.8)'; g.setLineDash([4, 3]); g.beginPath(); g.moveTo(X(m.x), X(m.z)); g.lineTo(X(m.goal.x), X(m.goal.z)); g.stroke(); g.setLineDash([]);
      }
      g.fillStyle = m.exhausted ? '#bfefff' : '#ff3a2a';
      g.beginPath(); g.arc(X(m.x), X(m.z), 5 + Math.sin(performance.now() / 150) * 1.2, 0, TAU); g.fill();
      g.strokeStyle = '#fff'; g.beginPath(); g.moveTo(X(m.x), X(m.z)); g.lineTo(X(m.x + Math.sin(m.rot) * 14), X(m.z + Math.cos(m.rot) * 14)); g.stroke();
    }
    const corners = [[0, 0], [window.innerWidth, 0], [window.innerWidth, window.innerHeight], [0, window.innerHeight]].map(([x, y]) => groundAt(x, y));
    if (corners.every(Boolean)) {
      g.strokeStyle = 'rgba(255,255,255,.75)'; g.beginPath();
      corners.forEach((p, i) => { const px = X(clamp(p.x, -400, 400)), pz = X(clamp(p.z, -400, 400)); if (i) g.lineTo(px, pz); else g.moveTo(px, pz); });
      g.closePath(); g.stroke();
    }
  },

function updateMenuScene(rdt) {
  const M = MenuScene, f = M.fake;
  M.t += rdt; f.t = M.t;
  const cyc = M.t % 16;
  f.glow = cyc > 10 && cyc < 13 ? (cyc - 10) / 3 : cyc >= 13 && cyc < 14.6 ? 1 : Math.max(0, f.glow - rdt);
  f.jaw = cyc > 12.6 && cyc < 14.6 ? 1 : Math.max(0, f.jaw - rdt * 1.5);
  f.headPitch = -0.5 * f.jaw;
  M.m.anim(f, rdt);
  if (cyc > 13 && cyc < 14.6) {
    M.m.head.getWorldPosition(_v1);
    const a = { x: _v1.x, y: _v1.y + 1, z: _v1.z + 2 };
    beam(a, { x: a.x + 20, y: a.y + 160, z: a.z + 90 }, 0x6fd6ff, 2.2 + Math.random() * 0.6, 0.05, 0xeafcff);
  }
  if (cyc > 12.9 && cyc < 13 + rdt) SFX.roar(1, null, 2.6);
  const a = 0.35 + Math.sin(M.t * 0.06) * 0.45;
  camera.position.set(6 + Math.sin(a) * 60, 24 + Math.sin(M.t * 0.15) * 3, -92 + Math.cos(a) * 60);
  camera.lookAt(-22 + Math.sin(a) * 10, 30, -100);
  updateWater(M.map, M.t);
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  if (appMode === 'menu') {
    updateMenuScene(rdt); updateFX(rdt); updateSky();
    renderer.render(scene, camera);
    return;
  }
  if (appMode === 'view') { renderer.render(VIEW.scene, VIEW.cam); return; }
  if (appMode !== 'game' || !S) { updateSky(); renderer.render(scene, camera); return; }
  const ts = S.paused || S.menuPaused ? 0 : S.timeScale * S.speed;
  const dt = rdt * ts;
  if (dt > 0) { const n = Math.ceil(dt / 0.034), h = dt / n; for (let i = 0; i < n; i++) stepGame(h); }
  if (Cine.cur) Cine.update(rdt);
  else if (FPV.u) FPV.update(rdt);
  else if (!S.menuPaused) Cam.update(rdt);
  syncWorld(dt);
  updateFX(dt);
  updateWater(S.map, S.time);
  updateSky();
  if (!S.menuPaused) UI.updateHUD(rdt);
  renderer.render(scene, camera);
}

const VIEW = { scene: null, cam: new THREE.PerspectiveCamera(32, 1, 0.1, 3000) };
function viewModel(obj, { yaw = 0.7, pitch = 0.25, dist = 0, bg = 0x9aa7b4, anim, target } = {}) {
  appMode = 'view';
  $('#screen').classList.remove('on'); $('#hud').classList.add('hidden');
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(bg);
  sc.add(new THREE.HemisphereLight(0xdfe8ff, 0x58604c, 1.2));
  const dl = new THREE.DirectionalLight(0xffffff, 2.6); dl.position.set(60, 100, 50); dl.castShadow = true;
  Object.assign(dl.shadow.camera, { left: -80, right: 80, top: 80, bottom: -80, near: 1, far: 400 }); dl.shadow.mapSize.set(2048, 2048);
  sc.add(dl);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(200, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x7a8a6a, roughness: 1 }));
  floor.receiveShadow = true; sc.add(floor);
  sc.add(obj);
  obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
  const box = new THREE.Box3().setFromObject(obj), c = target ? new THREE.Vector3(...target) : box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const r = dist || (s.length() / 2) / Math.sin(THREE.MathUtils.degToRad(VIEW.cam.fov / 2)) * 0.85;
  VIEW.cam.aspect = window.innerWidth / window.innerHeight; VIEW.cam.updateProjectionMatrix();
  VIEW.cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * r, c.y + Math.sin(pitch) * r, c.z + Math.cos(yaw) * Math.cos(pitch) * r);
  VIEW.cam.lookAt(c);
  VIEW.scene = sc;
  return { size: [s.x, s.y, s.z].map((v) => +v.toFixed(1)) };
}

  build(type, x, z, done = true) { const p = snapPos(type, x, z); if (!placeValid(type, p.x, p.z)) return null; return new PBld(type, p.x, p.z, done); },
  ff(sec) {
    const n = Math.round(sec * 30);
    for (let i = 0; i < n && S && !S.ended; i++) { stepGame(1 / 30); if (Cine.cur) Cine.finish(true); }
    if (Cine.cur) Cine.finish(true);
  },
  spawn(t, n = 1, x = Cam.x, z = Cam.z) { const out = []; for (let i = 0; i < n; i++) out.push(new Unit(t, x + rand(-6, 6), z + rand(-6, 6))); return out; },
  skip() { if (S) S.countdown = 0.01; },
  dbg: { MModels, UModels, BModels, MONUMENTS, cityBuildingMesh, mergeStatic, makeIcon, ICONS, toScreen, groundAt, renderer, scene, camera, AudioSys, Music, Orch, INSTR, SONGS, STINGS, THREE, viewModel, mulberry32, updateFX },
};

function boot() {
  initFX();
  orchLoad();
  try {
    for (const t in UNITS) iconUnit(t);
    for (const t in BUILDINGS) iconBld(t);
    for (const k in MONSTERS) iconMonster(k);
  } catch (e) { console.warn('No se pudieron generar los íconos', e); }
  startMenuScene();
  UI.titleScreen();
  window.__kcBooted = true;
  requestAnimationFrame(frame);
}
boot();
</script>
